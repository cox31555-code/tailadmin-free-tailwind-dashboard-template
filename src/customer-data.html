<!doctype html>
<html lang="en">
  <head>
    <include src="./partials/critical-dark-mode.html"></include>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Customer Data | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
    <style>
      @media (max-width: 640px) {
        .customer-main-content {
          padding: 0 10px;
        }
      }

      @media (max-width: 640px) {
        .customer-table-wrapper {
          padding: 0 10px;
        }
      }

      .table-scroller {
        position: relative;
      }

      .table-scroller::-webkit-scrollbar {
        height: 12px;
      }

      .table-scroller::-webkit-scrollbar-track {
        background: rgba(75, 85, 99, 0.1);
        border-radius: 6px;
        margin: 0 10px;
      }

      .table-scroller::-webkit-scrollbar-thumb {
        background: rgba(59, 130, 246, 0.7);
        border-radius: 6px;
        transition: background 0.3s ease;
      }

      .table-scroller::-webkit-scrollbar-thumb:hover {
        background: rgba(59, 130, 246, 0.95);
      }

      .table-scroller {
        scrollbar-width: thin;
        scrollbar-color: rgba(59, 130, 246, 0.7) rgba(75, 85, 99, 0.1);
      }

      .dark .table-scroller::-webkit-scrollbar-track {
        background: rgba(31, 41, 55, 0.1);
      }

      @media (max-width: 640px) {
        .table-scroller {
          height: 945px;
        }
      }
    </style>
  </head>
  <body
    x-data="{ page: 'customerData', 'isLoading': false, 'darkMode': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? true;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6 customer-main-content">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Customer Data`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div class="space-y-5 sm:space-y-6">
              <div
                class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
              >
                <div class="px-5 py-4 sm:px-6 sm:py-5">
                  <h3
                    class="text-base font-medium text-gray-800 dark:text-white/90"
                  >
                    Customer Data
                  </h3>
                </div>
                <div
                  class="p-5 border-t border-gray-100 dark:border-gray-800 sm:p-6 customer-table-wrapper"
                >
                  <!-- ====== Customer Data Table Start -->
                  <include src="./partials/table/table-customer-data.html" />
                  <!-- ====== Customer Data Table End -->
                </div>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
