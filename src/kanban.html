      tasks: [

        },
        {

          description: 'The annual policies table is slow when searching with multiple filters',
          column: 'done',
          priority: 'high',
          assignee: 'John Smith',

          dueDate: '2024-12-28',

          createdAt: '2024-12-10T08:00:00',

        },
        {
          id: '6',
          title: 'Add payment schedule tracking',
          description: 'Allow marking individual monthly payments as paid/unpaid in policy details',
          column: 'done',
          priority: 'medium',
          assignee: 'Sarah Johnson',
          assigneeAvatar: 'https://ui-avatars.com/api/?name=Sarah+Johnson&background=EF4444&color=fff',
          dueDate: '2024-12-29',
          labels: ['feature', 'payments'],
          createdAt: '2024-12-12T13:15:00',
          updatedAt: '2024-12-29T10:30:00',
          attachments: 3,
          comments: 6
        },
        {
          id: '7',
          title: 'Setup automated email notifications',
          description: 'Configure email templates and automation for policy renewals and payment reminders',
          column: 'todo',
          priority: 'low',
          assignee: 'Mike Davis',
          assigneeAvatar: 'https://ui-avatars.com/api/?name=Mike+Davis&background=8B5CF6&color=fff',
          dueDate: '2025-01-20',
          labels: ['automation', 'notifications'],
          createdAt: '2024-12-19T15:45:00',
          updatedAt: '2024-12-25T11:20:00',
          attachments: 1,
          comments: 1
        }
      ],
      
      newTask: {
        title: '',
        description: '',
        column: 'todo',
        priority: 'medium',
        assignee: '',
        dueDate: '',
        labels: []
      },
      
      newColumn: {
        name: '',
        color: '#3B82F6',
        limit: null
      },
      
      // Methods
      init() {
        this.loadKanbanData();
      },
      
      loadKanbanData() {
        const savedColumns = localStorage.getItem('kanban_columns');
        const savedTasks = localStorage.getItem('kanban_tasks');
        
        if (savedColumns) {
          this.columns = JSON.parse(savedColumns);
        }
        if (savedTasks) {
          this.tasks = JSON.parse(savedTasks);
        }
      },
      
      saveKanbanData() {
        localStorage.setItem('kanban_columns', JSON.stringify(this.columns));
        localStorage.setItem('kanban_tasks', JSON.stringify(this.tasks));
      },
      
      getTasksForColumn(columnId) {
        return this.getFilteredTasks().filter(task => task.column === columnId);
      },
      
      getFilteredTasks() {
        let filtered = this.tasks;
        
        // Search filter
        if (this.searchQuery) {
          const query = this.searchQuery.toLowerCase();
          filtered = filtered.filter(task => 
            task.title.toLowerCase().includes(query) ||
            task.description.toLowerCase().includes(query) ||
            task.labels.some(label => label.toLowerCase().includes(query))
          );
        }
        
        // Priority filter
        if (this.filterPriority !== 'all') {
          filtered = filtered.filter(task => task.priority === this.filterPriority);
        }
        
        // Assignee filter
        if (this.filterAssignee !== 'all') {
          filtered = filtered.filter(task => task.assignee === this.filterAssignee);
        }
        
        // Sort
        filtered.sort((a, b) => {
          if (this.sortBy === 'created') {
            return new Date(b.createdAt) - new Date(a.createdAt);
          } else if (this.sortBy === 'updated') {
            return new Date(b.updatedAt) - new Date(a.updatedAt);
          } else if (this.sortBy === 'dueDate') {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return new Date(a.dueDate) - new Date(b.dueDate);
          } else if (this.sortBy === 'priority') {
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            return priorityOrder[a.priority] - priorityOrder[b.priority];
          }
          return 0;
        });
        
        return filtered;
      },
      
      getUniqueAssignees() {
        const assignees = [...new Set(this.tasks.map(task => task.assignee))];
        return assignees.filter(a => a);
      },
      
      openAddTaskModal(columnId) {
        this.newTask = {
          title: '',
          description: '',
          column: columnId || 'todo',
          priority: 'medium',
          assignee: '',
          dueDate: '',
          labels: []
        };
        this.showAddTaskModal = true;
      },
      
      openEditTaskModal(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (task) {
          this.editingTaskId = taskId;
          this.newTask = { ...task };
          this.showEditTaskModal = true;
        }
      },
      
      addTask() {
        const task = {
          ...this.newTask,
          id: Date.now().toString(),
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          assigneeAvatar: this.newTask.assignee ? 
            `https://ui-avatars.com/api/?name=${encodeURIComponent(this.newTask.assignee)}&background=3B82F6&color=fff` : '',
          attachments: 0,
          comments: 0
        };
        this.tasks.push(task);
        this.saveKanbanData();
        this.showAddTaskModal = false;
      },
      
      updateTask() {
        const index = this.tasks.findIndex(t => t.id === this.editingTaskId);
        if (index !== -1) {
          this.tasks[index] = {
            ...this.tasks[index],
            ...this.newTask,
            updatedAt: new Date().toISOString(),
            assigneeAvatar: this.newTask.assignee ? 
              `https://ui-avatars.com/api/?name=${encodeURIComponent(this.newTask.assignee)}&background=3B82F6&color=fff` : ''
          };
          this.saveKanbanData();
        }
        this.showEditTaskModal = false;
        this.editingTaskId = null;
      },
      
      deleteTask(taskId) {
        if (confirm('Are you sure you want to delete this task?')) {
          this.tasks = this.tasks.filter(t => t.id !== taskId);
          this.saveKanbanData();
        }
      },
      
      duplicateTask(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (task) {
          const newTask = {
            ...task,
            id: Date.now().toString(),
            title: task.title + ' (Copy)',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          this.tasks.push(newTask);
          this.saveKanbanData();
        }
      },
      
      startDrag(taskId, columnId) {
        this.draggedTaskId = taskId;
        this.draggedFromColumn = columnId;
      },
      
      allowDrop(event) {
        event.preventDefault();
      },
      
      drop(columnId) {
        if (this.draggedTaskId) {
          const task = this.tasks.find(t => t.id === this.draggedTaskId);
          if (task) {
            task.column = columnId;
            task.updatedAt = new Date().toISOString();
            this.saveKanbanData();
          }
          this.draggedTaskId = null;
          this.draggedFromColumn = null;
        }
      },
      
      openColumnModal(columnId = null) {
        if (columnId) {
          const column = this.columns.find(c => c.id === columnId);
          if (column) {
            this.editingColumnId = columnId;
            this.newColumn = { ...column };
          }
        } else {
          this.editingColumnId = null;
          this.newColumn = {
            name: '',
            color: '#3B82F6',
            limit: null
          };
        }
        this.showColumnModal = true;
      },
      
      saveColumn() {
        if (this.editingColumnId) {
          const index = this.columns.findIndex(c => c.id === this.editingColumnId);
          if (index !== -1) {
            this.columns[index] = {
              ...this.columns[index],
              ...this.newColumn
            };
          }
        } else {
          const column = {
            ...this.newColumn,
            id: this.newColumn.name.toLowerCase().replace(/\\s+/g, '-')
          };
          this.columns.push(column);
        }
        this.saveKanbanData();
        this.showColumnModal = false;
        this.editingColumnId = null;
      },
      
      deleteColumn(columnId) {
        if (confirm('Are you sure? All tasks in this column will be moved to Backlog.')) {
          this.tasks = this.tasks.map(task => {
            if (task.column === columnId) {
              task.column = 'backlog';
            }
            return task;
          });
          this.columns = this.columns.filter(c => c.id !== columnId);
          this.saveKanbanData();
        }
      },
      
      getPriorityColor(priority) {
        const colors = {
          high: 'bg-red-100 text-red-700 dark:bg-red-900/20 dark:text-red-400',
          medium: 'bg-orange-100 text-orange-700 dark:bg-orange-900/20 dark:text-orange-400',
          low: 'bg-blue-100 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400'
        };
        return colors[priority] || colors.medium;
      },
      
      getDueDateStatus(dueDate) {
        if (!dueDate) return 'none';
        const due = new Date(dueDate);
        const today = new Date();
        const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
        
        if (diffDays < 0) return 'overdue';
        if (diffDays <= 2) return 'urgent';
        if (diffDays <= 7) return 'soon';
        return 'normal';
      },
      
      formatDueDate(dueDate) {
        if (!dueDate) return '';
        return new Date(dueDate).toLocaleDateString('en-GB', { 
          day: '2-digit', 
          month: 'short' 
        });
      },
      
      clearFilters() {
        this.searchQuery = '';
        this.filterPriority = 'all';
        this.filterAssignee = 'all';
        this.sortBy = 'created';
      }
    }"
