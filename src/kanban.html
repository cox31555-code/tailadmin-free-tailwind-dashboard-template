        if (this.activeBoard) {

        return this.tasks.find(t => t.id === this.viewingTaskId) || null;

          column: 'todo',

      newTask: {
        title: '',

        priority: 'medium',

        labels: []
      },
      
      newColumn: {
        name: '',
        color: '#3B82F6',
        limit: null
      },
      
      // Methods
      init() {
        this.loadBoards();
        this.initSortable();

        // Listen for task moved events from SortableJS
        window.addEventListener('kanban:taskMoved', (e) => {
          this.handleTaskMoved(e.detail);
        });

        // Listen for column moved events from SortableJS
        window.addEventListener('kanban:columnMoved', (e) => {
          this.handleColumnMoved(e.detail);
        });
      },

      loadBoards() {
        const savedBoards = localStorage.getItem('kanban_boards');
        const savedActiveId = localStorage.getItem('kanban_activeBoard');

        if (savedBoards) {
          this.boards = JSON.parse(savedBoards);
        } else {
          // Try to migrate old data or create default board
          this.migrateOldData();
        }

        // Set active board
        this.activeBoardId = savedActiveId || (this.boards[0] ? this.boards[0].id : null);

        if (!this.activeBoard && this.boards.length > 0) {
          this.switchBoard(this.boards[0].id);
        }
      },

      migrateOldData() {
        const oldColumns = localStorage.getItem('kanban_columns');
        const oldTasks = localStorage.getItem('kanban_tasks');

        if (oldColumns || oldTasks) {
          // Migrate existing data to new board structure
          const defaultBoard = {
            id: Date.now().toString(),
            name: 'Main Board',
            color: '#3B82F6',
            isDefault: true,
            createdAt: new Date().toISOString(),
            columns: oldColumns ? JSON.parse(oldColumns) : this._defaultColumns,
            tasks: oldTasks ? JSON.parse(oldTasks) : this._defaultTasks
          };

          this.boards = [defaultBoard];
          this.saveBoards();

          // Clean up old keys
          localStorage.removeItem('kanban_columns');
          localStorage.removeItem('kanban_tasks');
        } else {
          // Create first default board with sample data
          this.createDefaultBoard();
        }
      },

      createDefaultBoard() {
        const board = {
          id: Date.now().toString(),
          name: 'My First Board',
          color: '#3B82F6',
          isDefault: true,
          createdAt: new Date().toISOString(),
          columns: JSON.parse(JSON.stringify(this._defaultColumns)),
          tasks: JSON.parse(JSON.stringify(this._defaultTasks))
        };

        this.boards = [board];
        this.saveBoards();
        this.activeBoardId = board.id;
      },

      saveBoards() {
        localStorage.setItem('kanban_boards', JSON.stringify(this.boards));
        if (this.activeBoardId) {
          localStorage.setItem('kanban_activeBoard', this.activeBoardId);
        }
      },

      switchBoard(boardId) {
        this.activeBoardId = boardId;
        localStorage.setItem('kanban_activeBoard', boardId);
        // Reinitialize SortableJS for new board
        this.sortableInitialized = false;
        this.$nextTick(() => {
          this.initSortable();
        });

        // Dispatch event for calendar sync
        window.dispatchEvent(new CustomEvent('kanban:boardSwitched', { detail: { boardId } }));
      },

      openBoardModal(boardId = null) {
        if (boardId) {
          const board = this.boards.find(b => b.id === boardId);
          if (board) {
            this.newBoard = { name: board.name, color: board.color, editingId: boardId };
          }
        } else {
          this.newBoard = { name: '', color: '#3B82F6' };
        }
        this.showBoardModal = true;
      },

      createBoard() {
        if (this.newBoard.editingId) {
          // Update existing board
          const board = this.boards.find(b => b.id === this.newBoard.editingId);
          if (board) {
            board.name = this.newBoard.name;
            board.color = this.newBoard.color;
          }
        } else {
          // Create new board
          const board = {
            id: Date.now().toString(),
            name: this.newBoard.name,
            color: this.newBoard.color,
            isDefault: false,
            createdAt: new Date().toISOString(),
            columns: JSON.parse(JSON.stringify(this._defaultColumns)),
            tasks: []
          };

          this.boards.push(board);
          this.switchBoard(board.id);
        }

        this.saveBoards();
        this.showBoardModal = false;
      },

      deleteBoard(boardId) {
        if (this.boards.length === 1) {
          alert('Cannot delete the last board.');
          return;
        }

        if (confirm('Are you sure you want to delete this board? All tasks will be lost.')) {
          this.boards = this.boards.filter(b => b.id !== boardId);

          if (this.activeBoardId === boardId) {
            this.switchBoard(this.boards[0].id);
          }

          this.saveBoards();
        }
      },

      initSortable() {
        console.log('🚀 Initializing SortableJS...');
        if (!this.sortableInitialized) {
          import('./js/components/kanban-sortable-init.js').then(module => {
            console.log('📦 Module loaded successfully');
            module.initKanbanSortable(this);
            this.sortableInitialized = true;
            console.log('✅ SortableJS initialization complete');
          }).catch(err => {
            console.error('❌ Failed to load SortableJS:', err);
          });
        } else {
          console.log('⚠️ SortableJS already initialized');
        }
      },

      handleTaskMoved(detail) {
        const { taskId, newColumnId, oldColumnId, newIndex } = detail;
        const task = this.tasks.find(t => t.id === taskId);

        if (!task) return;

        // Check WIP limit before moving
        const column = this.columns.find(c => c.id === newColumnId);
        if (this.enforceWIPLimits && column && column.limit && oldColumnId !== newColumnId) {
          const tasksInColumn = this.tasks.filter(t => t.column === newColumnId && t.id !== taskId).length;

          if (tasksInColumn >= column.limit) {
            alert(`Cannot move task: ${column.name} has reached its WIP limit of ${column.limit}.`);
            // Reload to revert the UI change
            location.reload();
            return;
          }
        }

        // Update task column and position
        task.column = newColumnId;
        task.position = newIndex;
        task.updatedAt = new Date().toISOString();

        // Recalculate positions for all tasks in the target column
        this.recalculateColumnPositions(newColumnId);

        // Show WIP warning if over limit (but not enforcing)
        if (!this.enforceWIPLimits && column && column.limit) {
          const tasksInColumn = this.tasks.filter(t => t.column === newColumnId).length;
          if (tasksInColumn > column.limit) {
            console.warn(`Warning: ${column.name} has ${tasksInColumn} tasks, exceeding the WIP limit of ${column.limit}.`);
          }
        }

        this.saveKanbanData();

        // Dispatch event for calendar sync
        window.dispatchEvent(new CustomEvent('kanban:taskUpdated', { detail: task }));
      },

      handleColumnMoved(detail) {
        const { oldIndex, newIndex } = detail;

        if (!this.activeBoard || oldIndex === newIndex) return;

        // Reorder columns array
        const column = this.columns.splice(oldIndex, 1)[0];
        this.columns.splice(newIndex, 0, column);

        // Save to localStorage
        this.saveKanbanData();

        console.log(`Column moved from position ${oldIndex} to ${newIndex}`);
      },

      recalculateColumnPositions(columnId) {
        const columnTasks = this.tasks
          .filter(t => t.column === columnId)
          .sort((a, b) => (a.position || 0) - (b.position || 0));

        columnTasks.forEach((task, index) => {
          task.position = index;
        });
      },
      
      saveKanbanData() {
        // Save the active board's changes
        if (this.activeBoard) {
          const boardIndex = this.boards.findIndex(b => b.id === this.activeBoardId);
          if (boardIndex !== -1) {
            this.boards[boardIndex] = this.activeBoard;
          }
          this.saveBoards();
        }
      },
      
      getTasksForColumn(columnId) {
        return this.getFilteredTasks()
          .filter(task => task.column === columnId)
          .sort((a, b) => (a.position || 0) - (b.position || 0));
      },
      
      getFilteredTasks() {
        let filtered = this.tasks;
        
        // Search filter
        if (this.searchQuery) {
          const query = this.searchQuery.toLowerCase();
          filtered = filtered.filter(task => 
            task.title.toLowerCase().includes(query) ||
            task.description.toLowerCase().includes(query) ||
            task.labels.some(label => label.toLowerCase().includes(query))
          );
        }
        
        // Priority filter
        if (this.filterPriority !== 'all') {
          filtered = filtered.filter(task => task.priority === this.filterPriority);
        }
        
        // Assignee filter
        if (this.filterAssignee !== 'all') {
          filtered = filtered.filter(task => task.assignee === this.filterAssignee);
        }
        
        // Sort
        filtered.sort((a, b) => {
          if (this.sortBy === 'created') {
            return new Date(b.createdAt) - new Date(a.createdAt);
          } else if (this.sortBy === 'updated') {
            return new Date(b.updatedAt) - new Date(a.updatedAt);
          } else if (this.sortBy === 'dueDate') {
            if (!a.dueDate) return 1;
            if (!b.dueDate) return -1;
            return new Date(a.dueDate) - new Date(b.dueDate);
          } else if (this.sortBy === 'priority') {
            const priorityOrder = { high: 0, medium: 1, low: 2 };
            return priorityOrder[a.priority] - priorityOrder[b.priority];
          }
          return 0;
        });
        
        return filtered;
      },
      
      getUniqueAssignees() {
        const assignees = [...new Set(this.tasks.map(task => task.assignee))];
        return assignees.filter(a => a);
      },
      
      openAddTaskModal(columnId) {
        this.newTask = {
          title: '',
          description: '',
          column: columnId || 'todo',
          priority: 'medium',
          assignee: '',
          dueDate: '',
          labels: []
        };
        this.showAddTaskModal = true;
      },
      
      openEditTaskModal(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (task) {
          this.editingTaskId = taskId;
          this.newTask = { ...task };
          this.showEditTaskModal = true;
        }
      },
      
      addTask() {
        // Calculate position for new task in column
        const columnTasks = this.tasks.filter(t => t.column === this.newTask.column);
        const maxPosition = columnTasks.length > 0
          ? Math.max(...columnTasks.map(t => t.position || 0))
          : -1;

        const task = {
          ...this.newTask,
          id: Date.now().toString(),
          position: maxPosition + 1,
          createdAt: new Date().toISOString(),
          updatedAt: new Date().toISOString(),
          assigneeAvatar: this.newTask.assignee ?
            `https://ui-avatars.com/api/?name=${encodeURIComponent(this.newTask.assignee)}&background=3B82F6&color=fff` : '',
          attachments: 0,
          comments: 0
        };
        this.tasks.push(task);
        this.saveKanbanData();

        // Dispatch event for calendar sync
        window.dispatchEvent(new CustomEvent('kanban:taskAdded', { detail: task }));

        this.showAddTaskModal = false;
      },
      
      updateTask() {
        const index = this.tasks.findIndex(t => t.id === this.editingTaskId);
        if (index !== -1) {
          this.tasks[index] = {
            ...this.tasks[index],
            ...this.newTask,
            updatedAt: new Date().toISOString(),
            assigneeAvatar: this.newTask.assignee ?
              `https://ui-avatars.com/api/?name=${encodeURIComponent(this.newTask.assignee)}&background=3B82F6&color=fff` : ''
          };
          this.saveKanbanData();

          // Dispatch event for calendar sync
          window.dispatchEvent(new CustomEvent('kanban:taskUpdated', { detail: this.tasks[index] }));
        }
        this.showEditTaskModal = false;
        this.editingTaskId = null;
      },
      
      deleteTask(taskId) {
        if (confirm('Are you sure you want to delete this task?')) {
          this.tasks = this.tasks.filter(t => t.id !== taskId);
          this.saveKanbanData();

          // Dispatch event for calendar sync
          window.dispatchEvent(new CustomEvent('kanban:taskDeleted', { detail: { id: taskId } }));
        }
      },
      
      duplicateTask(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (task) {
          const newTask = {
            ...task,
            id: Date.now().toString(),
            title: task.title + ' (Copy)',
            createdAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
          };
          this.tasks.push(newTask);
          this.saveKanbanData();
        }
      },
      
      startDrag(taskId, columnId) {
        this.draggedTaskId = taskId;
        this.draggedFromColumn = columnId;
      },
      
      allowDrop(event) {
        event.preventDefault();
      },
      
      drop(columnId) {
        if (this.draggedTaskId) {
          const task = this.tasks.find(t => t.id === this.draggedTaskId);
          if (task) {
            task.column = columnId;
            task.updatedAt = new Date().toISOString();
            this.saveKanbanData();
          }
          this.draggedTaskId = null;
          this.draggedFromColumn = null;
        }
      },
      
      openColumnModal(columnId = null) {
        if (columnId) {
          const column = this.columns.find(c => c.id === columnId);
          if (column) {
            this.editingColumnId = columnId;
            this.newColumn = { ...column };
          }
        } else {
          this.editingColumnId = null;
          this.newColumn = {
            name: '',
            color: '#3B82F6',
            limit: null
          };
        }
        this.showColumnModal = true;
      },
      
      saveColumn() {
        if (this.editingColumnId) {
          const index = this.columns.findIndex(c => c.id === this.editingColumnId);
          if (index !== -1) {
            this.columns[index] = {
              ...this.columns[index],
              ...this.newColumn
            };
          }
        } else {
          const column = {
            ...this.newColumn,
            id: this.newColumn.name.toLowerCase().replace(/\\s+/g, '-')
          };
          this.columns.push(column);
        }
        this.saveKanbanData();
        this.showColumnModal = false;
        this.editingColumnId = null;
      },
      
      deleteColumn(columnId) {
        if (confirm('Are you sure? All tasks in this column will be moved to Backlog.')) {
          this.tasks = this.tasks.map(task => {
            if (task.column === columnId) {
              task.column = 'backlog';
            }
            return task;
          });
          this.columns = this.columns.filter(c => c.id !== columnId);
          this.saveKanbanData();
        }
      },
      
      getPriorityColor(priority) {
        const colors = {
          high: 'bg-red-100 text-red-700 dark:bg-red-900/20 dark:text-red-400',
          medium: 'bg-orange-100 text-orange-700 dark:bg-orange-900/20 dark:text-orange-400',
          low: 'bg-blue-100 text-blue-700 dark:bg-blue-900/20 dark:text-blue-400'
        };
        return colors[priority] || colors.medium;
      },
      
      getDueDateStatus(dueDate) {
        if (!dueDate) return 'none';
        const due = new Date(dueDate);
        const today = new Date();
        const diffDays = Math.ceil((due - today) / (1000 * 60 * 60 * 24));
        
        if (diffDays < 0) return 'overdue';
        if (diffDays <= 2) return 'urgent';
        if (diffDays <= 7) return 'soon';
        return 'normal';
      },
      
      formatDueDate(dueDate) {
        if (!dueDate) return '';
        return new Date(dueDate).toLocaleDateString('en-GB', { 
          day: '2-digit', 
          month: 'short' 
        });
      },
      
      clearFilters() {
        this.searchQuery = '';
        this.filterPriority = 'all';
        this.filterAssignee = 'all';
        this.sortBy = 'created';
      },

      // Analytics Methods
      async refreshAnalytics() {
        if (!this.activeBoard || !this.activeBoard.tasks) return;

        // Dynamically import analytics module
        const { renderKanbanAnalytics, renderCycleTimeChart } = await import('./js/components/charts/kanban-analytics.js');

        // Wait a tick for DOM to be ready
        this.$nextTick(() => {
          renderKanbanAnalytics(this.activeBoard.tasks);
          renderCycleTimeChart(this.activeBoard.tasks);
        });
      },

      calculateAvgTasksPerDay() {
        if (!this.activeBoard || !this.activeBoard.tasks || this.activeBoard.tasks.length === 0) {
          return '0';
        }

        const now = new Date();
        const thirtyDaysAgo = new Date(now.getTime() - (30 * 24 * 60 * 60 * 1000));

        const recentTasks = this.activeBoard.tasks.filter(task => {
          const taskDate = new Date(task.createdAt);
          return taskDate >= thirtyDaysAgo;
        });

        const avg = (recentTasks.length / 30).toFixed(1);
        return avg;
      },

      calculateOverdueTasks() {
        if (!this.activeBoard || !this.activeBoard.tasks) return 0;

        const today = new Date();
        today.setHours(0, 0, 0, 0);

        return this.activeBoard.tasks.filter(task => {
          if (!task.dueDate || task.column === 'done') return false;
          const dueDate = new Date(task.dueDate);
          dueDate.setHours(0, 0, 0, 0);
          return dueDate < today;
        }).length;
      },

      // Task Detail Modal Methods
      openTaskDetail(taskId) {
        this.viewingTaskId = taskId;
        this.newComment = '';
        this.showTaskDetailModal = true;
      },

      addComment() {
        const task = this.viewingTask;
        if (!task || !this.newComment.trim()) return;

        if (!task.comments) task.comments = [];

        const comment = {
          id: Date.now().toString(),
          author: 'Current User',
          authorAvatar: 'https://ui-avatars.com/api/?name=Current+User&background=3B82F6&color=fff',
          text: this.newComment.trim(),
          createdAt: new Date().toISOString(),
          reactions: {}
        };

        task.comments.push(comment);
        task.updatedAt = new Date().toISOString();
        this.newComment = '';
        this.saveKanbanData();
      },

      addReaction(commentId, emoji) {
        const task = this.viewingTask;
        const comment = task?.comments?.find(c => c.id === commentId);

        if (comment) {
          if (!comment.reactions) comment.reactions = {};
          comment.reactions[emoji] = (comment.reactions[emoji] || 0) + 1;
          task.updatedAt = new Date().toISOString();
          this.saveKanbanData();
        }
      },

      formatCommentDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        const diffDays = Math.floor(diffMs / 86400000);

        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        if (diffDays < 7) return `${diffDays}d ago`;

        return date.toLocaleDateString('en-GB', {
          day: '2-digit',
          month: 'short',
          year: date.getFullYear() !== now.getFullYear() ? 'numeric' : undefined
        });
      },

      // Time Tracking Methods
      startTimer(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (task && !task.timerRunning) {
          task.timerRunning = true;
          task.timerStartedAt = new Date().toISOString();
          this.saveKanbanData();
        }
      },

      stopTimer(taskId) {
        const task = this.tasks.find(t => t.id === taskId);
        if (task && task.timerRunning) {
          const duration = Math.floor((new Date() - new Date(task.timerStartedAt)) / 1000);

          if (!task.timeLogs) task.timeLogs = [];
          task.timeLogs.push({
            id: Date.now().toString(),
            startedAt: task.timerStartedAt,
            endedAt: new Date().toISOString(),
            duration,
            note: ''
          });

          task.totalTimeSpent = (task.totalTimeSpent || 0) + duration;
          task.timerRunning = false;
          task.timerStartedAt = null;
          task.updatedAt = new Date().toISOString();
          this.saveKanbanData();
        }
      },

      formatDuration(seconds) {
        if (!seconds) return '0h 0m';
        const hours = Math.floor(seconds / 3600);
        const minutes = Math.floor((seconds % 3600) / 60);

        if (hours > 0) {
          return `${hours}h ${minutes}m`;
        }
        return `${minutes}m`;
      },

      // Bulk Operations Methods
      toggleBulkMode() {
        this.bulkMode = !this.bulkMode;
        if (!this.bulkMode) {
          this.selectedTasks = [];
        }
      },

      toggleTaskSelection(taskId) {
        const index = this.selectedTasks.indexOf(taskId);
        if (index > -1) {
          this.selectedTasks.splice(index, 1);
        } else {
          this.selectedTasks.push(taskId);
        }
      },

      selectAllInColumn(columnId) {
        const columnTaskIds = this.getTasksForColumn(columnId).map(t => t.id);
        // Toggle: if all are selected, deselect all; otherwise select all
        const allSelected = columnTaskIds.every(id => this.selectedTasks.includes(id));

        if (allSelected) {
          this.selectedTasks = this.selectedTasks.filter(id => !columnTaskIds.includes(id));
        } else {
          const newSelections = columnTaskIds.filter(id => !this.selectedTasks.includes(id));
          this.selectedTasks.push(...newSelections);
        }
      },

      bulkMoveToColumn(columnId) {
        if (!this.selectedTasks.length) return;

        this.selectedTasks.forEach(taskId => {
          const task = this.tasks.find(t => t.id === taskId);
          if (task) {
            task.column = columnId;
            task.updatedAt = new Date().toISOString();

            // Dispatch event for calendar sync
            window.dispatchEvent(new CustomEvent('kanban:taskUpdated', { detail: task }));
          }
        });

        this.saveKanbanData();
        this.selectedTasks = [];
        this.bulkMode = false;
      },

      bulkDelete() {
        if (!this.selectedTasks.length) return;

        if (confirm(`Delete ${this.selectedTasks.length} task(s)? This action cannot be undone.`)) {
          this.selectedTasks.forEach(taskId => {
            // Dispatch event for calendar sync
            window.dispatchEvent(new CustomEvent('kanban:taskDeleted', { detail: { id: taskId } }));
          });

          this.tasks = this.tasks.filter(t => !this.selectedTasks.includes(t.id));
          this.saveKanbanData();
          this.selectedTasks = [];
          this.bulkMode = false;
        }
      },

      bulkAssign(assignee) {
        if (!this.selectedTasks.length || !assignee) return;

        this.selectedTasks.forEach(taskId => {
          const task = this.tasks.find(t => t.id === taskId);
          if (task) {
            task.assignee = assignee;
            task.assigneeAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(assignee)}&background=3B82F6&color=fff`;
            task.updatedAt = new Date().toISOString();

            // Dispatch event for calendar sync
            window.dispatchEvent(new CustomEvent('kanban:taskUpdated', { detail: task }));
          }
        });

        this.saveKanbanData();
      },

      bulkSetPriority(priority) {
        if (!this.selectedTasks.length || !priority) return;

        this.selectedTasks.forEach(taskId => {
          const task = this.tasks.find(t => t.id === taskId);
          if (task) {
            task.priority = priority;
            task.updatedAt = new Date().toISOString();

            // Dispatch event for calendar sync
            window.dispatchEvent(new CustomEvent('kanban:taskUpdated', { detail: task }));
          }
        });

        this.saveKanbanData();
      }
    }"
