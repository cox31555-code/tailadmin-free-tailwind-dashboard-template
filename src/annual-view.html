      // Methods
      init() {
        this.loadPolicyData();
      },
      
      loadPolicyData() {
        // Load from URL params or localStorage
        const urlParams = new URLSearchParams(window.location.search);
        const ref = urlParams.get('ref');
        
        if (ref) {
          this.policyRef = ref;
          // Try to load saved data for this policy
          const savedData = localStorage.getItem('policy_' + ref);
          if (savedData) {
            const data = JSON.parse(savedData);
            Object.keys(data).forEach(key => {
              if (this.hasOwnProperty(key)) {
                this[key] = data[key];
              }
            });
          }
        } else {
          // Generate new reference
          this.policyRef = this.generateRef();
        }
      },
      
      generateRef() {
        const year = new Date().getFullYear();
        const random = Math.random().toString(36).substr(2, 6).toUpperCase();
        return 'REF-' + year + '-' + random;
      },
      
      toggleEditMode(sectionName) {
        if (!this.editMode[sectionName]) {
          // Entering edit mode - backup current values
          this.backupSectionValues(sectionName);
        }
        this.editMode[sectionName] = !this.editMode[sectionName];
      },
      
      backupSectionValues(sectionName) {
        // Store original values for cancel functionality
        const fields = this.getSectionFields(sectionName);
        this.originalValues[sectionName] = {};
        fields.forEach(field => {
          this.originalValues[sectionName][field] = this[field];
        });
      },
      
      getSectionFields(sectionName) {
        const sectionMap = {
          'carDetails': ['changingVehicle', 'vrmLookupMode', 'vrm', 'vehicleType', 'vehicleMake', 'vehicleModel', 'vehicleYear', 'vehicleDoors', 'vehicleFuelType', 'vehicleTransmission', 'vehicleColour', 'carMake', 'alarm', 'tracking', 'import', 'driverSide', 'seats', 'modifications'],
          'carValue': ['marketValue'],
          'carUsageSection': ['whenBought', 'carUsage', 'annualMileage'],
          'carStorage': ['daytimeStorage', 'nighttimeStorage', 'keptAtHome'],
          'aboutYou': ['customerName', 'title', 'firstName', 'surname', 'dob', 'relationshipStatus'],
          'household': ['homeAddress', 'city', 'county', 'postcode', 'homeowner', 'childrenUnder16', 'livedInUKSinceBirth'],
          'employment': ['employmentStatus', 'occupation', 'industry'],
          'licence': ['licenceType', 'yearsHeld', 'additionalQualifications', 'dvlaConditions', 'dvlaConditionType', 'insuranceDenied', 'nonMotoringConvictions'],
          'claims': ['claimsLast5Years', 'hasDetailedClaims', 'claimIncidentType', 'claimFault', 'claimDriver', 'claimInjuries', 'claimDay', 'claimMonth', 'claimYear', 'claimDamageType', 'claimAgainstPolicy', 'claimNCDaffected'],
          'convictions': ['motoringConvictionsLast5Years', 'hasDetailedConvictions', 'convictionLocation', 'convictionType', 'convictionCode', 'convictionDay', 'convictionMonth', 'convictionYear', 'convictionPenaltyPoints', 'convictionPointsAmount', 'convictionFine', 'convictionFineAmount', 'convictionBan', 'convictionBanMonths'],
          'additionalDrivers': ['additionalDrivers'],
          'carOwner': ['mainDriver', 'registeredKeeper', 'legalOwner'],
          'cover': ['coverType', 'voluntaryExcess', 'paymentPreference', 'policyStartDate'],
          'ncd': ['noClaimsYears', 'noClaimsSource', 'protectedNoClaimsDiscount'],
          'additionalProducts': ['personalAccidentCover', 'courtesyCar', 'breakdownCover', 'motorLegalProtection'],
          'contact': ['email', 'phoneNumber', 'canProvidersContact']
        };
        return sectionMap[sectionName] || [];
      },
      
      async saveSection(sectionName) {
        this.savingField[sectionName] = true;

        // Sync customerName from title, firstName, surname if saving aboutYou
        if (sectionName === 'aboutYou') {
          this.customerName = `${this.title} ${this.firstName} ${this.surname}`;
        }

        // Simulate API call
        await new Promise(resolve => setTimeout(resolve, 1500));

        // Save all policy data to localStorage
        const policyData = this.getPolicyData();
        localStorage.setItem('policy_' + this.policyRef, JSON.stringify(policyData));
        
        this.savingField[sectionName] = false;
        this.savedField[sectionName] = true;
        this.editMode[sectionName] = false;
        
        // Auto-hide success message after 3 seconds
        setTimeout(() => {
          this.savedField[sectionName] = false;
        }, 3000);
      },
      
      cancelEdit(sectionName) {
        // Restore original values
        const fields = this.getSectionFields(sectionName);
        if (this.originalValues[sectionName]) {
          fields.forEach(field => {
            this[field] = this.originalValues[sectionName][field];
          });
        }
        this.editMode[sectionName] = false;
      },
      
      getPolicyData() {
        // Collect all field data for persistence
        return {
          policyRef: this.policyRef,
          status: this.status,
          policyStart: this.policyStart,
          policyEnd: this.policyEnd,

          relationshipStatus: this.relationshipStatus,
          homeAddress: this.homeAddress,

          county: this.county,

          homeowner: this.homeowner,
          childrenUnder16: this.childrenUnder16,
          livedInUKSinceBirth: this.livedInUKSinceBirth,
          employmentStatus: this.employmentStatus,
          occupation: this.occupation,
          industry: this.industry,
          licenceType: this.licenceType,
          yearsHeld: this.yearsHeld,
          additionalQualifications: this.additionalQualifications,
          dvlaConditions: this.dvlaConditions,
          insuranceDenied: this.insuranceDenied,
          nonMotoringConvictions: this.nonMotoringConvictions,
          claimsLast5Years: this.claimsLast5Years,
          motoringConvictionsLast5Years: this.motoringConvictionsLast5Years,
          additionalDrivers: this.additionalDrivers,
          mainDriver: this.mainDriver,
          registeredKeeper: this.registeredKeeper,
          legalOwner: this.legalOwner,
          coverType: this.coverType,
          voluntaryExcess: this.voluntaryExcess,
          paymentPreference: this.paymentPreference,
          policyStartDate: this.policyStartDate,
          noClaimsYears: this.noClaimsYears,
          noClaimsSource: this.noClaimsSource,
          protectedNoClaimsDiscount: this.protectedNoClaimsDiscount,
          personalAccidentCover: this.personalAccidentCover,
          courtesyCar: this.courtesyCar,
          breakdownCover: this.breakdownCover,
          motorLegalProtection: this.motorLegalProtection,
          email: this.email,
          phoneNumber: this.phoneNumber,
          canProvidersContact: this.canProvidersContact,
          paymentType: this.paymentType,
          depositAmount: this.depositAmount,
          monthlyAmount: this.monthlyAmount,
          monthlyPayments: this.monthlyPayments,
          dvlaConditionType: this.dvlaConditionType,
          hasDetailedClaims: this.hasDetailedClaims,
          claimIncidentType: this.claimIncidentType,
          claimFault: this.claimFault,
          claimDriver: this.claimDriver,
          claimInjuries: this.claimInjuries,
          claimDay: this.claimDay,
          claimMonth: this.claimMonth,
          claimYear: this.claimYear,
          claimDamageType: this.claimDamageType,

          hasDetailedConvictions: this.hasDetailedConvictions,
          convictionLocation: this.convictionLocation,
          convictionType: this.convictionType,
          convictionCode: this.convictionCode,
          convictionDay: this.convictionDay,
          convictionMonth: this.convictionMonth,
          convictionYear: this.convictionYear,
          convictionPenaltyPoints: this.convictionPenaltyPoints,

          convictionFine: this.convictionFine,
          convictionFineAmount: this.convictionFineAmount,
          convictionBan: this.convictionBan,
          convictionBanMonths: this.convictionBanMonths
        };
      },
      
      getDaysRemaining() {
        const end = new Date(this.policyEnd);
        const today = new Date();
        const diffTime = end - today;
        const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
        return diffDays > 0 ? diffDays : 0;
      },
      
      downloadAllPDFs() {
        const pdfs = [
          'data/pdfs/policy-certificate.pdf',
          'data/pdfs/insurance-schedule.pdf',
          'data/pdfs/terms-conditions.pdf',
          'data/pdfs/proof-of-insurance.pdf'
        ];
        
        pdfs.forEach((pdf, index) => {
          setTimeout(() => {
            const link = document.createElement('a');
            link.href = pdf;
            link.download = pdf.split('/').pop();
            link.click();
          }, index * 200);
        });
      },
      
      printPolicy() {
        window.print();
      }
    }"
