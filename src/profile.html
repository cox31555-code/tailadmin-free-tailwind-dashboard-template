<!doctype html>
<html lang="en">
  <head>
    <include src="./partials/critical-dark-mode.html"></include>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>User Management | TailAdmin - Tailwind CSS Admin Dashboard Template</title>
  </head>
  <body
    x-data="{
      page: 'profile',
      'isLoading': false,
      'darkMode': true,
      'stickyMenu': false,
      'sidebarToggle': false,
      'scrollTop': false,
      'isCreateUserModal': false,
      'isEditUserModal': false,
      'selectedUser': null,
      'userCounts': { total: 0, admin: 0, support: 0, basic: 0 },
      editUser(name, email, role) {
        this.selectedUser = { name, email, role };
        this.isEditUserModal = true;
      }
    }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? true;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)));
         document.addEventListener('update-user-counts', (e) => {
           userCounts = e.detail;
         })"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `User Management`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div class="space-y-6">
              <!-- Stats Cards -->
              <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
                <!-- Total Users -->
                <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-[#010a1b]">
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Total Users</p>
                      <h3 class="mt-2 text-2xl font-bold text-gray-800 dark:text-white/90" x-text="userCounts.total">24</h3>
                    </div>
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-blue-500/10">
                      <svg class="h-6 w-6 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z" />
                      </svg>
                    </div>
                  </div>
                  <div class="mt-3">
                    <span class="text-xs text-gray-500 dark:text-gray-400">All registered users</span>
                  </div>
                </div>

                <!-- Admin Users -->
                <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-[#010a1b]">
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Admin Users</p>
                      <h3 class="mt-2 text-2xl font-bold text-gray-800 dark:text-white/90" x-text="userCounts.admin">5</h3>
                    </div>
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-purple-500/10">
                      <svg class="h-6 w-6 text-purple-600 dark:text-purple-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
                      </svg>
                    </div>
                  </div>
                  <div class="mt-3">
                    <span class="text-xs text-gray-500 dark:text-gray-400">Full access level</span>
                  </div>
                </div>

                <!-- Support Users -->
                <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-[#010a1b]">
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Support Users</p>
                      <h3 class="mt-2 text-2xl font-bold text-gray-800 dark:text-white/90" x-text="userCounts.support">12</h3>
                    </div>
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-blue-500/10">
                      <svg class="h-6 w-6 text-blue-600 dark:text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M18.364 5.636l-3.536 3.536m0 5.656l3.536 3.536M9.172 9.172L5.636 5.636m3.536 9.192l-3.536 3.536M21 12a9 9 0 11-18 0 9 9 0 0118 0zm-5 0a4 4 0 11-8 0 4 4 0 018 0z" />
                      </svg>
                    </div>
                  </div>
                  <div class="mt-3">
                    <span class="text-xs text-gray-500 dark:text-gray-400">Customer support team</span>
                  </div>
                </div>

                <!-- Basic Users -->
                <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-[#010a1b]">
                  <div class="flex items-center justify-between">
                    <div>
                      <p class="text-xs font-medium text-gray-500 dark:text-gray-400 uppercase tracking-wider">Basic Users</p>
                      <h3 class="mt-2 text-2xl font-bold text-gray-800 dark:text-white/90" x-text="userCounts.basic">7</h3>
                    </div>
                    <div class="flex h-12 w-12 items-center justify-center rounded-full bg-gray-500/10">
                      <svg class="h-6 w-6 text-gray-600 dark:text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                      </svg>
                    </div>
                  </div>
                  <div class="mt-3">
                    <span class="text-xs text-gray-500 dark:text-gray-400">Standard access</span>
                  </div>
                </div>
              </div>

              <!-- Users Table -->
              <include src="./partials/profile/users-table.html" />
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <!-- Modals -->
    <include src="./partials/profile/create-user-modal.html" />
    <include src="./partials/profile/edit-user-modal.html" />
  </body>
</html>
