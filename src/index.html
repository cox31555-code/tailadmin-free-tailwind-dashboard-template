<!doctype html>
<html lang="en">
  <head>
    <include src="./partials/critical-dark-mode.html"></include>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Dashboard | Limitless Admin
    </title>
    <style>
      @media (max-width: 640px) {
        .page-main-content {
          padding: 0 10px;
        }
      }
    </style>
  </head>
  <body
    x-data="{ page: 'ecommerce', 'isLoading': false, 'darkMode': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? true;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6 page-main-content">
            <!-- Dashboard Header -->
            <div class="mb-6">
              <h1 class="text-2xl font-bold text-gray-800 dark:text-white/90 md:text-3xl">
                Dashboard Overview
              </h1>
              <p class="mt-1 text-gray-500 text-theme-sm dark:text-gray-400">
                Monitor your policy statistics and sales performance
              </p>
            </div>

            <!-- Main Dashboard Grid -->
            <div class="grid grid-cols-12 gap-4 md:gap-6">
              
              <!-- Key Metrics Section -->
              <div class="col-span-12">
                <include src="./partials/metric-group/metric-group-01.html" />
              </div>

              <!-- Charts Row -->
              <div class="col-span-12 grid grid-cols-1 gap-4 lg:grid-cols-2 md:gap-6">
                <!-- Monthly Sales Chart -->
                <div class="lg:col-span-1">
                  <include src="./partials/chart/chart-01.html" />
                </div>

                <!-- Orders by Product Type Chart -->
                <div class="lg:col-span-1">
                  <include src="./partials/chart/chart-02.html" />
                </div>
              </div>

              <!-- Statistics Chart - Full Width -->
              <div class="col-span-12">
                <include src="./partials/chart/chart-03.html" />
              </div>

              <!-- Revenue Overview -->
              <include src="./partials/revenue-overview.html" />

              <!-- Recent Items Table -->
              <include src="./partials/recent-items.html" />

            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
