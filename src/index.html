<!doctype html>
<html lang="en">
  <head>
    <include src="./partials/critical-dark-mode.html"></include>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dashboard | Limitless Admin</title>
  </head>
  <body
    x-data="{ page: 'ecommerce', 'isLoading': false, 'darkMode': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? true;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main class="bg-gradient-to-br from-gray-50 to-gray-100 dark:from-gray-950 dark:to-gray-900">
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-8 2xl:p-10">
            
            <!-- Hero Section -->
            <div class="relative mb-8 overflow-hidden rounded-3xl bg-gradient-to-r from-brand-500 to-blue-600 p-8 md:p-10">
              <div class="absolute top-0 right-0 w-64 h-64 bg-white/10 rounded-full -mr-32 -mt-32 blur-3xl"></div>
              <div class="absolute bottom-0 left-0 w-96 h-96 bg-white/5 rounded-full -ml-48 -mb-48 blur-3xl"></div>
              <div class="relative">
                <h1 class="text-3xl font-bold text-white md:text-4xl">
                  Welcome back, Admin 👋
                </h1>
                <p class="mt-2 text-blue-100 text-lg">
                  Here's what's happening with your policies today
                </p>
              </div>
            </div>

            <!-- Quick Stats Grid -->
            <div class="grid grid-cols-1 gap-4 mb-8 sm:grid-cols-2 md:gap-6">
              <!-- Quotes Card -->
              <div class="group relative overflow-hidden rounded-2xl bg-white p-6 shadow-lg transition-all hover:shadow-xl dark:bg-gray-900">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-brand-500/20 to-transparent rounded-full -mr-16 -mt-16"></div>
                <div class="relative">
                  <div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
                      Quotes Overview
                    </h3>
                    <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-brand-50 dark:bg-brand-900/30">
                      <svg class="w-6 h-6 text-brand-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                      </svg>
                    </div>
                  </div>
                  <include src="./partials/dashboard/quotes-stats.html" />
                </div>
              </div>

              <!-- Orders Card -->
              <div class="group relative overflow-hidden rounded-2xl bg-white p-6 shadow-lg transition-all hover:shadow-xl dark:bg-gray-900">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-br from-blue-500/20 to-transparent rounded-full -mr-16 -mt-16"></div>
                <div class="relative">
                  <div class="flex items-center justify-between mb-6">
                    <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
                      Orders Overview
                    </h3>
                    <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-900/30">
                      <svg class="w-6 h-6 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path>
                      </svg>
                    </div>
                  </div>
                  <include src="./partials/dashboard/orders-stats.html" />
                </div>
              </div>
            </div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 gap-4 mb-8 lg:grid-cols-2 md:gap-6">
              <!-- Monthly Sales Chart -->
              <include src="./partials/chart/chart-01.html" />
              
              <!-- Orders by Product Type Chart -->
              <include src="./partials/chart/chart-02.html" />
            </div>

            <!-- Statistics Chart - Full Width -->
            <div class="mb-8">
              <include src="./partials/chart/chart-03.html" />
            </div>

            <!-- Bottom Section -->
            <div class="grid grid-cols-1 gap-4 md:gap-6">
              <!-- Revenue Overview -->
              <include src="./partials/revenue-overview.html" />

              <!-- Recent Items -->
              <include src="./partials/recent-items.html" />
            </div>

          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
