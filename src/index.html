<!doctype html>
<html lang="en">
  <head>
    <include src="./partials/critical-dark-mode.html"></include>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Dashboard | Limitless Admin</title>
  </head>
  <body
    x-data="{ page: 'ecommerce', 'isLoading': false, 'darkMode': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? true;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-8 2xl:p-10">
            
            <!-- Page Header -->
            <div class="mb-6">
              <h1 class="text-2xl font-bold text-gray-800 dark:text-white md:text-3xl">
                Dashboard
              </h1>
              <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
                Overview of your policy statistics and performance
              </p>
            </div>

            <!-- Quick Stats Grid -->
            <div class="grid grid-cols-1 gap-4 mb-6 sm:grid-cols-2 md:gap-6">
              <!-- Quotes Card -->
              <div class="rounded-xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-[#010a1b]">
                <h3 class="mb-4 text-base font-semibold text-gray-800 dark:text-white">
                  Quotes Overview
                </h3>
                <include src="./partials/dashboard/quotes-stats.html" />
              </div>

              <!-- Orders Card -->
              <div class="rounded-xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-[#010a1b]">
                <h3 class="mb-4 text-base font-semibold text-gray-800 dark:text-white">
                  Orders Overview
                </h3>
                <include src="./partials/dashboard/orders-stats.html" />
              </div>
            </div>

            <!-- Charts Row -->
            <div class="grid grid-cols-1 gap-4 mb-6 lg:grid-cols-2 md:gap-6">
              <!-- Monthly Sales Chart -->
              <include src="./partials/chart/chart-01.html" />
              
              <!-- Orders by Product Type Chart -->
              <include src="./partials/chart/chart-02.html" />
            </div>

            <!-- Statistics Chart - Full Width -->
            <div class="mb-6">
              <include src="./partials/chart/chart-03.html" />
            </div>

            <!-- Bottom Section -->
            <div class="grid grid-cols-1 gap-4 md:gap-6">
              <!-- Revenue Overview -->
              <include src="./partials/revenue-overview.html" />

              <!-- Recent Items -->
              <include src="./partials/recent-items.html" />
            </div>

          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
