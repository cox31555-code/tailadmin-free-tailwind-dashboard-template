<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Stream | Limitless Dashboard</title>
  </head>
  <body
    x-data="{ page: 'stream', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Stream`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Stream Container -->
            <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden" style="height: calc(100vh - 100px);">
              <iframe
                id="streamFrame"
                src="https://embedsports.top/embed/admin/ppv-buffalo-bills-vs-pittsburgh-steelers/1"
                style="width: 100%; height: 100%; border: none;"
                allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
              ></iframe>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script>
      // Popup and Ad Blocker for Stream Iframe
      const PopupBlocker = {
        // List of common ad domains to block
        adDomains: [
          'google-analytics',
          'doubleclick',
          'googlesyndication',
          'adservice',
          'googleadservices',
          'pagead',
          'ads',
          'advert',
          'banner',
          'popup',
          'popunder',
          'redirect.sp',
          'track',
          'metric',
          'analytics'
        ],

        // Initialize popup blocking
        init() {
          this.blockWindowOpen();
          this.blockTargetBlank();
          this.blockPopups();
        },

        // Block window.open() calls
        blockWindowOpen() {
          const originalOpen = window.open;
          window.open = (url, target, features) => {
            // Allow fullscreen requests from the iframe
            if (features && features.includes('fullscreen')) {
              return originalOpen.apply(window, arguments);
            }

            // Block if it looks like an ad or popup
            if (this.isAdUrl(url)) {
              console.log('[PopupBlocker] Blocked popup:', url);
              return null;
            }

            // Block if target is new window/tab (but allow iframe targets)
            if (target && target !== '_self' && target !== 'streamFrame') {
              console.log('[PopupBlocker] Blocked new window:', url);
              return null;
            }

            // Block popups with features indicating new window
            if (features && (features.includes('width') || features.includes('height'))) {
              console.log('[PopupBlocker] Blocked popup window:', url);
              return null;
            }

            return originalOpen.apply(window, arguments);
          };
        },

        // Block target="_blank" links within iframe communication
        blockTargetBlank() {
          document.addEventListener('click', (e) => {
            const target = e.target.closest('a, button, [role="button"]');
            if (!target) return;

            const href = target.getAttribute('href') || target.getAttribute('data-url');
            if (!href) return;

            // Check if it's trying to open in new tab
            if (target.getAttribute('target') === '_blank' || target.getAttribute('target') === '_new') {
              if (this.isAdUrl(href)) {
                e.preventDefault();
                e.stopPropagation();
                console.log('[PopupBlocker] Blocked blank target link:', href);
              }
            }
          }, true);
        },

        // Block popup attempts using MutationObserver
        blockPopups() {
          const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              if (mutation.type === 'childList') {
                mutation.addedNodes.forEach((node) => {
                  if (node.nodeType === 1) { // Element node
                    // Check if it's a popup-like element
                    if (this.isPopupElement(node)) {
                      node.style.display = 'none';
                      console.log('[PopupBlocker] Blocked popup element:', node.tagName);
                    }
                  }
                });
              }
            });
          });

          observer.observe(document.body, {
            childList: true,
            subtree: true
          });
        },

        // Check if a URL looks like an ad
        isAdUrl(url) {
          if (!url) return false;
          url = url.toLowerCase();

          return this.adDomains.some(domain => url.includes(domain));
        },

        // Check if an element looks like a popup
        isPopupElement(element) {
          const classes = element.className.toLowerCase();
          const id = element.id.toLowerCase();

          return (
            classes.includes('popup') ||
            classes.includes('modal-ad') ||
            classes.includes('ad-') ||
            id.includes('popup') ||
            id.includes('ad') ||
            (element.style.position === 'fixed' && element.style.zIndex > 9000)
          );
        }
      };

      // Initialize popup blocker when page loads
      document.addEventListener('DOMContentLoaded', () => {
        PopupBlocker.init();
      });

      // Also initialize immediately in case DOM is already loaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => PopupBlocker.init());
      } else {
        PopupBlocker.init();
      }
    </script>
  </body>
</html>
