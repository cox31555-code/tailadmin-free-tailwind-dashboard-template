<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Stream | Limitless Dashboard</title>
  </head>
  <body
    x-data="{ page: 'stream', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Stream`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Stream Container -->
            <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden" style="height: calc(100vh - 100px);">
              <iframe
                id="streamFrame"
                src="https://embedsports.top/embed/admin/ppv-buffalo-bills-vs-pittsburgh-steelers/1"
                style="width: 100%; height: 100%; border: none;"
                allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
              ></iframe>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script>
      // Aggressive Popup and Ad Blocker for Stream Iframe
      const PopupBlocker = {
        blockedWindows: new Set(),

        // List of common ad domains to block
        adDomains: [
          'google-analytics',
          'doubleclick',
          'googlesyndication',
          'adservice',
          'googleadservices',
          'pagead',
          'ads',
          'advert',
          'banner',
          'popup',
          'popunder',
          'redirect.sp',
          'track',
          'metric',
          'analytics'
        ],

        // Initialize popup blocking
        init() {
          this.blockWindowOpen();
          this.blockTargetBlank();
          this.blockPopups();
          this.blockNavigation();
          this.blockBeforeUnload();
          this.monitorNewWindows();
        },

        // Block window.open() calls
        blockWindowOpen() {
          const originalOpen = window.open;
          window.open = (url, target, features) => {
            // Allow fullscreen requests from the iframe
            if (features && features.includes('fullscreen')) {
              return originalOpen.apply(window, arguments);
            }

            // Block all new window/tab attempts
            console.log('[PopupBlocker] Blocked window.open():', url);
            return null;
          };
        },

        // Block target="_blank" links and form submissions
        blockTargetBlank() {
          document.addEventListener('click', (e) => {
            const target = e.target.closest('a, button, [role="button"]');
            if (!target) return;

            const href = target.getAttribute('href') || target.getAttribute('data-url');
            const targetAttr = target.getAttribute('target');

            // Block if trying to open in new tab or window
            if (targetAttr === '_blank' || targetAttr === '_new') {
              e.preventDefault();
              e.stopPropagation();
              console.log('[PopupBlocker] Blocked blank target:', href);
              return false;
            }
          }, true);

          // Block form submissions to external targets
          document.addEventListener('submit', (e) => {
            const form = e.target;
            const target = form.getAttribute('target');

            if (target === '_blank' || target === '_new') {
              e.preventDefault();
              e.stopPropagation();
              console.log('[PopupBlocker] Blocked form submission to blank target');
              return false;
            }
          }, true);
        },

        // Block popup attempts using MutationObserver
        blockPopups() {
          const observer = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              if (mutation.type === 'childList') {
                mutation.addedNodes.forEach((node) => {
                  if (node.nodeType === 1) { // Element node
                    // Check if it's a popup-like element
                    if (this.isPopupElement(node)) {
                      node.style.display = 'none';
                      node.style.visibility = 'hidden';
                      node.style.pointerEvents = 'none';
                      console.log('[PopupBlocker] Blocked popup element:', node.tagName);
                    }
                  }
                });
              }
            });
          });

          observer.observe(document.body, {
            childList: true,
            subtree: true,
            attributes: false,
            characterData: false
          });
        },

        // Block navigation that might trigger popups
        blockNavigation() {
          // Intercept all link clicks
          document.addEventListener('click', (e) => {
            const link = e.target.closest('a[href]');
            if (!link) return;

            const href = link.getAttribute('href');
            if (!href) return;

            // Block javascript: URIs that might open popups
            if (href.startsWith('javascript:')) {
              e.preventDefault();
              e.stopPropagation();
              console.log('[PopupBlocker] Blocked javascript: link');
              return false;
            }

            // Block unknown protocols
            if (href.startsWith('vbscript:') || href.startsWith('data:')) {
              e.preventDefault();
              e.stopPropagation();
              return false;
            }
          }, true);
        },

        // Monitor and close any new windows that get created
        monitorNewWindows() {
          const originalOpen = window.open;
          window.open = () => {
            console.log('[PopupBlocker] Attempted to open new window - blocked');
            return null;
          };

          // Also trap any existing window references
          window.addEventListener('beforeunload', (e) => {
            // This prevents navigation away from the page
          });
        },

        // Block beforeunload prompts that might be used for popups
        blockBeforeUnload() {
          window.addEventListener('beforeunload', (e) => {
            // Check if this is a legitimate navigation or a popup attempt
            if (e.returnValue === undefined && !window.event.isTrusted) {
              e.preventDefault();
              e.returnValue = '';
            }
          });
        },

        // Check if a URL looks like an ad
        isAdUrl(url) {
          if (!url) return false;
          url = url.toLowerCase();

          return this.adDomains.some(domain => url.includes(domain));
        },

        // Check if an element looks like a popup
        isPopupElement(element) {
          try {
            // Safely get className as string
            const classStr = (element.className && typeof element.className === 'string')
              ? element.className.toLowerCase()
              : '';
            const idStr = (element.id && typeof element.id === 'string')
              ? element.id.toLowerCase()
              : '';
            const tag = element.tagName ? element.tagName.toLowerCase() : '';

            // Check for common popup indicators
            const isPopupClass = (
              classStr.includes('popup') ||
              classStr.includes('modal') ||
              classStr.includes('overlay') ||
              classStr.includes('modal-ad') ||
              classStr.includes('ad-') ||
              idStr.includes('popup') ||
              idStr.includes('ad') ||
              idStr.includes('modal')
            );

            // Check for fixed positioning with high z-index (popup behavior)
            const zIndex = parseInt(window.getComputedStyle(element).zIndex || 0);
            const isFixedPopup = (
              window.getComputedStyle(element).position === 'fixed' &&
              zIndex > 1000
            );

            // Check for common ad/popup tag combinations
            const srcStr = (element.src && typeof element.src === 'string') ? element.src.toLowerCase() : '';
            const isAdTag = (
              (tag === 'iframe' && this.isAdUrl(srcStr)) ||
              (tag === 'script' && this.isAdUrl(srcStr)) ||
              (tag === 'object') ||
              (tag === 'embed' && !['video', 'audio'].includes(element.type))
            );

            return isPopupClass || isFixedPopup || isAdTag;
          } catch (e) {
            console.log('[PopupBlocker] Error checking element:', e);
            return false;
          }
        }
      };

      // Initialize popup blocker when page loads
      document.addEventListener('DOMContentLoaded', () => {
        PopupBlocker.init();
      });

      // Also initialize immediately in case DOM is already loaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', () => PopupBlocker.init());
      } else {
        PopupBlocker.init();
      }

      // Monitor for any attempts to open new windows via console or external methods
      window.addEventListener('focus', () => {
        // If a new window was somehow opened, this will be called
        console.log('[PopupBlocker] Window focus event - checking for popups');
      });

      // Suppress error messages from iframe parent context issues
      window.addEventListener('error', (event) => {
        if (event.message && event.message.includes('parent context')) {
          event.preventDefault();
          return false;
        }
      });

      // Intercept postMessage from iframe to prevent popup commands
      window.addEventListener('message', (event) => {
        if (event.data && typeof event.data === 'object') {
          // Block popup-related messages
          if (event.data.type === 'popup' || event.data.action === 'popup' || event.data.command === 'popup') {
            event.preventDefault();
            console.log('[PopupBlocker] Blocked popup message:', event.data);
            return false;
          }
        }
      }, true);
    </script>
  </body>
</html>
