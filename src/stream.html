<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Stream | Limitless Dashboard</title>
  </head>
  <body
    x-data="{ page: 'stream', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Stream`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Stream Container -->
            <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] overflow-hidden" style="height: calc(100vh - 100px);">
              <iframe
                id="streamFrame"
                src="https://embedsports.top/embed/admin/ppv-buffalo-bills-vs-pittsburgh-steelers/1"
                style="width: 100%; height: 100%; border: none;"
                allow="fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture; web-share"
              ></iframe>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script>
      // Super Aggressive Popup Blocker - Intercepts at every level
      console.log('[Stream] Hardcore popup blocker activated');

      // 1. NUCLEAR OPTION: Override window.open at the most fundamental level
      window.open = function() { return null; };

      // 2. Override with a proxy that logs all attempts
      const OriginalOpen = window.open;
      window.open = new Proxy(OriginalOpen, {
        apply: () => {
          console.log('[PopupBlocker] window.open intercepted and blocked');
          return null;
        }
      });

      // 3. Try to prevent programmatic navigation
      const originalNavigate = HTMLAnchorElement.prototype.click;
      HTMLAnchorElement.prototype.click = function() {
        if (this.target === '_blank' || this.target === '_new') {
          console.log('[PopupBlocker] Blocked anchor click with _blank target');
          return;
        }
        originalNavigate.call(this);
      };

      // 4. Monitor every single click on the entire document
      document.addEventListener('click', (e) => {
        // Remove target="_blank" before execution
        let elem = e.target;
        while (elem) {
          if (elem.target === '_blank' || elem.target === '_new') {
            elem.removeAttribute('target');
          }
          elem = elem.parentElement;
        }
      }, true);

      // 5. Monitor mousedown to catch clicks early
      document.addEventListener('mousedown', (e) => {
        const link = e.target.closest('a[href]');
        if (link && (link.target === '_blank' || link.target === '_new')) {
          link.target = '_self';
          e.preventDefault();
        }
      }, true);

      // 6. Intercept right-click "Open in new tab"
      document.addEventListener('contextmenu', (e) => {
        const link = e.target.closest('a[href]');
        if (link) {
          e.preventDefault();
        }
      }, true);

      // 7. Monitor form submissions aggressively
      document.addEventListener('submit', (e) => {
        const form = e.target;
        if (form.target === '_blank' || form.target === '_new') {
          e.preventDefault();
          e.stopImmediatePropagation();
          form.target = '_self';
        }
      }, true);

      // 8. Override HTMLFormElement.submit()
      const originalSubmit = HTMLFormElement.prototype.submit;
      HTMLFormElement.prototype.submit = function() {
        if (this.target === '_blank' || this.target === '_new') {
          this.target = '_self';
          console.log('[PopupBlocker] Form submit hijacked - changed target to _self');
        }
        originalSubmit.call(this);
      };

      // 9. Aggressive MutationObserver - hide anything popup-like immediately
      const observer = new MutationObserver((mutations) => {
        mutations.forEach((mutation) => {
          mutation.addedNodes.forEach((node) => {
            if (node.nodeType === 1) {
              const el = node;
              const css = window.getComputedStyle(el);
              const html = el.outerHTML ? el.outerHTML.substring(0, 100).toLowerCase() : '';

              // Hide anything that looks like a popup
              if (css.position === 'fixed' && parseInt(css.zIndex || 0) > 500) {
                el.style.display = 'none !important';
                el.style.visibility = 'hidden !important';
                el.style.pointerEvents = 'none !important';
                console.log('[PopupBlocker] Hidden fixed element with high z-index');
              }

              // Hide known ad/popup elements
              if (html.includes('popup') || html.includes('modal') || html.includes('ad') || html.includes('banner')) {
                el.style.display = 'none !important';
              }
            }
          });
        });
      });

      observer.observe(document, { childList: true, subtree: true });

      // 10. Block javascript: protocol execution
      document.addEventListener('click', (e) => {
        if (e.target.href && e.target.href.startsWith('javascript:')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      }, true);

      // 11. Intercept window properties that might be used for popups
      try {
        Object.defineProperty(window, 'open', {
          value: () => null,
          writable: false,
          configurable: false
        });
      } catch (e) {
        console.log('[PopupBlocker] Could not lock window.open');
      }

      // 12. Monitor any attempts to change window location
      Object.defineProperty(window, 'location', {
        get: function() {
          return window.location;
        },
        set: function(val) {
          console.log('[PopupBlocker] Attempted window.location change blocked');
          return false;
        }
      });

      // 13. Suppress all error messages about blocked popups
      window.addEventListener('error', (e) => {
        if (e && (String(e.message).includes('popup') || String(e.message).includes('blocked'))) {
          e.preventDefault();
          return false;
        }
      });

      console.log('[Stream] Popup blocker initialized - ALL popup attempts will be blocked');
    </script>
  </body>
</html>
