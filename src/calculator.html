<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Calculator | TailAdmin - Tailwind CSS Admin Dashboard Template</title>
  </head>

  <body
    x-data="{ page: 'calculator', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden">
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Calculator`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Policy Type Selection -->
            <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
              <div class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800 dark:text-white mb-2">
                  Insurance Multiplier Calculator
                </h2>
                <p class="text-sm lg:text-base text-gray-600 dark:text-gray-400">
                  Select a policy type to manage multipliers
                </p>
              </div>

              <!-- Policy Type Cards -->
              <div class="grid grid-cols-1 gap-6 md:grid-cols-3">
                <!-- Annual Card -->
                <a href="calculator-annual.html" class="group cursor-pointer">
                  <div class="h-full rounded-2xl border border-gray-200 bg-gradient-to-br from-blue-50 to-blue-100 p-8 dark:border-gray-700 dark:from-blue-900/20 dark:to-blue-900/10 hover:shadow-xl transition-all duration-300 transform hover:scale-105 hover:-translate-y-2">
                    <div class="flex flex-col items-center text-center h-full justify-between">
                      <div class="flex items-center justify-center w-16 h-16 rounded-full bg-blue-200 dark:bg-blue-800 mb-4 group-hover:scale-110 transition-transform">
                        <svg class="w-8 h-8 text-blue-600 dark:text-blue-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                        </svg>
                      </div>
                      <div>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">
                          Annual
                        </h3>
                        <p class="text-sm text-gray-600 dark:text-gray-300">
                          Yearly insurance policy multipliers
                        </p>
                      </div>
                      <div class="mt-6">
                        <span class="inline-flex items-center gap-2 text-blue-600 dark:text-blue-400 font-semibold group-hover:gap-3 transition-all">
                          View Calculator
                          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                          </svg>
                        </span>
                      </div>
                    </div>
                  </div>
                </a>

                <!-- Temporary Card -->
                <a href="calculator-temporary.html" class="group cursor-pointer">
                  <div class="h-full rounded-2xl border border-gray-200 bg-gradient-to-br from-purple-50 to-purple-100 p-8 dark:border-gray-700 dark:from-purple-900/20 dark:to-purple-900/10 hover:shadow-xl transition-all duration-300 transform hover:scale-105 hover:-translate-y-2">
                    <div class="flex flex-col items-center text-center h-full justify-between">
                      <div class="flex items-center justify-center w-16 h-16 rounded-full bg-purple-200 dark:bg-purple-800 mb-4 group-hover:scale-110 transition-transform">
                        <svg class="w-8 h-8 text-purple-600 dark:text-purple-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                      </div>
                      <div>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">
                          Temporary
                        </h3>
                        <p class="text-sm text-gray-600 dark:text-gray-300">
                          Short-term policy multipliers
                        </p>
                      </div>
                      <div class="mt-6">
                        <span class="inline-flex items-center gap-2 text-purple-600 dark:text-purple-400 font-semibold group-hover:gap-3 transition-all">
                          View Calculator
                          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                          </svg>
                        </span>
                      </div>
                    </div>
                  </div>
                </a>

                <!-- Impound Card -->
                <a href="calculator-impound.html" class="group cursor-pointer">
                  <div class="h-full rounded-2xl border border-gray-200 bg-gradient-to-br from-orange-50 to-orange-100 p-8 dark:border-gray-700 dark:from-orange-900/20 dark:to-orange-900/10 hover:shadow-xl transition-all duration-300 transform hover:scale-105 hover:-translate-y-2">
                    <div class="flex flex-col items-center text-center h-full justify-between">
                      <div class="flex items-center justify-center w-16 h-16 rounded-full bg-orange-200 dark:bg-orange-800 mb-4 group-hover:scale-110 transition-transform">
                        <svg class="w-8 h-8 text-orange-600 dark:text-orange-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m7 0a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                      </div>
                      <div>
                        <h3 class="text-2xl font-bold text-gray-800 dark:text-white mb-2">
                          Impound
                        </h3>
                        <p class="text-sm text-gray-600 dark:text-gray-300">
                          Impound policy multipliers
                        </p>
                      </div>
                      <div class="mt-6">
                        <span class="inline-flex items-center gap-2 text-orange-600 dark:text-orange-400 font-semibold group-hover:gap-3 transition-all">
                          View Calculator
                          <svg class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                          </svg>
                        </span>
                      </div>
                    </div>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
