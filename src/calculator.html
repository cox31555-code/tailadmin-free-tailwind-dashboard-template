<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Base Pricing | TailAdmin - Tailwind CSS Admin Dashboard Template</title>
  </head>

  <body
    x-data="{ page: 'basePricing', 'loaded': true, 'darkMode': true, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? true;
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden">
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Calculator`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <!-- Policy Type Selection -->
            <div class="rounded-2xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-white/[0.03] lg:p-6">
              <div class="mb-8">
                <h2 class="text-2xl lg:text-3xl font-bold text-gray-800 dark:text-white mb-2">
                  Insurance Multiplier Calculator
                </h2>
                <p class="text-sm lg:text-base text-gray-600 dark:text-gray-400">
                  Select a policy type to manage multipliers
                </p>
              </div>

              <!-- Policy Type Cards -->
              <div class="grid grid-cols-1 gap-4 md:grid-cols-3 md:gap-6">
                <!-- Annual Card -->
                <a href="calculator-annual.html" class="block">
                  <div class="rounded-lg border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
                    <h3 class="font-semibold text-gray-800 dark:text-white">
                      Annual
                    </h3>
                    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                      Yearly insurance policy multipliers
                    </p>
                    <span class="mt-4 inline-block text-sm font-medium text-brand-500 dark:text-brand-400">
                      View Calculator →
                    </span>
                  </div>
                </a>

                <!-- Temporary Card -->
                <a href="calculator-temporary.html" class="block">
                  <div class="rounded-lg border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
                    <h3 class="font-semibold text-gray-800 dark:text-white">
                      Temporary
                    </h3>
                    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                      Short-term policy multipliers
                    </p>
                    <span class="mt-4 inline-block text-sm font-medium text-brand-500 dark:text-brand-400">
                      View Calculator →
                    </span>
                  </div>
                </a>

                <!-- Impound Card -->
                <a href="calculator-impound.html" class="block">
                  <div class="rounded-lg border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
                    <h3 class="font-semibold text-gray-800 dark:text-white">
                      Impound
                    </h3>
                    <p class="mt-2 text-sm text-gray-600 dark:text-gray-400">
                      Impound policy multipliers
                    </p>
                    <span class="mt-4 inline-block text-sm font-medium text-brand-500 dark:text-brand-400">
                      View Calculator →
                    </span>
                  </div>
                </a>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
