<!doctype html>
<html lang="en">
  <head>
    <include src="./partials/critical-dark-mode.html"></include>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Payment Processor | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
  </head>
  <body
    x-data="processorManager()"
    x-init="init()"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Payment Processor`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div class="grid grid-cols-1 gap-6 lg:grid-cols-12">
              <!-- Left Sidebar - Processor List -->
              <div class="lg:col-span-4 xl:col-span-3 space-y-6">
                <!-- Processor List Card -->
                <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
                  <!-- Header -->
                  <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-800">
                    <div class="flex items-center justify-between mb-3">
                      <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
                        Processors
                      </h3>
                      <span class="inline-flex items-center rounded-full bg-gray-100 px-2.5 py-0.5 text-xs font-medium text-gray-700 dark:bg-gray-800 dark:text-gray-300">
                        <span x-text="processors.length"></span>
                      </span>
                    </div>
                    <button
                      @click="addNewProcessor"
                      class="w-full flex items-center justify-center gap-2 rounded-lg border border-dashed border-gray-300 bg-white px-3 py-2.5 text-sm font-medium text-gray-700 hover:border-brand-500 hover:text-brand-600 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:border-brand-600 dark:hover:text-brand-400 transition-colors"
                    >
                      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                      </svg>
                      Add Processor
                    </button>
                  </div>

                  <!-- Processor List -->
                  <div class="p-2">
                    <template x-for="processor in processors" :key="processor.id">
                      <button
                        @click="selectProcessor(processor.id)"
                        :class="selectedProcessorId === processor.id ? 'bg-brand-50 border-brand-500 dark:bg-brand-500/10 dark:border-brand-500' : 'bg-white border-transparent dark:bg-transparent hover:bg-gray-50 dark:hover:bg-white/[0.03]'"
                        class="w-full flex items-center gap-3 p-3 rounded-lg border-2 mb-2 transition-all group"
                      >
                        <!-- Logo -->
                        <div
                          :class="processor.logoClass"
                          class="flex h-10 w-10 flex-shrink-0 items-center justify-center rounded-lg"
                        >
                          <div x-html="processor.logoSvg" class="w-5 h-5"></div>
                        </div>

                        <!-- Info -->
                        <div class="flex-1 text-left min-w-0">
                          <h4 class="text-sm font-semibold text-gray-800 dark:text-white/90 truncate" x-text="processor.name"></h4>
                          <p class="text-xs text-gray-500 dark:text-gray-400 truncate" x-text="processor.type"></p>
                        </div>

                        <!-- Active Badge -->
                        <span
                          x-show="processor.id === activeProcessorId"
                          class="inline-flex items-center rounded-full bg-success-50 px-2 py-0.5 text-xs font-medium text-success-600 dark:bg-success-500/15 dark:text-success-500"
                        >
                          Active
                        </span>
                      </button>
                    </template>
                  </div>
                </div>

                <!-- Postal Code API Settings Card -->
                <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
                  <div class="px-5 py-4 border-b border-gray-200 dark:border-gray-800">
                    <div class="flex items-center gap-3">
                      <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-brand-50 dark:bg-brand-500/10">
                        <svg class="fill-brand-600 dark:fill-brand-400" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                          <path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C10.8954 2 10 2.89543 10 4V6C10 7.10457 10.8954 8 12 8C13.1046 8 14 7.10457 14 6V4C14 2.89543 13.1046 2 12 2ZM8 6C8 1.58172 11.5817 -2 16 2C20.4183 6 24 9.58172 24 14C24 18.4183 20.4183 22 16 22H8C3.58172 22 0 18.4183 0 14C0 9.58172 3.58172 6 8 6Z" fill=""/>
                        </svg>
                      </div>
                      <div>
                        <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
                          Postal Code API
                        </h3>
                        <p class="text-xs text-gray-500 dark:text-gray-400">
                          Address lookup service
                        </p>
                      </div>
                    </div>
                  </div>

                  <div class="p-5">
                    <div class="space-y-3">
                      <label class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        API Key
                      </label>
                      <div class="flex gap-2">
                        <input
                          type="text"
                          x-model="postalCodeApiKey"
                          placeholder="Enter your postal code API key"
                          class="flex-1 h-10 w-full appearance-none rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                        />
                        <button
                          @click="savePostalCodeApiKey"
                          class="flex-shrink-0 inline-flex items-center justify-center h-10 w-10 rounded-lg bg-brand-500 text-white hover:bg-brand-600 transition-colors"
                          title="Save API Key"
                        >
                          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                          </svg>
                        </button>
                      </div>
                      <p class="text-xs text-gray-500 dark:text-gray-400">
                        Used for address lookup and validation
                      </p>
                    </div>
                  </div>
                </div>
              </div>

              <!-- Right Content - Processor Details -->
              <div class="lg:col-span-8 xl:col-span-9">
                <template x-if="selectedProcessor">
                  <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
                    <!-- Header with Actions -->
                    <div class="px-5 py-4 sm:px-6 sm:py-5 border-b border-gray-200 dark:border-gray-800">
                      <div class="flex items-center justify-between">
                        <div class="flex items-center gap-3">
                          <div
                            :class="selectedProcessor.logoClass"
                            class="flex h-12 w-12 items-center justify-center rounded-lg"
                          >
                            <div x-html="selectedProcessor.logoSvg" class="w-6 h-6"></div>
                          </div>
                          <div>
                            <h2 class="text-xl font-semibold text-gray-800 dark:text-white/90" x-text="selectedProcessor.name"></h2>
                            <p class="text-sm text-gray-500 dark:text-gray-400" x-text="selectedProcessor.type"></p>
                          </div>
                        </div>

                        <div class="flex items-center gap-2">
                          <!-- Edit/Save/Cancel Buttons -->
                          <template x-if="!editMode">
                            <button
                              @click="editMode = true"
                              class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 transition-colors"
                            >
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
                              </svg>
                              Edit
                            </button>
                          </template>

                          <template x-if="editMode">
                            <div class="flex items-center gap-2">
                              <button
                                @click="cancelEdit"
                                class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-gray-700 border border-gray-300 rounded-lg bg-white hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700 transition-colors"
                              >
                                Cancel
                              </button>
                              <button
                                @click="saveProcessor"
                                class="inline-flex items-center gap-2 px-4 py-2.5 text-sm font-medium text-white rounded-lg bg-brand-500 hover:bg-brand-600 transition-colors"
                              >
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                </svg>
                                Save Changes
                              </button>
                            </div>
                          </template>

                          <!-- Delete Button -->
                          <button
                            @click="confirmDeleteProcessor"
                            class="inline-flex items-center justify-center h-10 w-10 text-error-600 border border-error-200 rounded-lg bg-white hover:bg-error-50 dark:border-error-800 dark:bg-gray-800 dark:text-error-400 dark:hover:bg-error-500/10 transition-colors"
                            title="Delete processor"
                          >
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                          </button>
                        </div>
                      </div>
                    </div>

                    <!-- Form Content -->
                    <div class="p-5 sm:p-6">
                      <div class="space-y-6">
                        <!-- Basic Information -->
                        <div>
                          <h3 class="text-base font-semibold text-gray-800 dark:text-white/90 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                            </svg>
                            Basic Information
                          </h3>
                          <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                            <!-- Processor Name -->
                            <div>
                              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Processor Name
                              </label>
                              <input
                                type="text"
                                x-model="selectedProcessor.name"
                                :disabled="!editMode"
                                :class="editMode ? 'border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900' : 'border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-400'"
                                class="h-11 w-full appearance-none rounded-lg border px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800 transition-colors"
                              />
                            </div>

                            <!-- Type -->
                            <div>
                              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Processor Type
                              </label>
                              <div class="relative">
                                <select
                                  x-model="selectedProcessor.type"
                                  :disabled="!editMode"
                                  :class="editMode ? 'border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900' : 'border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-400'"
                                  class="h-11 w-full appearance-none rounded-lg border px-4 py-2.5 pr-11 text-sm text-gray-800 shadow-theme-xs focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:text-white/90 dark:focus:border-brand-800"
                                >
                                  <option value="Stripe">Stripe</option>
                                  <option value="Mollie">Mollie</option>
                                  <option value="Paytiko">Paytiko</option>
                                  <option value="PayPal">PayPal</option>
                                  <option value="Square">Square</option>
                                  <option value="Other">Other</option>
                                </select>
                                <span class="pointer-events-none absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-500 dark:text-gray-400">
                                  <svg class="stroke-current w-5 h-5" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396" stroke="" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                                  </svg>
                                </span>
                              </div>
                            </div>

                            <!-- Description -->
                            <div class="sm:col-span-2">
                              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Description
                              </label>
                              <textarea
                                x-model="selectedProcessor.description"
                                :disabled="!editMode"
                                :class="editMode ? 'border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900' : 'border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-400'"
                                rows="3"
                                class="w-full appearance-none rounded-lg border px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800 transition-colors resize-none"
                              ></textarea>
                            </div>
                          </div>
                        </div>

                        <!-- API Credentials -->
                        <div>
                          <h3 class="text-base font-semibold text-gray-800 dark:text-white/90 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                            </svg>
                            API Credentials
                          </h3>
                          <div class="grid grid-cols-1 gap-4">
                            <!-- API Key / Publishable Key -->
                            <div>
                              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Publishable Key / API Key
                              </label>
                              <input
                                type="text"
                                x-model="selectedProcessor.publishableKey"
                                :disabled="!editMode"
                                :class="editMode ? 'border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900' : 'border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-400'"
                                placeholder="pk_live_..."
                                class="h-11 w-full appearance-none rounded-lg border px-4 py-2.5 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                              />
                            </div>

                            <!-- Secret Key -->
                            <div>
                              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Secret Key
                              </label>
                              <div class="relative">
                                <input
                                  :type="showSecretKey ? 'text' : 'password'"
                                  x-model="selectedProcessor.secretKey"
                                  :disabled="!editMode"
                                  :class="editMode ? 'border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900' : 'border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 text-gray-600 dark:text-gray-400'"
                                  placeholder="sk_live_..."
                                  class="h-11 w-full appearance-none rounded-lg border px-4 py-2.5 pr-11 text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                                />
                                <button
                                  type="button"
                                  @click="showSecretKey = !showSecretKey"
                                  class="absolute top-1/2 right-4 z-30 -translate-y-1/2 text-gray-500 dark:text-gray-400 hover:text-gray-700 dark:hover:text-gray-300"
                                >
                                  <svg
                                    x-show="!showSecretKey"
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                  >
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                                  </svg>
                                  <svg
                                    x-show="showSecretKey"
                                    class="w-5 h-5"
                                    fill="none"
                                    stroke="currentColor"
                                    viewBox="0 0 24 24"
                                  >
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" />
                                  </svg>
                                </button>
                              </div>
                            </div>

                            <!-- Webhook URL -->
                            <div>
                              <label class="mb-1.5 block text-sm font-medium text-gray-700 dark:text-gray-400">
                                Webhook URL
                              </label>
                              <div class="flex gap-2">
                                <input
                                  type="text"
                                  :value="'https://yourdomain.com/webhooks/' + selectedProcessor.id"
                                  readonly
                                  class="flex-1 h-11 w-full appearance-none rounded-lg border border-gray-200 dark:border-gray-800 bg-gray-50 dark:bg-gray-800 px-4 py-2.5 text-sm text-gray-600 dark:text-gray-400"
                                />
                                <button
                                  type="button"
                                  @click="copyWebhookUrl"
                                  class="flex-shrink-0 inline-flex items-center justify-center h-11 w-11 rounded-lg border border-gray-300 bg-white text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700"
                                  title="Copy webhook URL"
                                >
                                  <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                                  </svg>
                                </button>
                              </div>
                            </div>
                          </div>
                        </div>

                        <!-- Settings -->
                        <div>
                          <h3 class="text-base font-semibold text-gray-800 dark:text-white/90 mb-4 flex items-center gap-2">
                            <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                            </svg>
                            Settings
                          </h3>
                          <div class="space-y-4">
                            <!-- Environment Mode Toggle -->
                            <div class="flex items-center justify-between p-4 rounded-lg bg-gray-50 dark:bg-gray-800">
                              <div class="flex-1">
                                <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
                                  Environment Mode
                                </label>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                                  Switch between test and live modes
                                </p>
                              </div>
                              <div class="flex items-center gap-3">
                                <span class="text-sm font-medium" :class="selectedProcessor.isLiveMode ? 'text-gray-400' : 'text-brand-600 dark:text-brand-400'">
                                  Test
                                </span>
                                <button
                                  type="button"
                                  @click="editMode && (selectedProcessor.isLiveMode = !selectedProcessor.isLiveMode)"
                                  :disabled="!editMode"
                                  :class="selectedProcessor.isLiveMode ? 'bg-brand-500' : 'bg-gray-300 dark:bg-gray-600'"
                                  class="relative inline-flex h-7 w-12 flex-shrink-0 cursor-pointer rounded-full transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900 disabled:opacity-50 disabled:cursor-not-allowed"
                                >
                                  <span
                                    :class="selectedProcessor.isLiveMode ? 'translate-x-5' : 'translate-x-0.5'"
                                    class="inline-block h-6 w-6 transform rounded-full bg-white shadow-sm transition-transform duration-200 ease-in-out mt-0.5"
                                  ></span>
                                </button>
                                <span class="text-sm font-medium" :class="selectedProcessor.isLiveMode ? 'text-brand-600 dark:text-brand-400' : 'text-gray-400'">
                                  Live
                                </span>
                              </div>
                            </div>

                            <!-- Set as Active -->
                            <div class="flex items-center justify-between p-4 rounded-lg bg-gray-50 dark:bg-gray-800">
                              <div class="flex-1">
                                <label class="text-sm font-medium text-gray-700 dark:text-gray-300">
                                  Active Processor
                                </label>
                                <p class="text-xs text-gray-500 dark:text-gray-400 mt-0.5">
                                  Use this processor for all transactions
                                </p>
                              </div>
                              <button
                                type="button"
                                @click="setAsActive"
                                :disabled="selectedProcessor.id === activeProcessorId"
                                :class="selectedProcessor.id === activeProcessorId ? 'bg-success-50 text-success-600 border-success-200 dark:bg-success-500/15 dark:text-success-400 dark:border-success-800' : 'bg-white text-gray-700 border-gray-300 hover:bg-gray-50 dark:bg-gray-800 dark:text-gray-300 dark:border-gray-700 dark:hover:bg-gray-700'"
                                class="inline-flex items-center gap-2 px-4 py-2 text-sm font-medium border rounded-lg transition-colors disabled:cursor-not-allowed"
                              >
                                <svg x-show="selectedProcessor.id === activeProcessorId" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
                                </svg>
                                <span x-text="selectedProcessor.id === activeProcessorId ? 'Active' : 'Set Active'"></span>
                              </button>
                            </div>
                          </div>
                        </div>

                        <!-- Custom Fields -->
                        <div>
                          <div class="flex items-center justify-between mb-4">
                            <h3 class="text-base font-semibold text-gray-800 dark:text-white/90 flex items-center gap-2">
                              <svg class="w-5 h-5 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                              </svg>
                              Custom Fields
                            </h3>
                            <button
                              @click="addCustomField"
                              :disabled="!editMode"
                              class="inline-flex items-center gap-1.5 px-3 py-1.5 text-sm font-medium text-brand-600 border border-brand-200 rounded-lg bg-white hover:bg-brand-50 dark:border-brand-800 dark:bg-gray-800 dark:text-brand-400 dark:hover:bg-brand-500/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                            >
                              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                              </svg>
                              Add Field
                            </button>
                          </div>

                          <div class="space-y-3">
                            <template x-for="(field, index) in selectedProcessor.customFields" :key="index">
                              <div class="flex items-center gap-3 p-3 rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-gray-800">
                                <input
                                  type="text"
                                  x-model="field.label"
                                  :disabled="!editMode"
                                  placeholder="Field Label"
                                  class="flex-1 h-9 appearance-none rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-3 py-2 text-sm text-gray-800 dark:text-white/90 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-2 focus:ring-brand-500/10 disabled:bg-gray-100 disabled:dark:bg-gray-800"
                                />
                                <input
                                  type="text"
                                  x-model="field.value"
                                  :disabled="!editMode"
                                  placeholder="Field Value"
                                  class="flex-1 h-9 appearance-none rounded-lg border border-gray-300 dark:border-gray-700 bg-white dark:bg-gray-900 px-3 py-2 text-sm text-gray-800 dark:text-white/90 placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-2 focus:ring-brand-500/10 disabled:bg-gray-100 disabled:dark:bg-gray-800"
                                />
                                <button
                                  type="button"
                                  @click="removeCustomField(index)"
                                  :disabled="!editMode"
                                  class="flex-shrink-0 inline-flex items-center justify-center h-9 w-9 text-error-600 border border-error-200 rounded-lg bg-white hover:bg-error-50 dark:border-error-800 dark:bg-gray-900 dark:text-error-400 dark:hover:bg-error-500/10 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                                  title="Remove field"
                                >
                                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                                  </svg>
                                </button>
                              </div>
                            </template>

                            <template x-if="selectedProcessor.customFields.length === 0">
                              <div class="text-center py-8 border-2 border-dashed border-gray-200 dark:border-gray-700 rounded-lg">
                                <svg class="w-12 h-12 mx-auto text-gray-400 mb-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01" />
                                </svg>
                                <p class="text-sm text-gray-500 dark:text-gray-400">No custom fields added</p>
                                <p class="text-xs text-gray-400 dark:text-gray-500 mt-1">Click "Add Field" to create custom fields for this processor</p>
                              </div>
                            </template>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                </template>

                <!-- Empty State -->
                <template x-if="!selectedProcessor">
                  <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] p-12">
                    <div class="text-center">
                      <svg class="w-16 h-16 mx-auto text-gray-400 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                      </svg>
                      <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90 mb-2">No Processor Selected</h3>
                      <p class="text-sm text-gray-500 dark:text-gray-400 mb-6">Select a processor from the list or add a new one to get started</p>
                      <button
                        @click="addNewProcessor"
                        class="inline-flex items-center gap-2 px-5 py-2.5 text-sm font-medium text-white rounded-lg bg-brand-500 hover:bg-brand-600 transition-colors"
                      >
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                        Add New Processor
                      </button>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script>
      // Alpine.js component for processor management
      function processorManager() {
        return {
          page: 'processor',
          isLoading: false,
          darkMode: true,
          stickyMenu: false,
          sidebarToggle: false,
          scrollTop: false,
          
          selectedProcessorId: null,
          activeProcessorId: 'stripe',
          editMode: false,
          showSecretKey: false,
          postalCodeApiKey: '',
          
          processors: [
            {
              id: 'stripe',
              name: 'Stripe',
              type: 'Stripe',
              description: 'Industry-leading payment processing',
              logoClass: 'bg-blue-600',
              logoSvg: '<svg class="fill-white" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.227 0 4.515.858 6.09 1.631l.89-5.494C18.252.975 15.697 0 12.165 0 9.667 0 7.589.654 6.104 1.872 4.56 3.147 3.757 4.992 3.757 7.218c0 4.039 2.467 5.76 6.476 7.219 2.585.92 3.445 1.574 3.445 2.583 0 .98-.84 1.545-2.354 1.545-1.875 0-4.965-.921-6.99-2.109l-.9 5.555C5.175 22.99 8.385 24 11.714 24c2.641 0 4.843-.624 6.328-1.813 1.664-1.305 2.525-3.236 2.525-5.732 0-4.128-2.524-5.851-6.591-7.305z" fill=""/></svg>',
              publishableKey: '',
              secretKey: '',
              isLiveMode: false,
              customFields: []
            },
            {
              id: 'mollie1',
              name: 'Mollie Primary',
              type: 'Mollie',
              description: 'European payment processing',
              logoClass: 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700',
              logoSvg: '<svg width="20" height="20" viewBox="0 0 677 200" fill="none" xmlns="http://www.w3.org/2000/svg" class="mollie-logo"><g class="mollie-logo-fill"><path clip-rule="evenodd" d="m286.342 65.3132c-37.175 0-67.35 30.2415-67.35 67.3438 0 37.101 30.245 67.343 67.35 67.343 37.106 0 67.35-30.242 67.35-67.343 0-37.1023-30.174-67.3438-67.35-67.3438zm0 102.8348c-19.533 0-35.425-15.89-35.425-35.421s15.892-35.4222 35.425-35.4222 35.426 15.8912 35.426 35.4222-15.893 35.421-35.426 35.421z" fill-rule="evenodd"></path></g></svg>',
              publishableKey: '',
              secretKey: '',
              isLiveMode: false,
              customFields: []
            },
            {
              id: 'paytiko',
              name: 'Paytiko',
              type: 'Paytiko',
              description: 'Next-generation payment processing platform',
              logoClass: 'bg-white dark:bg-gray-800 border border-gray-200 dark:border-gray-700',
              logoSvg: '<svg width="20" height="20" viewBox="0 0 238 63" fill="none" xmlns="http://www.w3.org/2000/svg" class="paytiko-logo"><g clip-path="url(#clip0_1101_12)"><path d="M71.5158 43.2289C71.5158 45.5418 68.5651 48.5664 63.1883 48.5664C58.7514 48.5664 54.5549 46.5648 51.9102 43.429C49.5715 40.6713 48.0852 36.9128 48.0852 32.754C48.0852 23.7691 54.6204 16.8748 62.7731 16.8748C68.4559 16.8748 71.4065 19.8771 71.5377 22.2123V17.4975H79.2532V47.9437H71.5377V43.2289H71.5158Z" class="paytiko-logo-fill"/></g></svg>',
              publishableKey: '',
              secretKey: '',
              isLiveMode: false,
              customFields: []
            }
          ],
          
          // Original data for cancel functionality
          originalData: null,
          
          get selectedProcessor() {
            return this.processors.find(p => p.id === this.selectedProcessorId);
          },
          
          init() {
            this.darkMode = JSON.parse(localStorage.getItem('darkMode')) ?? true;
            this.$watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)));
            
            // Load saved data from localStorage
            const saved = localStorage.getItem('processorSettings');
            if (saved) {
              const data = JSON.parse(saved);
              this.activeProcessorId = data.activeProcessorId || 'stripe';
              this.postalCodeApiKey = data.postalCodeApiKey || '';
              if (data.processors) {
                this.processors = data.processors;
              }
            }
            
            // Select first processor by default
            if (this.processors.length > 0) {
              this.selectedProcessorId = this.processors[0].id;
            }
          },
          
          selectProcessor(id) {
            if (this.editMode) {
              // Cancel edit if switching processors while editing
              this.cancelEdit();
            }
            this.selectedProcessorId = id;
            this.showSecretKey = false;
          },
          
          saveProcessor() {
            this.editMode = false;
            this.originalData = null;
            this.saveToLocalStorage();
            console.log('Processor saved successfully');
          },
          
          cancelEdit() {
            if (this.originalData) {
              const index = this.processors.findIndex(p => p.id === this.selectedProcessorId);
              if (index !== -1) {
                this.processors[index] = JSON.parse(JSON.stringify(this.originalData));
              }
            }
            this.editMode = false;
            this.originalData = null;
          },
          
          setAsActive() {
            this.activeProcessorId = this.selectedProcessorId;
            this.saveToLocalStorage();
            console.log('Active processor updated');
          },
          
          addNewProcessor() {
            const newId = 'processor_' + Date.now();
            const newProcessor = {
              id: newId,
              name: 'New Processor',
              type: 'Stripe',
              description: 'Enter description here',
              logoClass: 'bg-blue-600',
              logoSvg: '<svg class="fill-white" width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M13.976 9.15c-2.172-.806-3.356-1.426-3.356-2.409 0-.831.683-1.305 1.901-1.305 2.227 0 4.515.858 6.09 1.631l.89-5.494C18.252.975 15.697 0 12.165 0 9.667 0 7.589.654 6.104 1.872 4.56 3.147 3.757 4.992 3.757 7.218c0 4.039 2.467 5.76 6.476 7.219 2.585.92 3.445 1.574 3.445 2.583 0 .98-.84 1.545-2.354 1.545-1.875 0-4.965-.921-6.99-2.109l-.9 5.555C5.175 22.99 8.385 24 11.714 24c2.641 0 4.843-.624 6.328-1.813 1.664-1.305 2.525-3.236 2.525-5.732 0-4.128-2.524-5.851-6.591-7.305z" fill=""/></svg>',
              publishableKey: '',
              secretKey: '',
              isLiveMode: false,
              customFields: []
            };
            
            this.processors.push(newProcessor);
            this.selectedProcessorId = newId;
            this.editMode = true;
            this.originalData = JSON.parse(JSON.stringify(newProcessor));
            this.saveToLocalStorage();
          },
          
          confirmDeleteProcessor() {
            if (confirm(`Are you sure you want to delete "${this.selectedProcessor.name}"? This action cannot be undone.`)) {
              const index = this.processors.findIndex(p => p.id === this.selectedProcessorId);
              if (index !== -1) {
                this.processors.splice(index, 1);
                
                // If deleted processor was active, set first processor as active
                if (this.activeProcessorId === this.selectedProcessorId) {
                  this.activeProcessorId = this.processors.length > 0 ? this.processors[0].id : null;
                }
                
                // Select first processor or none
                this.selectedProcessorId = this.processors.length > 0 ? this.processors[0].id : null;
                
                this.saveToLocalStorage();
                console.log('Processor deleted');
              }
            }
          },
          
          addCustomField() {
            if (!this.selectedProcessor.customFields) {
              this.selectedProcessor.customFields = [];
            }
            this.selectedProcessor.customFields.push({
              label: '',
              value: ''
            });
          },
          
          removeCustomField(index) {
            this.selectedProcessor.customFields.splice(index, 1);
          },
          
          copyWebhookUrl() {
            const url = `https://yourdomain.com/webhooks/${this.selectedProcessorId}`;
            navigator.clipboard.writeText(url).then(() => {
              console.log('Webhook URL copied to clipboard');
            });
          },

          savePostalCodeApiKey() {
            this.saveToLocalStorage();
            console.log('Postal code API key saved');
          },

          saveToLocalStorage() {
            const data = {
              activeProcessorId: this.activeProcessorId,
              postalCodeApiKey: this.postalCodeApiKey,
              processors: this.processors
            };
            localStorage.setItem('processorSettings', JSON.stringify(data));
          }
        };
      }
      
      // Watch for edit mode changes to save original data
      document.addEventListener('alpine:init', () => {
        Alpine.effect(() => {
          const data = Alpine.store('processorManager');
          if (data && data.editMode && !data.originalData && data.selectedProcessor) {
            data.originalData = JSON.parse(JSON.stringify(data.selectedProcessor));
          }
        });
      });
    </script>
  </body>
</html>
