<!-- Board Selector Dropdown -->
<div class="relative">
  <button 
    @click="showBoardSelector = !showBoardSelector"
    class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-400 dark:hover:bg-white/[0.03]">
    <div 
      class="w-3 h-3 rounded-full flex-shrink-0"
      :style="{ backgroundColor: activeBoard ? activeBoard.color : '#3B82F6' }"
    ></div>
    <span class="max-w-[150px] truncate" x-text="activeBoard ? activeBoard.name : 'Select Board'"></span>
    <svg class="w-4 h-4 transition-transform" :class="showBoardSelector ? 'rotate-180' : ''" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
    </svg>
  </button>
  
  <!-- Dropdown -->
  <div 
    x-show="showBoardSelector"
    @click.away="showBoardSelector = false"
    x-transition:enter="transition ease-out duration-100"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-75"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    class="absolute right-0 mt-2 w-64 rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800 z-50"
  >
    <!-- Board List -->
    <div class="max-h-64 overflow-y-auto custom-scrollbar p-2">
      <template x-for="board in boards" :key="board.id">
        <button 
          @click="switchBoard(board.id); showBoardSelector = false"
          class="flex items-center gap-3 w-full px-3 py-2 text-sm text-left rounded-lg hover:bg-gray-50 dark:hover:bg-gray-700 transition-colors"
          :class="board.id === activeBoardId ? 'bg-brand-50 text-brand-600 dark:bg-brand-900/20 dark:text-brand-400' : 'text-gray-700 dark:text-gray-300'"
        >
          <div class="w-3 h-3 rounded-full flex-shrink-0" :style="{ backgroundColor: board.color }"></div>
          <span class="flex-1 truncate" x-text="board.name"></span>
          <svg x-show="board.id === activeBoardId" class="w-4 h-4 flex-shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd" />
          </svg>
        </button>
      </template>
      
      <!-- Empty State -->
      <div x-show="boards.length === 0" class="px-3 py-8 text-center">
        <svg class="w-12 h-12 mx-auto text-gray-300 dark:text-gray-600 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
        </svg>
        <p class="text-sm text-gray-500 dark:text-gray-400">No boards yet</p>
      </div>
    </div>
    
    <!-- Divider -->
    <div class="border-t border-gray-200 dark:border-gray-700 my-2"></div>
    
    <!-- Actions -->
    <div class="p-2 space-y-1">
      <button 
        @click="openBoardModal(); showBoardSelector = false"
        class="flex items-center gap-2 w-full px-3 py-2 text-sm text-brand-600 hover:bg-brand-50 rounded-lg dark:text-brand-400 dark:hover:bg-brand-900/20 transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" />
        </svg>
        Create New Board
      </button>
      
      <button 
        x-show="activeBoard"
        @click="openBoardModal(activeBoardId); showBoardSelector = false"
        class="flex items-center gap-2 w-full px-3 py-2 text-sm text-gray-700 hover:bg-gray-50 rounded-lg dark:text-gray-300 dark:hover:bg-gray-700 transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z" />
        </svg>
        Edit Board
      </button>
      
      <button 
        x-show="boards.length > 1 && activeBoard"
        @click="deleteBoard(activeBoardId); showBoardSelector = false"
        class="flex items-center gap-2 w-full px-3 py-2 text-sm text-red-600 hover:bg-red-50 rounded-lg dark:text-red-400 dark:hover:bg-red-900/10 transition-colors"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        Delete Board
      </button>
    </div>
  </div>
</div>
