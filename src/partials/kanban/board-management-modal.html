<!-- Board Management Modal -->
<div
  x-show="showBoardModal"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-99999 flex items-center justify-center bg-black/50 px-4"
  @click.self="showBoardModal = false"
>
  <div
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    class="w-full max-w-lg rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-gray-900"
  >
    <!-- Modal Header -->
    <div class="flex items-center justify-between mb-6">
      <h3 class="text-xl font-bold text-gray-800 dark:text-white/90" x-text="newBoard.editingId ? 'Edit Board' : 'Create New Board'"></h3>
      <button
        @click="showBoardModal = false"
        class="text-gray-400 hover:text-gray-600 dark:hover:text-gray-300"
      >
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <form @submit.prevent="createBoard()" class="space-y-5">
      <!-- Board Name -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Board Name <span class="text-red-500">*</span>
        </label>
        <input
          type="text"
          x-model="newBoard.name"
          required
          placeholder="e.g., Product Development"
          class="w-full rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300"
          autofocus
        />
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Give your board a descriptive name</p>
      </div>

      <!-- Board Color -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Board Color
        </label>
        <div class="flex items-center gap-3">
          <input
            type="color"
            x-model="newBoard.color"
            class="h-10 w-20 rounded border border-gray-300 cursor-pointer dark:border-gray-700"
          />
          <input
            type="text"
            x-model="newBoard.color"
            placeholder="#3B82F6"
            pattern="^#[0-9A-Fa-f]{6}$"
            class="flex-1 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm text-gray-700 focus:border-brand-500 focus:outline-none focus:ring-1 focus:ring-brand-500 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300"
          />
        </div>
        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Choose a color to identify your board</p>
      </div>

      <!-- Color Presets -->
      <div>
        <label class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
          Quick Colors
        </label>
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            @click="newBoard.color = '#3B82F6'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#3B82F6' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-brand-500' : 'border-transparent'"
            style="background-color: #3B82F6"
            title="Blue"
          ></button>
          <button
            type="button"
            @click="newBoard.color = '#10B981'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#10B981' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-green-500' : 'border-transparent'"
            style="background-color: #10B981"
            title="Green"
          ></button>
          <button
            type="button"
            @click="newBoard.color = '#F59E0B'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#F59E0B' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-orange-500' : 'border-transparent'"
            style="background-color: #F59E0B"
            title="Orange"
          ></button>
          <button
            type="button"
            @click="newBoard.color = '#EF4444'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#EF4444' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-red-500' : 'border-transparent'"
            style="background-color: #EF4444"
            title="Red"
          ></button>
          <button
            type="button"
            @click="newBoard.color = '#8B5CF6'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#8B5CF6' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-purple-500' : 'border-transparent'"
            style="background-color: #8B5CF6"
            title="Purple"
          ></button>
          <button
            type="button"
            @click="newBoard.color = '#EC4899'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#EC4899' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-pink-500' : 'border-transparent'"
            style="background-color: #EC4899"
            title="Pink"
          ></button>
          <button
            type="button"
            @click="newBoard.color = '#06B6D4'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#06B6D4' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-cyan-500' : 'border-transparent'"
            style="background-color: #06B6D4"
            title="Cyan"
          ></button>
          <button
            type="button"
            @click="newBoard.color = '#6B7280'"
            class="w-8 h-8 rounded-full border-2 hover:scale-110 transition-transform"
            :class="newBoard.color === '#6B7280' ? 'border-gray-800 dark:border-white ring-2 ring-offset-2 ring-gray-500' : 'border-transparent'"
            style="background-color: #6B7280"
            title="Gray"
          ></button>
        </div>
      </div>

      <!-- Modal Footer -->
      <div class="flex items-center justify-end gap-3 pt-4 border-t border-gray-200 dark:border-gray-800">
        <button
          type="button"
          @click="showBoardModal = false"
          class="rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
        >
          Cancel
        </button>
        <button
          type="submit"
          class="rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600 dark:bg-brand-600 dark:hover:bg-brand-700"
        >
          <span x-text="newBoard.editingId ? 'Update Board' : 'Create Board'"></span>
        </button>
      </div>
    </form>
  </div>
</div>
