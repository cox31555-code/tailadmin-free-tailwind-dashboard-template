<script>
  // Initialize Expired Annual Table Configuration
  if (typeof window.expiredAnnualTableConfig !== 'undefined') {
    window.tableConfig = window.expiredAnnualTableConfig;
    window.initializeTable(window.expiredAnnualTableConfig);
  }
</script>

<div
  x-data="createTableState(window.expiredAnnualTableConfig)"
  @click.outside="filterPanelOpen = false"
  class="overflow-visible rounded-xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-[#010a1b]"
>
  <!-- Table Header with Compact Inline Stats -->
  <div class="flex flex-col gap-3 sm:gap-4 px-4 py-3 sm:px-6 sm:py-4 border-b border-gray-200 dark:border-gray-800">
    <!-- Stats Row -->
    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
      <!-- Compact Inline Stats Badges -->
      <div class="flex items-center gap-1.5 sm:gap-2 flex-wrap">
        <span class="inline-flex items-center gap-1 sm:gap-1.5 rounded-md border border-gray-300 dark:border-gray-700 bg-gray-50 dark:bg-gray-800/50 px-2 sm:px-3 py-1 sm:py-1.5 text-[10px] sm:text-theme-xs">
          <span class="text-gray-600 dark:text-gray-400">Total Expired:</span>
          <span class="font-semibold text-gray-800 dark:text-white/90" x-text="policyCounts.total"></span>
        </span>
      </div>

      <!-- Show Entries Control -->
      <div class="hidden sm:flex items-center gap-2">
        <span class="text-theme-xs text-gray-600 dark:text-gray-400">Show</span>
        <select class="rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-theme-xs font-medium text-gray-700 hover:border-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-300 dark:hover:border-gray-600 dark:focus:border-brand-600">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span class="text-theme-xs text-gray-600 dark:text-gray-400">entries</span>
      </div>
    </div>

    <!-- Controls Row -->
    <div class="flex flex-col sm:flex-row items-stretch sm:items-center gap-2">
      <!-- Search input -->
      <input
        x-model="searchQuery"
        @input="filterAndSearchTable(searchQuery, filterPayment)"
        type="text"
        placeholder="Search by name, email, vehicle..."
        class="flex-1 rounded-lg border border-gray-300 bg-white px-3 sm:px-4 py-2 text-theme-xs sm:text-theme-sm font-medium text-gray-800 placeholder:text-gray-500 hover:border-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-[#010a1b] dark:text-gray-300 dark:placeholder:text-gray-500 dark:hover:border-gray-600 dark:focus:border-brand-600"
      />

      <!-- Action Buttons Group -->
      <div class="flex items-center gap-2">
        <!-- Filter button -->
        <div class="relative flex-1 sm:flex-none">
          <button
            @click="filterPanelOpen = !filterPanelOpen"
            class="w-full sm:w-auto inline-flex items-center justify-center gap-1.5 sm:gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200 whitespace-nowrap"
          >
            <svg
              class="stroke-current fill-white dark:fill-gray-800"
              width="14"
              height="14"
              viewBox="0 0 20 20"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                d="M2.29004 5.90393H17.7067"
                stroke=""
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M17.7075 14.0961H2.29085"
                stroke=""
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
              <path
                d="M12.0826 3.33331C13.5024 3.33331 14.6534 4.48431 14.6534 5.90414C14.6534 7.32398 13.5024 8.47498 12.0826 8.47498C10.6627 8.47498 9.51172 7.32398 9.51172 5.90415C9.51172 4.48432 10.6627 3.33331 12.0826 3.33331Z"
                fill=""
                stroke=""
                stroke-width="1.5"
              />
              <path
                d="M7.91745 11.525C6.49762 11.525 5.34662 12.676 5.34662 14.0959C5.34661 15.5157 6.49762 16.6667 7.91745 16.6667C9.33728 16.6667 10.4883 15.5157 10.4883 14.0959C10.4883 12.676 9.33728 11.525 7.91745 11.525Z"
                fill=""
                stroke=""
                stroke-width="1.5"
              />
            </svg>
            Filter
          </button>

          <!-- Filter panel -->
          <div
            x-show="filterPanelOpen"
            x-transition
            class="absolute left-0 top-full mt-2 w-48 rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-[#0c192c] z-10"
          >
            <div class="p-4 space-y-3">
              <div>
                <label class="block text-theme-xs font-medium text-gray-700 dark:text-gray-300 mb-2">Payment Type</label>
                <select
                  x-model="filterPayment"
                  @change="filterAndSearchTable(searchQuery, filterPayment)"
                  class="w-full rounded-lg border border-gray-300 bg-white px-2.5 py-2 text-theme-xs font-medium text-gray-700 hover:border-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-300"
                >
                  <option value="all">All</option>
                  <option value="monthly">Monthly</option>
                  <option value="one-time">One-time</option>
                </select>
              </div>

              <div class="flex gap-2 pt-2 border-t border-gray-200 dark:border-gray-700">
                <button
                  @click="filterPayment = 'all'; filterAndSearchTable(searchQuery, filterPayment); filterPanelOpen = false"
                  class="flex-1 rounded-lg border border-gray-300 bg-white px-3 py-2 text-theme-xs font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-400 dark:hover:bg-white/[0.03]"
                >
                  Clear
                </button>
                <button
                  @click="filterPanelOpen = false"
                  class="flex-1 rounded-lg bg-brand-500 px-3 py-2 text-theme-xs font-medium text-white hover:bg-brand-600"
                >
                  Apply
                </button>
              </div>
            </div>
          </div>
        </div>

        <!-- Export button -->
        <button
          onclick="window.exportTableToCSV()"
          class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-theme-sm font-medium text-gray-700 hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200 whitespace-nowrap"
        >
          <svg
            class="stroke-current fill-none"
            width="16"
            height="16"
            viewBox="0 0 20 20"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path
              d="M4 13V17C4 17.5304 4.21071 18.0391 4.58579 18.4142C4.96086 18.7893 5.46957 19 6 19H14C14.5304 19 15.0391 18.7893 15.4142 18.4142C15.7893 18.0391 16 17.5304 16 17V13M7 10L10 13M10 13L13 10M10 13V3"
              stroke="currentColor"
              stroke-width="1.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
          Export CSV
        </button>
      </div>
    </div>
  </div>

  <div class="max-w-full overflow-x-auto">
    <div class="table-scroller" id="tableScroller">
      <table class="min-w-max sm:min-w-full table-auto overflow-visible">
      <!-- table header start -->
      <thead class="bg-gray-50 dark:bg-[#010a1b]">
        <tr class="border-b-2 border-gray-200 dark:border-gray-800">
          <!-- Customer Header -->
          <th class="px-5 py-3.5 text-left sm:px-6 cursor-pointer hover:bg-gray-100 dark:hover:bg-white/[0.03] transition-colors" @click="handleSort('name')">
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Customer</p>
              <span x-show="sortColumn === 'name'" class="text-gray-600 dark:text-gray-300">
                <span x-show="sortDirection === 'asc'">↑</span>
                <span x-show="sortDirection === 'desc'">↓</span>
              </span>
            </div>
          </th>
          <!-- Phone Header -->
          <th class="px-5 py-3.5 text-left sm:px-6 cursor-pointer hover:bg-gray-100 dark:hover:bg-white/[0.03] transition-colors" @click="handleSort('phone')">
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Phone</p>
              <span x-show="sortColumn === 'phone'" class="text-gray-600 dark:text-gray-300">
                <span x-show="sortDirection === 'asc'">↑</span>
                <span x-show="sortDirection === 'desc'">↓</span>
              </span>
            </div>
          </th>
          <!-- Vehicle Header -->
          <th class="px-5 py-3.5 text-left sm:px-6 cursor-pointer hover:bg-gray-100 dark:hover:bg-white/[0.03] transition-colors" @click="handleSort('vehicle')">
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Vehicle</p>
              <span x-show="sortColumn === 'vehicle'" class="text-gray-600 dark:text-gray-300">
                <span x-show="sortDirection === 'asc'">↑</span>
                <span x-show="sortDirection === 'desc'">↓</span>
              </span>
            </div>
          </th>
          <!-- Price Header -->
          <th class="px-5 py-3.5 text-left sm:px-6 cursor-pointer hover:bg-gray-100 dark:hover:bg-white/[0.03] transition-colors" @click="handleSort('price')">
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Price</p>
              <span x-show="sortColumn === 'price'" class="text-gray-600 dark:text-gray-300">
                <span x-show="sortDirection === 'asc'">↑</span>
                <span x-show="sortDirection === 'desc'">↓</span>
              </span>
            </div>
          </th>
          <!-- Payment Header -->
          <th class="px-5 py-3.5 text-left sm:px-6 cursor-pointer hover:bg-gray-100 dark:hover:bg-white/[0.03] transition-colors" @click="handleSort('payment')">
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Payment</p>
              <span x-show="sortColumn === 'payment'" class="text-gray-600 dark:text-gray-300">
                <span x-show="sortDirection === 'asc'">↑</span>
                <span x-show="sortDirection === 'desc'">↓</span>
              </span>
            </div>
          </th>
          <!-- Policy Start Header -->
          <th class="px-5 py-3.5 text-left sm:px-6 cursor-pointer hover:bg-gray-100 dark:hover:bg-white/[0.03] transition-colors" @click="handleSort('policystart')">
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Policy Start</p>
              <span x-show="sortColumn === 'policystart'" class="text-gray-600 dark:text-gray-300">
                <span x-show="sortDirection === 'asc'">↑</span>
                <span x-show="sortDirection === 'desc'">↓</span>
              </span>
            </div>
          </th>
          <!-- Policy End Header -->
          <th class="px-5 py-3.5 text-left sm:px-6 cursor-pointer hover:bg-gray-100 dark:hover:bg-white/[0.03] transition-colors" @click="handleSort('policyend')">
            <div class="flex items-center gap-2">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Policy End</p>
              <span x-show="sortColumn === 'policyend'" class="text-gray-600 dark:text-gray-300">
                <span x-show="sortDirection === 'asc'">↑</span>
                <span x-show="sortDirection === 'desc'">↓</span>
              </span>
            </div>
          </th>
          <!-- Actions Header -->
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">Actions</p>
          </th>
        </tr>
      </thead>
      <!-- table header end -->
      <!-- table body start -->
      <tbody class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-[#030e21]">
        <!-- Dynamic Rows for Expired Policies -->
        <template x-for="policy in expiredPolicies" :key="policy.email + policy.policyEnd">
          <tr class="hover:bg-gray-50 dark:hover:bg-white/[0.03] transition-colors">
            <td class="px-5 py-3 sm:px-6">
              <div class="flex flex-col gap-0.5">
                <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90" x-text="policy.name"></p>
                <p class="text-gray-500 text-theme-xs dark:text-gray-400" x-text="policy.email"></p>
              </div>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="policy.phone"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="policy.vehicle"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90" x-text="policy.price"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="text-gray-600 text-theme-sm dark:text-gray-400" x-text="policy.payment"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="policy.policyStart"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="policy.policyEnd"></p>
            </td>
            <td class="px-5 py-3 sm:px-6 actions-column-sticky" x-data="{ actionsOpen: false }" @click.outside="actionsOpen = false" :class="actionsOpen && 'dropdown-active'">
              <div class="relative">
                <button @click="actionsOpen = !actionsOpen" class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-2 text-theme-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-400 dark:hover:bg-white/[0.03]">
                  Actions
                  <svg class="h-4 w-4 transition-transform" :class="actionsOpen && 'rotate-180'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                  </svg>
                </button>
                <div x-show="actionsOpen" x-transition class="absolute right-0 top-full mt-2 w-40 rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-[#0c192c] table-action-dropdown z-50">
                  <button class="block w-full px-4 py-2.5 text-left text-theme-sm font-medium text-brand-600 hover:bg-brand-50 dark:text-brand-400 dark:hover:bg-brand-500/10 first:rounded-t-lg">View</button>
                  <button class="block w-full px-4 py-2.5 text-left text-theme-sm font-medium text-brand-600 hover:bg-brand-50 dark:text-brand-400 dark:hover:bg-brand-500/10">Renew</button>
                  <button class="block w-full px-4 py-2.5 text-left text-theme-sm font-medium text-error-600 hover:bg-error-50 dark:text-error-400 dark:hover:bg-error-500/10">Delete</button>
                  <button class="block w-full px-4 py-2.5 text-left text-theme-sm font-medium text-brand-600 hover:bg-brand-50 dark:text-brand-400 dark:hover:bg-brand-500/10 last:rounded-b-lg">Send Email</button>
                </div>
              </div>
            </td>
          </tr>
        </template>
        <!-- Show message if no expired policies -->
        <tr x-show="expiredPolicies.length === 0">
          <td colspan="8" class="px-5 py-8 text-center text-gray-500 dark:text-gray-400">
            No expired annual policies found.
          </td>
        </tr>
      </tbody>
      </table>
    </div>
  </div>

  <div class="flex flex-wrap items-center justify-center gap-1 border-t border-gray-200 px-3 py-5 dark:border-gray-800 sm:px-6">
    <button class="rounded-lg border border-gray-300 bg-white px-2 py-2 sm:px-4 text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-400 dark:hover:bg-white/[0.03]">
      Prev
    </button>

    <div class="pagination-scroller flex items-center gap-0.5 sm:gap-1 overflow-x-auto">
      <button class="flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-lg bg-brand-500 text-theme-xs sm:text-theme-sm font-medium text-white">
        1
      </button>
    </div>

    <button class="rounded-lg border border-gray-300 bg-white px-2 py-2 sm:px-4 text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-[#0c192c] dark:text-gray-400 dark:hover:bg-white/[0.03]">
      Next
    </button>
  </div>
</div>
