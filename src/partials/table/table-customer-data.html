  // Customer data map with names and addresses
  const customerDataMap = {

    'nicole.roberts@example.com': { name: 'Nicole Roberts', address: '456 Maple Avenue, Manchester, UK', joinDate: 'Feb 20, 2024', totalPolicies: 2, status: 'Active' },
    'robert.taylor@example.com': { name: 'Robert Taylor', address: '789 Elm Road, Birmingham, UK', joinDate: 'Mar 10, 2024', totalPolicies: 1, status: 'Active' },

    'emma.davis@example.com': { name: 'Emma Davis', address: '258 Walnut Avenue, Bristol, UK', joinDate: 'Jan 30, 2024', totalPolicies: 3, status: 'Active' },
    'jane.smith@example.com': { name: 'Jane Smith', address: '369 Hazel Court, Nottingham, UK', joinDate: 'Apr 12, 2024', totalPolicies: 1, status: 'Active' },
    'john.doe@example.com': { name: 'John Doe', address: '753 Spruce Lane, Sheffield, UK', joinDate: 'Feb 28, 2024', totalPolicies: 2, status: 'Active' },
    'david.johnson@example.com': { name: 'David Johnson', address: '456 Oak Park, Manchester, UK', joinDate: 'Mar 18, 2024', totalPolicies: 1, status: 'Inactive' },
    'susan.brown@example.com': { name: 'Susan Brown', address: '789 Elm Street, London, UK', joinDate: 'Jan 08, 2024', totalPolicies: 3, status: 'Active' },
    'mark.davis@example.com': { name: 'Mark Davis', address: '321 Pine Court, Leeds, UK', joinDate: 'Apr 02, 2024', totalPolicies: 1, status: 'Active' },
    'lisa.wilson@example.com': { name: 'Lisa Wilson', address: '654 Birch Avenue, Glasgow, UK', joinDate: 'Feb 16, 2024', totalPolicies: 2, status: 'Active' }
  };

  // All quote data from all sources
  const allQuoteData = [
    { email: 'james.wilson@example.com', phone: '+44-7123-456789', vehicle: 'Toyota Camry' },
    { email: 'nicole.roberts@example.com', phone: '+44-7234-567890', vehicle: 'BMW X5' },
    { email: 'robert.taylor@example.com', phone: '+44-7345-678901', vehicle: 'Mercedes-Benz C-Class' },
    { email: 'patricia.anderson@example.com', phone: '+44-7456-789012', vehicle: 'Audi A6' },
    { email: 'michael.green@example.com', phone: '+44-7567-890123', vehicle: 'Honda Accord' },
    { email: 'sarah.clark@example.com', phone: '+44-7678-901234', vehicle: 'Volkswagen Passat' },
    { email: 'john.miller@example.com', phone: '+44-7789-012345', vehicle: 'Nissan Altima' },
    { email: 'emma.davis@example.com', phone: '+44-7890-123456', vehicle: 'Ford Mustang' },
    { email: 'jane.smith@example.com', phone: '07987654321', vehicle: 'Honda Civic' },
    { email: 'john.doe@example.com', phone: '07912345678', vehicle: 'Toyota Corolla' },
    { email: 'david.johnson@example.com', phone: '07834567890', vehicle: 'Audi A4' },
    { email: 'susan.brown@example.com', phone: '07756789012', vehicle: 'BMW 3 Series' },
    { email: 'mark.davis@example.com', phone: '07923456789', vehicle: 'Volkswagen Golf' },
    { email: 'lisa.wilson@example.com', phone: '07845678901', vehicle: 'Mazda CX-5' }
  ];

  function getUniqueCustomers() {
    const customerMap = new Map();

    allQuoteData.forEach(quote => {
      if (!customerMap.has(quote.email)) {
        const customer = customerDataMap[quote.email] || {
          name: quote.email.split('.').map(p => p.charAt(0).toUpperCase() + p.slice(1)).join(' '),
          address: 'N/A',
          joinDate: 'N/A',
          totalPolicies: 0,
          status: 'Active'
        };
        customerMap.set(quote.email, {
          name: customer.name,
          email: quote.email,
          phone: quote.phone,
          address: customer.address,
          joinDate: customer.joinDate,
          totalPolicies: customer.totalPolicies,
          status: customer.status
        });
      }
    });

    return Array.from(customerMap.values()).sort((a, b) => a.name.localeCompare(b.name));
  }

  // Alpine.js component
  function customerDataTable() {
    return {
      customers: [],
      filteredCustomers: [],
      searchQuery: '',
      statusFilter: 'All',
      currentPage: 1,
      itemsPerPage: 10,
      
      init() {
        this.customers = getUniqueCustomers();
        this.filteredCustomers = this.customers;
      },

      get totalCustomers() {
        return this.customers.length;
      },

      get activeCustomers() {
        return this.customers.filter(c => c.status === 'Active').length;
      },

      get inactiveCustomers() {
        return this.customers.filter(c => c.status === 'Inactive').length;
      },

      get totalPolicies() {
        return this.customers.reduce((sum, c) => sum + c.totalPolicies, 0);
      },

      filterCustomers() {
        let filtered = this.customers;

        // Search filter
        if (this.searchQuery) {
          const query = this.searchQuery.toLowerCase();
          filtered = filtered.filter(c => 
            c.name.toLowerCase().includes(query) ||
            c.email.toLowerCase().includes(query) ||
            c.phone.toLowerCase().includes(query) ||
            c.address.toLowerCase().includes(query)
          );
        }

        // Status filter
        if (this.statusFilter !== 'All') {
          filtered = filtered.filter(c => c.status === this.statusFilter);
        }

        this.filteredCustomers = filtered;
        this.currentPage = 1;
      },

      get paginatedCustomers() {
        const start = (this.currentPage - 1) * this.itemsPerPage;
        const end = start + this.itemsPerPage;
        return this.filteredCustomers.slice(start, end);
      },

      get totalPages() {
        return Math.ceil(this.filteredCustomers.length / this.itemsPerPage);
      },

      nextPage() {
        if (this.currentPage < this.totalPages) {
          this.currentPage++;
        }
      },

      prevPage() {
        if (this.currentPage > 1) {
          this.currentPage--;
        }
      },

      exportToCSV() {
        const headers = ['Name', 'Email', 'Phone', 'Address', 'Join Date', 'Total Policies', 'Status'];
        const csvContent = [
          headers.join(','),
          ...this.filteredCustomers.map(c => 
            `"${c.name}","${c.email}","${c.phone}","${c.address}","${c.joinDate}",${c.totalPolicies},"${c.status}"`
          )
        ].join('\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'customer-data.csv';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      },

      exportToJSON() {
        const jsonContent = JSON.stringify(this.filteredCustomers, null, 2);
        const blob = new Blob([jsonContent], { type: 'application/json;charset=utf-8;' });
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'customer-data.json';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      }
    }
  }
</script>

          </template>

          <!-- Empty State -->
          <template x-if="paginatedCustomers.length === 0">
            <tr>
              <td colspan="7" class="px-5 py-12 text-center">
                <div class="flex flex-col items-center justify-center">
                  <div class="mb-4 flex h-16 w-16 items-center justify-center rounded-full bg-gray-100 dark:bg-gray-800">
                    <svg class="h-8 w-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                  </div>
                  <p class="font-medium text-gray-700 dark:text-gray-300">No customers found</p>
                  <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Try adjusting your search or filters</p>
                </div>
              </td>
            </tr>
          </template>
        </tbody>
      </table>
    </div>

    <!-- Pagination -->
    <div class="flex flex-wrap items-center justify-between gap-3 border-t border-gray-200 px-5 py-4 dark:border-gray-700 sm:px-6">
      <p class="text-sm text-gray-600 dark:text-gray-400">
        Showing <span class="font-medium text-gray-900 dark:text-white" x-text="((currentPage - 1) * itemsPerPage) + 1"></span> to 
        <span class="font-medium text-gray-900 dark:text-white" x-text="Math.min(currentPage * itemsPerPage, filteredCustomers.length)"></span> of 
        <span class="font-medium text-gray-900 dark:text-white" x-text="filteredCustomers.length"></span> customers
      </p>

      <div class="flex items-center gap-2">
        <button 
          @click="prevPage()"
          :disabled="currentPage === 1"
          :class="currentPage === 1 ? 'opacity-50 cursor-not-allowed' : ''"
          class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700"
        >
          Previous
        </button>
        <div class="flex items-center gap-1">
          <template x-for="page in totalPages" :key="page">
            <button 
              @click="currentPage = page"
              :class="currentPage === page ? 'bg-brand-500 text-white' : 'text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800'"
              class="flex h-9 w-9 items-center justify-center rounded-lg text-sm font-medium transition-colors"
              x-text="page"
            ></button>
          </template>
        </div>
        <button 
          @click="nextPage()"
          :disabled="currentPage === totalPages"
          :class="currentPage === totalPages ? 'opacity-50 cursor-not-allowed' : ''"
          class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700"
        >
          Next
        </button>
      </div>
    </div>
  </div>
</div>
