      { type: 'Annual', name: 'John Doe', price: '$299.99', email: 'john.doe@example.com', phone: '07912345678', vehicle: 'Toyota Corolla', policyStart: 'Jan 07, 2024', policyEnd: 'Jan 07, 2024 11:59 PM' },
      { type: 'Annual', name: 'Sarah Wilson', price: '$299.99', email: 'sarah.wilson@example.com', phone: '07923456789', vehicle: 'Ford Focus', policyStart: 'Jan 04, 2024', policyEnd: 'Jan 04, 2024 11:59 PM' },
      { type: 'Temporary', name: 'Jane Davis', price: '$49.99', email: 'jane.davis@example.com', phone: '07945678901', vehicle: 'Audi A4', policyStart: 'Dec 15, 2024', policyEnd: 'Dec 22, 2024 11:59 PM' },

    ],
    isExpired(dateStr) {
      const policyEndDate = new Date(dateStr);
      const currentDate = new Date();
      return policyEndDate < currentDate;
    },
    getExpiredPolicies() {
      return this.policies.filter(policy => this.isExpired(policy.policyEnd));
    }
  }"

      </thead>
      <!-- table header end -->
      <!-- table body start -->
      <tbody class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-white/[0.03]">
        <template x-for="policy in getExpiredPolicies()" :key="policy.name + policy.policyEnd">
          <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
            <td class="px-5 py-4 sm:px-6">
              <span class="inline-flex rounded-full px-3 py-1 text-theme-xs font-medium"
                :class="{
                  'bg-blue-50 text-blue-600 dark:bg-blue-500/15 dark:text-blue-400': policy.type === 'Annual',
                  'bg-blue-50 text-blue-600 dark:bg-blue-500/15 dark:text-blue-400': policy.type === 'Temporary',
                  'bg-red-50 text-red-600 dark:bg-red-500/15 dark:text-red-400': policy.type === 'Impound'

                  <button class="block w-full px-4 py-2.5 text-left text-theme-sm font-medium text-brand-600 hover:bg-brand-50 dark:text-brand-400 dark:hover:bg-white/[0.03] first:rounded-t-lg">
