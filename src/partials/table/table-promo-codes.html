<div>
  <!-- Table Header -->
  <div class="flex flex-col gap-4 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
    <div>
      <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
        All Promo Codes
      </h3>
      <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
        Manage and track your discount codes
      </p>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:gap-2">
      <button
        @click="openPromoAdd()"
        class="inline-flex items-center justify-center gap-2 rounded-lg border border-brand-500 bg-brand-500 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition-colors hover:bg-brand-600 hover:border-brand-600 dark:border-brand-600 dark:bg-brand-500 dark:hover:bg-brand-600"
      >
        <svg
          class="fill-current"
          width="16"
          height="16"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M10 3C10.5523 3 11 3.44772 11 4V9H16C16.5523 9 17 9.44772 17 10C17 10.5523 16.5523 11 16 11H11V16C11 16.5523 10.5523 17 10 17C9.44772 17 9 16.5523 9 16V11H4C3.44772 11 3 10.5523 3 10C3 9.44772 3.44772 9 4 9H9V4C9 3.44772 9.44772 3 10 3Z"
            fill=""
          />
        </svg>
        Create Code
      </button>
    </div>
  </div>

  <!-- Table -->
  <div class="border-t border-gray-100 dark:border-gray-800 overflow-x-auto custom-scrollbar">
    <table class="min-w-full table-auto">
      <!-- table header start -->
      <thead class="bg-gray-50 dark:bg-gray-800/50">
        <tr class="border-b border-gray-200 dark:border-gray-700">
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p class="text-xs font-semibold text-gray-600 uppercase tracking-wider dark:text-gray-300">
              Code
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p class="text-xs font-semibold text-gray-600 uppercase tracking-wider dark:text-gray-300">
              Discount
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p class="text-xs font-semibold text-gray-600 uppercase tracking-wider dark:text-gray-300">
              Expires
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p class="text-xs font-semibold text-gray-600 uppercase tracking-wider dark:text-gray-300">
              Status
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p class="text-xs font-semibold text-gray-600 uppercase tracking-wider dark:text-gray-300">
              Actions
            </p>
          </th>
        </tr>
      </thead>
      <!-- table header end -->

      <!-- table body start -->
      <tbody class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-[#010a1b]">
        <template x-for="promo in promoList" :key="promo.code">
          <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
            <td class="px-5 py-4 sm:px-6">
              <div class="flex items-center gap-3">
                <div class="flex items-center justify-center w-10 h-10 rounded-lg bg-brand-50 dark:bg-brand-900/30">
                  <svg class="w-5 h-5 text-brand-600 dark:text-brand-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                  </svg>
                </div>
                <p class="font-semibold text-gray-900 text-sm dark:text-white" x-text="promo.code"></p>
              </div>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="font-semibold text-brand-600 text-sm dark:text-brand-400" x-text="promo.savings"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="text-gray-600 text-sm dark:text-gray-400" x-text="promo.expiryDate"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <span 
                :class="promo.status === 'Active' ? 'bg-success-50 text-success-700 border-success-200 dark:bg-success-500/15 dark:text-success-400 dark:border-success-500/20' : 'bg-gray-50 text-gray-600 border-gray-200 dark:bg-gray-800 dark:text-gray-400 dark:border-gray-700'" 
                class="inline-flex items-center gap-1.5 rounded-md border px-2.5 py-1 text-xs font-medium"
              >
                <div :class="promo.status === 'Active' ? 'bg-success-500' : 'bg-gray-400'" class="w-1.5 h-1.5 rounded-full"></div>
                <span x-text="promo.status"></span>
              </span>
            </td>
            <td class="px-5 py-3 sm:px-6 actions-column-sticky" x-data="{ actionsOpen: false }" @click.outside="actionsOpen = false" :class="actionsOpen && 'dropdown-active'">
              <div class="relative">
                <button
                  @click="actionsOpen = !actionsOpen"
                  class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-1.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700"
                >
                  Actions
                  <svg class="h-4 w-4 transition-transform" :class="actionsOpen && 'rotate-180'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7" />
                  </svg>
                </button>
                <div
                  x-show="actionsOpen"
                  x-transition
                  class="absolute right-0 top-full z-50 mt-2 w-40 rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800"
                >
                  <button
                    @click="openPromoEdit(promo.code, promo.savings.replace('%', ''), '50', promo.expiryDate, promo.status, '0'); actionsOpen = false"
                    class="flex w-full items-center gap-2 px-4 py-2.5 text-left text-sm font-medium text-brand-600 transition-colors hover:bg-brand-50 dark:text-brand-400 dark:hover:bg-brand-500/10 first:rounded-t-lg"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    Edit
                  </button>
                  <button 
                    class="flex w-full items-center gap-2 px-4 py-2.5 text-left text-sm font-medium text-error-600 transition-colors hover:bg-error-50 dark:text-error-400 dark:hover:bg-error-900/20 last:rounded-b-lg"
                  >
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                    </svg>
                    Delete
                  </button>
                </div>
              </div>
            </td>
          </tr>
        </template>

        <!-- Empty State -->
        <template x-if="promoList.length === 0">
          <tr>
            <td colspan="5" class="px-5 py-12 text-center">
              <div class="flex flex-col items-center justify-center">
                <div class="flex items-center justify-center w-16 h-16 mb-4 rounded-full bg-gray-100 dark:bg-gray-800">
                  <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z"></path>
                  </svg>
                </div>
                <p class="font-medium text-gray-700 dark:text-gray-300">No promo codes found</p>
                <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Create your first promo code to get started</p>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
      <!-- table body end -->
    </table>
  </div>

  <!-- Pagination -->
  <div class="flex flex-wrap items-center justify-between gap-3 border-t border-gray-200 px-5 py-4 dark:border-gray-700 sm:px-6">
    <p class="text-sm text-gray-600 dark:text-gray-400">
      Showing <span class="font-medium text-gray-900 dark:text-white" x-text="promoList.length"></span> promo codes
    </p>

    <div class="flex items-center gap-2">
      <button class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700">
        Previous
      </button>
      <button class="flex h-9 w-9 items-center justify-center rounded-lg bg-brand-500 text-sm font-medium text-white">
        1
      </button>
      <button class="flex h-9 w-9 items-center justify-center rounded-lg text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800">
        2
      </button>
      <button class="flex h-9 w-9 items-center justify-center rounded-lg text-sm font-medium text-gray-700 transition-colors hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-gray-800">
        3
      </button>
      <button class="rounded-lg border border-gray-300 bg-white px-3 py-2 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-gray-700">
        Next
      </button>
    </div>
  </div>
</div>
