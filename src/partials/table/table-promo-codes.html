<div
  class="overflow-visible rounded-xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
>
  <div class="flex flex-col gap-3 px-5 py-4 sm:flex-row sm:items-center sm:justify-between sm:px-6">
    <div>
      <h3 class="text-base font-semibold text-gray-800 dark:text-white/90">
        Promo Codes List
      </h3>
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:gap-2">
      <button
        @click="openPromoAdd()"
        class="inline-flex items-center gap-2 rounded-lg border border-brand-500 bg-brand-500 px-4 py-2 text-theme-xs sm:text-theme-sm font-medium text-white shadow-theme-xs hover:bg-brand-600 hover:border-brand-600 dark:border-brand-600 dark:bg-brand-500 dark:text-white dark:hover:bg-brand-600 dark:hover:border-brand-600 w-full sm:w-auto justify-center sm:justify-start"
      >
        <svg
          class="fill-current"
          width="16"
          height="16"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M10 3C10.5523 3 11 3.44772 11 4V9H16C16.5523 9 17 9.44772 17 10C17 10.5523 16.5523 11 16 11H11V16C11 16.5523 10.5523 17 10 17C9.44772 17 9 16.5523 9 16V11H4C3.44772 11 3 10.5523 3 10C3 9.44772 3.44772 9 4 9H9V4C9 3.44772 9.44772 3 10 3Z"
            fill=""
          />
        </svg>
        Create Promo
      </button>

      <button
        class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-3 py-2 text-theme-xs sm:text-theme-sm font-medium text-gray-700 shadow-theme-xs hover:bg-gray-50 hover:text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03] dark:hover:text-gray-200 w-full sm:w-auto justify-center sm:justify-start"
      >
        <svg
          class="stroke-current fill-white dark:fill-gray-800"
          width="16"
          height="16"
          viewBox="0 0 20 20"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M2.29004 5.90393H17.7067"
            stroke=""
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M17.7075 14.0961H2.29085"
            stroke=""
            stroke-width="1.5"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path
            d="M12.0826 3.33331C13.5024 3.33331 14.6534 4.48431 14.6534 5.90414C14.6534 7.32398 13.5024 8.47498 12.0826 8.47498C10.6627 8.47498 9.51172 7.32398 9.51172 5.90415C9.51172 4.48432 10.6627 3.33331 12.0826 3.33331Z"
            fill=""
            stroke=""
            stroke-width="1.5"
          />
          <path
            d="M7.91745 11.525C6.49762 11.525 5.34662 12.676 5.34662 14.0959C5.34661 15.5157 6.49762 16.6667 7.91745 16.6667C9.33728 16.6667 10.4883 15.5157 10.4883 14.0959C10.4883 12.676 9.33728 11.525 7.91745 11.525Z"
            fill=""
            stroke=""
            stroke-width="1.5"
          />
        </svg>
        Filter
      </button>

      <div class="flex items-center gap-2 justify-center sm:justify-start">
        <span class="text-theme-xs sm:text-theme-sm text-gray-600 dark:text-gray-400">Show</span>
        <select class="rounded-lg border border-gray-300 bg-white px-2 sm:px-3 py-2 text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:border-gray-400 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:border-gray-600 dark:focus:border-brand-600">
          <option value="10">10</option>
          <option value="25" selected>25</option>
          <option value="50">50</option>
          <option value="100">100</option>
        </select>
        <span class="text-theme-xs sm:text-theme-sm text-gray-600 dark:text-gray-400">entries</span>
      </div>
    </div>
  </div>

  <div class="max-w-full overflow-x-auto table-scroller" id="tableScroller">
    <table class="min-w-max sm:min-w-full table-auto overflow-visible">
      <!-- table header start -->
      <thead class="bg-gray-50 dark:bg-gray-800/50">
        <tr class="border-b-2 border-gray-200 dark:border-gray-700">
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p
              class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300"
            >
              Code
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p
              class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300"
            >
              Discount
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p
              class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300"
            >
              Expires
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p
              class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300"
            >
              Status
            </p>
          </th>
          <th class="px-5 py-3.5 text-left sm:px-6">
            <p
              class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300"
            >
              Actions
            </p>
          </th>
        </tr>
      </thead>
      <!-- table header end -->
      <!-- table body start -->
      <tbody class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-white/[0.03]">
        <template x-for="promo in promoList" :key="promo.code">
          <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
            <td class="px-5 py-4 sm:px-6">
              <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90" x-text="promo.code"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90" x-text="promo.savings"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="promo.expiryDate"></p>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <span :class="promo.status === 'Active' ? 'bg-green-50 text-green-600 dark:bg-green-500/15 dark:text-green-400' : 'bg-gray-50 text-gray-600 dark:bg-gray-700 dark:text-gray-300'" class="inline-flex rounded-full px-3 py-1 text-theme-xs font-medium">
                <span x-text="promo.status"></span>
              </span>
            </td>
            <td class="px-5 py-3 sm:px-6">
              <div class="relative" x-data="{ actionsOpen: false }" @click.outside="actionsOpen = false">
                <button @click="actionsOpen = !actionsOpen" class="inline-flex items-center gap-1.5 rounded-lg border border-gray-300 bg-white px-3 py-2 text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]">
                  Actions
                  <svg class="h-4 w-4 transition-transform" :class="actionsOpen && 'rotate-180'" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M19 14l-7 7m0 0l-7-7m7 7V3" />
                  </svg>
                </button>
                <div x-show="actionsOpen" x-transition class="absolute right-0 top-full mt-2 w-40 rounded-lg border border-gray-200 bg-white shadow-lg dark:border-gray-700 dark:bg-gray-800 table-action-dropdown">
                  <button @click="openPromoEdit(promo.code, promo.savings.replace('%', ''), '50', promo.expiryDate, promo.status, '0'); actionsOpen = false" class="block w-full px-4 py-2.5 text-left text-theme-xs sm:text-theme-sm font-medium text-blue-600 hover:bg-blue-50 dark:text-blue-400 dark:hover:bg-white/[0.03] first:rounded-t-lg">
                    Edit
                  </button>
                  <button class="block w-full px-4 py-2.5 text-left text-theme-xs sm:text-theme-sm font-medium text-error-600 hover:bg-error-50 dark:text-error-400 dark:hover:bg-white/[0.03] last:rounded-b-lg">
                    Delete
                  </button>
                </div>
              </div>
            </td>
          </tr>
        </template>
      </tbody>
      <!-- table body end -->
    </table>
  </div>

  <div class="flex flex-wrap items-center justify-center gap-1 border-t border-gray-200 px-3 py-5 dark:border-gray-700 sm:px-6">
    <button class="rounded-lg border border-gray-300 bg-white px-2 py-2 sm:px-4 text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]">
      Prev
    </button>

    <div class="flex items-center gap-0.5 sm:gap-1">
      <button class="flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-lg bg-brand-500 text-theme-xs sm:text-theme-sm font-medium text-white">
        1
      </button>
      <button class="flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-lg text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/[0.03]">
        2
      </button>
      <button class="hidden sm:flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-lg text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/[0.03]">
        3
      </button>
      <span class="px-1 sm:px-2 py-1 sm:py-2 text-theme-xs sm:text-theme-sm text-gray-500 dark:text-gray-400">...</span>
      <button class="hidden sm:flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-lg text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/[0.03]">
        8
      </button>
      <button class="hidden sm:flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-lg text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/[0.03]">
        9
      </button>
      <button class="flex h-8 w-8 sm:h-9 sm:w-9 items-center justify-center rounded-lg text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-100 dark:text-gray-400 dark:hover:bg-white/[0.03]">
        10
      </button>
    </div>

    <button class="rounded-lg border border-gray-300 bg-white px-2 py-2 sm:px-4 text-theme-xs sm:text-theme-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]">
      Next
    </button>
  </div>
</div>
