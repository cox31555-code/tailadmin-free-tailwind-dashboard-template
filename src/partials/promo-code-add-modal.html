<div
  x-show="promoCodeAddModal"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-99999 flex items-center justify-center p-4 overflow-y-auto"
  style="display: none;"
>
  <!-- Backdrop -->
  <div
    class="fixed inset-0 bg-gray-900/80 backdrop-blur-sm"
    @click="promoCodeAddModal = false"
  ></div>

  <!-- Modal -->
  <div
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    @click.outside="promoCodeAddModal = false"
    class="relative w-full max-w-2xl bg-white rounded-2xl shadow-xl dark:bg-gray-900"
  >
    <!-- Header -->
    <div class="flex items-start justify-between p-6 border-b border-gray-200 dark:border-gray-800">
      <div>
        <h3 class="text-xl font-bold text-gray-900 dark:text-white">
          Create Promo Code
        </h3>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Add a new discount code for your customers
        </p>
      </div>
      <button
        @click="promoCodeAddModal = false"
        class="flex items-center justify-center w-10 h-10 rounded-lg text-gray-400 transition-colors hover:bg-gray-100 hover:text-gray-600 dark:hover:bg-gray-800 dark:hover:text-gray-300"
      >
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
        </svg>
      </button>
    </div>

    <!-- Body -->
    <form class="p-6 space-y-6">
      <div class="grid grid-cols-1 gap-6 sm:grid-cols-2">
        <!-- Promo Code -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
            Promo Code <span class="text-error-600">*</span>
          </label>
          <input
            type="text"
            x-model="newPromo.code"
            placeholder="e.g., SAVE20"
            class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg bg-white text-gray-900 placeholder-gray-400 transition-colors focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 dark:focus:border-brand-600"
          />
        </div>

        <!-- Discount Percentage -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
            Discount (%) <span class="text-error-600">*</span>
          </label>
          <div class="relative">
            <input
              type="number"
              x-model="newPromo.savings"
              placeholder="20"
              min="0"
              max="100"
              class="w-full px-4 py-2.5 pr-10 text-sm border border-gray-300 rounded-lg bg-white text-gray-900 placeholder-gray-400 transition-colors focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 dark:focus:border-brand-600"
            />
            <span class="absolute right-4 top-1/2 -translate-y-1/2 text-sm text-gray-500 dark:text-gray-400">%</span>
          </div>
        </div>

        <!-- Minimum Spend -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
            Minimum Spend
          </label>
          <div class="relative">
            <span class="absolute left-4 top-1/2 -translate-y-1/2 text-sm text-gray-500 dark:text-gray-400">£</span>
            <input
              type="number"
              x-model="newPromo.minSpend"
              placeholder="50.00"
              min="0"
              step="0.01"
              class="w-full pl-8 pr-4 py-2.5 text-sm border border-gray-300 rounded-lg bg-white text-gray-900 placeholder-gray-400 transition-colors focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 dark:focus:border-brand-600"
            />
          </div>
        </div>

        <!-- Expiry Date -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
            Expiry Date <span class="text-error-600">*</span>
          </label>
          <div x-data x-init="flatpickr($refs.addExpireDateInput, { dateFormat: 'd/m/Y', minDate: 'today' })">
            <input
              x-ref="addExpireDateInput"
              type="text"
              x-model="newPromo.expiryDate"
              placeholder="Select date"
              class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg bg-white text-gray-900 placeholder-gray-400 transition-colors focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 dark:focus:border-brand-600"
            />
          </div>
        </div>

        <!-- Status -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
            Status
          </label>
          <div class="relative">
            <select
              x-model="newPromo.status"
              class="w-full px-4 py-2.5 pr-10 text-sm border border-gray-300 rounded-lg bg-white text-gray-900 appearance-none transition-colors focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:focus:border-brand-600"
            >
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
            <svg class="absolute right-4 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-500 pointer-events-none dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
            </svg>
          </div>
        </div>

        <!-- Usage Limit -->
        <div>
          <label class="block mb-2 text-sm font-medium text-gray-700 dark:text-gray-300">
            Usage Limit
          </label>
          <input
            type="number"
            x-model="newPromo.uses"
            placeholder="Unlimited"
            min="0"
            class="w-full px-4 py-2.5 text-sm border border-gray-300 rounded-lg bg-white text-gray-900 placeholder-gray-400 transition-colors focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-white dark:placeholder-gray-500 dark:focus:border-brand-600"
          />
        </div>
      </div>

      <!-- Skip Payment Toggle -->
      <div class="flex items-center justify-between p-4 rounded-xl border border-gray-200 bg-gray-50 dark:border-gray-700 dark:bg-gray-800/50">
        <div class="flex-1">
          <label class="block text-sm font-medium text-gray-900 dark:text-white">
            Skip Payment
          </label>
          <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-400">
            Allow customers to bypass payment with this code
          </p>
        </div>
        <button
          type="button"
          @click="newPromo.skipPayment = !newPromo.skipPayment"
          :class="newPromo.skipPayment ? 'bg-brand-500' : 'bg-gray-300 dark:bg-gray-600'"
          class="relative inline-flex h-6 w-11 flex-shrink-0 rounded-full border-2 border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
        >
          <span
            :class="newPromo.skipPayment ? 'translate-x-5' : 'translate-x-0'"
            class="inline-block h-5 w-5 transform rounded-full bg-white shadow transition duration-200 ease-in-out"
          ></span>
        </button>
      </div>
    </form>

    <!-- Footer -->
    <div class="flex items-center justify-end gap-3 p-6 border-t border-gray-200 dark:border-gray-800">
      <button
        @click="promoCodeAddModal = false"
        type="button"
        class="px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors rounded-lg border border-gray-300 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800"
      >
        Cancel
      </button>
      <button
        @click="createPromo()"
        type="button"
        class="px-6 py-2.5 text-sm font-semibold text-white transition-colors rounded-lg bg-brand-500 hover:bg-brand-600"
      >
        Create Code
      </button>
    </div>
  </div>
</div>
