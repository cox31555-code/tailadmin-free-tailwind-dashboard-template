<div class="space-y-6">
  <!-- Quotes Overview Card Start -->
  <div
    x-data="quotesCounter()"
    x-init="init()"
    class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]"
  >
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Quotes
    </h3>

    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3 md:gap-6">
      <!-- Today Card -->
      <div
        class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.02]"
      >
        <span class="text-sm text-gray-500 dark:text-gray-400">Today</span>
        <h4
          class="mt-2 text-title-sm font-bold text-gray-800 dark:text-white/90"
        >
          <span x-text="formatNumber(todayCount)"></span>
        </h4>
      </div>

      <!-- Last 7 Days Card -->
      <div
        class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.02]"
      >
        <span class="text-sm text-gray-500 dark:text-gray-400">Last 7 Days</span>
        <h4
          class="mt-2 text-title-sm font-bold text-gray-800 dark:text-white/90"
        >
          <span x-text="formatNumber(last7DaysCount)"></span>
        </h4>
      </div>

      <!-- Past 30 Days Card -->
      <div
        class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.02]"
      >
        <span class="text-sm text-gray-500 dark:text-gray-400">Past 30 Days</span>
        <h4
          class="mt-2 text-title-sm font-bold text-gray-800 dark:text-white/90"
        >
          <span x-text="formatNumber(past30DaysCount)"></span>
        </h4>
      </div>
    </div>
  </div>
  <!-- Quotes Overview Card End -->

  <!-- Orders Overview Card Start -->
  <div
    x-data="ordersCounter()"
    x-init="init()"
    class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]"
  >
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Orders
    </h3>

    <div class="mt-6 grid grid-cols-1 gap-4 sm:grid-cols-3 md:gap-6">
      <!-- Today Card -->
      <div
        class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.02]"
      >
        <span class="text-sm text-gray-500 dark:text-gray-400">Today</span>
        <h4
          class="mt-2 text-title-sm font-bold text-gray-800 dark:text-white/90"
        >
          <span x-text="formatNumber(todayCount)"></span>
        </h4>
      </div>

      <!-- Last 7 Days Card -->
      <div
        class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.02]"
      >
        <span class="text-sm text-gray-500 dark:text-gray-400">Last 7 Days</span>
        <h4
          class="mt-2 text-title-sm font-bold text-gray-800 dark:text-white/90"
        >
          <span x-text="formatNumber(last7DaysCount)"></span>
        </h4>
      </div>

      <!-- Past 30 Days Card -->
      <div
        class="rounded-lg border border-gray-200 bg-gray-50 p-4 dark:border-gray-800 dark:bg-white/[0.02]"
      >
        <span class="text-sm text-gray-500 dark:text-gray-400">Past 30 Days</span>
        <h4
          class="mt-2 text-title-sm font-bold text-gray-800 dark:text-white/90"
        >
          <span x-text="formatNumber(past30DaysCount)"></span>
        </h4>
      </div>
    </div>
  </div>
  <!-- Orders Overview Card End -->
</div>
