<!-- Enhanced Processor Card Component -->
<div
  @click="selectProcessor(processorId)"
  :class="activeProcessor === processorId ? 'border-brand-500 bg-brand-50 dark:bg-brand-500/10 shadow-theme-md' : 'border-gray-200 dark:border-gray-700 hover:border-brand-300 dark:hover:border-brand-600'"
  class="relative rounded-xl border-2 p-5 text-left transition-all cursor-pointer group"
>
  <div class="flex items-start justify-between gap-4">
    <div class="flex items-center gap-3 flex-1 min-w-0">
      <!-- Logo Container -->
      <div
        :class="logoClass"
        class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-lg"
      >
        <div x-html="logoSvg" class="w-6 h-6"></div>
      </div>

      <!-- Content -->
      <div class="flex-1 min-w-0">
        <h5 class="font-semibold text-gray-800 dark:text-white/90 mb-1" x-text="processorName"></h5>
        
        <!-- Description (editable) -->
        <div x-show="!isEditing" class="flex items-center gap-2">
          <p
            class="text-sm text-gray-500 dark:text-gray-400 cursor-pointer hover:text-brand-600 dark:hover:text-brand-400 transition-colors truncate"
            @click.stop="startEdit"
            title="Click to edit"
            x-text="description"
          ></p>
          <button
            @click.stop="startEdit"
            class="opacity-0 group-hover:opacity-100 transition-opacity text-gray-400 hover:text-brand-600 dark:hover:text-brand-400"
            title="Edit description"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" />
            </svg>
          </button>
        </div>

        <!-- Edit Input -->
        <input
          x-show="isEditing"
          x-model="description"
          type="text"
          @blur="stopEdit"
          @keydown.escape="stopEdit"
          @keydown.enter="stopEdit"
          @click.stop
          class="w-full text-sm border border-brand-500 rounded px-2 py-1 text-gray-800 dark:text-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-brand-500/50"
          x-ref="editInput"
        />
      </div>
    </div>

    <!-- Active Badge -->
    <span
      x-show="activeProcessor === processorId"
      class="inline-flex items-center rounded-full bg-success-50 px-2.5 py-0.5 text-xs font-medium text-success-600 dark:bg-success-500/15 dark:text-success-500 whitespace-nowrap flex-shrink-0"
    >
      Active
    </span>
  </div>

  <!-- Configure Button (shows on hover or when active) -->
  <button
    x-show="activeProcessor === processorId"
    @click.stop="openConfig"
    class="mt-4 w-full flex items-center justify-center gap-2 rounded-lg border border-brand-500 bg-white px-4 py-2 text-sm font-medium text-brand-600 hover:bg-brand-50 dark:border-brand-600 dark:bg-gray-800 dark:text-brand-400 dark:hover:bg-brand-500/10 transition-colors"
  >
    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
    </svg>
    Configure
  </button>
</div>
