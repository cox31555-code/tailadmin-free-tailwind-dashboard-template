<div
  x-show="isCreateUserModal"
  class="fixed inset-0 flex items-end sm:items-center justify-center sm:p-5 z-99999"
>
  <div
    class="modal-close-btn fixed inset-0 h-full w-full bg-black/70"
    @click="isCreateUserModal = false"
  ></div>
  <div
    @click.outside="isCreateUserModal = false"
    class="no-scrollbar relative w-full max-w-[700px] h-screen sm:h-auto sm:rounded-3xl rounded-t-3xl overflow-y-auto bg-white p-4 dark:bg-gray-900 sm:p-8 lg:p-11"
  >
    <!-- close btn -->
    <button
      @click="isCreateUserModal = false"
      class="transition-color absolute right-4 top-4 sm:right-5 sm:top-5 z-999 flex h-10 sm:h-11 w-10 sm:w-11 items-center justify-center rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 dark:bg-gray-700 dark:bg-white/[0.05] dark:text-gray-400 dark:hover:bg-white/[0.07] dark:hover:text-gray-300"
    >
      <svg
        class="fill-current"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M6.04289 16.5418C5.65237 16.9323 5.65237 17.5655 6.04289 17.956C6.43342 18.3465 7.06658 18.3465 7.45711 17.956L11.9987 13.4144L16.5408 17.9565C16.9313 18.347 17.5645 18.347 17.955 17.9565C18.3455 17.566 18.3455 16.9328 17.955 16.5423L13.4129 12.0002L17.955 7.45808C18.3455 7.06756 18.3455 6.43439 17.955 6.04387C17.5645 5.65335 16.9313 5.65335 16.5408 6.04387L11.9987 10.586L7.45711 6.04439C7.06658 5.65386 6.43342 5.65386 6.04289 6.04439C5.65237 6.43491 5.65237 7.06808 6.04289 7.4586L10.5845 12.0002L6.04289 16.5418Z"
          fill=""
        />
      </svg>
    </button>

    <div class="pr-8 sm:pr-0">
      <h4 class="text-xl sm:text-2xl font-semibold text-gray-800 dark:text-white/90">
        Create User
      </h4>
      <p class="mt-1 sm:mt-2 text-xs sm:text-sm text-gray-500 dark:text-gray-400">
        Add a new user to the system.
      </p>
    </div>

    <form class="flex flex-col mt-5 sm:mt-6">
      <div class="custom-scrollbar space-y-5 sm:space-y-6">
        <div class="grid grid-cols-1 gap-4 sm:gap-x-6 sm:gap-y-5 lg:grid-cols-2">
          <!-- Full Name Field -->
          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Full Name
            </label>
            <input
              type="text"
              placeholder="Enter full name"
              class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <!-- Email Field -->
          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Email Address
            </label>
            <input
              type="email"
              placeholder="Enter email address"
              class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <!-- Password Field -->
          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Password
            </label>
            <div x-data="{ showPassword: false }" class="relative">
              <input
                :type="showPassword ? 'text' : 'password'"
                placeholder="Enter password"
                class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 pr-11 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
              />
              <span
                @click="showPassword = !showPassword"
                class="absolute top-1/2 right-3 sm:right-4 z-30 -translate-y-1/2 cursor-pointer"
              >
                <svg
                  x-show="!showPassword"
                  class="fill-gray-500 dark:fill-gray-400 w-4 h-4 sm:w-5 sm:h-5"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M10.0002 13.8619C7.23361 13.8619 4.86803 12.1372 3.92328 9.70241C4.86804 7.26761 7.23361 5.54297 10.0002 5.54297C12.7667 5.54297 15.1323 7.26762 16.0771 9.70243C15.1323 12.1372 12.7667 13.8619 10.0002 13.8619ZM10.0002 4.04297C6.48191 4.04297 3.49489 6.30917 2.4155 9.4593C2.3615 9.61687 2.3615 9.78794 2.41549 9.94552C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C13.5184 15.3619 16.5055 13.0957 17.5849 9.94555C17.6389 9.78797 17.6389 9.6169 17.5849 9.45932C16.5055 6.30919 13.5184 4.04297 10.0002 4.04297ZM9.99151 7.84413C8.96527 7.84413 8.13333 8.67606 8.13333 9.70231C8.13333 10.7286 8.96527 11.5605 9.99151 11.5605H10.0064C11.0326 11.5605 11.8646 10.7286 11.8646 9.70231C11.8646 8.67606 11.0326 7.84413 10.0064 7.84413H9.99151Z"
                  />
                </svg>

                <svg
                  x-show="showPassword"
                  class="fill-gray-500 dark:fill-gray-400 w-4 h-4 sm:w-5 sm:h-5"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    fill-rule="evenodd"
                    clip-rule="evenodd"
                    d="M4.63803 3.57709C4.34513 3.2842 3.87026 3.2842 3.57737 3.57709C3.28447 3.86999 3.28447 4.34486 3.57737 4.63775L4.85323 5.91362C3.74609 6.84199 2.89363 8.06395 2.4155 9.45936C2.3615 9.61694 2.3615 9.78801 2.41549 9.94558C3.49488 13.0957 6.48191 15.3619 10.0002 15.3619C11.255 15.3619 12.4422 15.0737 13.4994 14.5598L15.3625 16.4229C15.6554 16.7158 16.1302 16.7158 16.4231 16.4229C16.716 16.13 16.716 15.6551 16.4231 15.3622L4.63803 3.57709ZM12.3608 13.4212L10.4475 11.5079C10.3061 11.5423 10.1584 11.5606 10.0064 11.5606H9.99151C8.96527 11.5606 8.13333 10.7286 8.13333 9.70237C8.13333 9.5461 8.15262 9.39434 8.18895 9.24933L5.91885 6.97923C5.03505 7.69015 4.34057 8.62704 3.92328 9.70247C4.86803 12.1373 7.23361 13.8619 10.0002 13.8619C10.8326 13.8619 11.6287 13.7058 12.3608 13.4212ZM16.0771 9.70249C15.7843 10.4569 15.3552 11.1432 14.8199 11.7311L15.8813 12.7925C16.6329 11.9813 17.2187 11.0143 17.5849 9.94561C17.6389 9.78803 17.6389 9.61696 17.5849 9.45938C16.5055 6.30925 13.5184 4.04303 10.0002 4.04303C9.13525 4.04303 8.30244 4.17999 7.52218 4.43338L8.75139 5.66259C9.1556 5.58413 9.57311 5.54303 10.0002 5.54303C12.7667 5.54303 15.1323 7.26768 16.0771 9.70249Z"
                  />
                </svg>
              </span>
            </div>
          </div>

          <!-- Role Dropdown -->
          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Role
            </label>
            <div
              x-data="{ isOptionSelected: false }"
              class="relative z-20 bg-transparent"
            >
              <select
                class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-3 sm:px-4 py-2 sm:py-2.5 pr-10 sm:pr-11 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                :class="isOptionSelected && 'text-gray-800 dark:text-white/90'"
                @change="isOptionSelected = true"
              >
                <option
                  value=""
                  class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                >
                  Select Role
                </option>
                <option
                  value="admin"
                  class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                >
                  Admin
                </option>
                <option
                  value="support"
                  class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                >
                  Support
                </option>
                <option
                  value="basic"
                  class="text-gray-700 dark:bg-gray-900 dark:text-gray-400"
                >
                  Basic
                </option>
              </select>
              <span
                class="pointer-events-none absolute top-1/2 right-3 sm:right-4 z-30 -translate-y-1/2 text-gray-500 dark:text-gray-400"
              >
                <svg
                  class="stroke-current w-4 h-4 sm:w-5 sm:h-5"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
                    stroke=""
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </div>
          </div>
        </div>
      </div>

      <div class="flex flex-col-reverse sm:flex-row items-center gap-3 mt-6 sm:mt-8 lg:justify-end pb-4 sm:pb-0">
        <button
          @click="isCreateUserModal = false"
          type="button"
          class="flex w-full sm:w-auto justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-xs sm:text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]"
        >
          Cancel
        </button>
        <button
          type="button"
          class="flex w-full sm:w-auto justify-center rounded-lg bg-blue-500 px-4 py-2.5 text-xs sm:text-sm font-medium text-white hover:bg-blue-600"
        >
          Create User
        </button>
      </div>
    </form>
  </div>
</div>
