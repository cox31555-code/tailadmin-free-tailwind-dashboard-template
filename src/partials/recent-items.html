<div class="col-span-12">
  <div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]" x-data="recentItems()" x-init="init()">
    <div class="px-5 py-4 sm:px-6 sm:py-5">
      <h3 class="text-base font-medium text-gray-800 dark:text-white/90">
        Recent
      </h3>
    </div>

    <div class="border-t border-gray-100 dark:border-gray-800 overflow-x-auto">
      <table class="min-w-full table-auto">
        <!-- table header start -->
        <thead class="bg-gray-50 dark:bg-gray-800/50">
          <tr class="border-b border-gray-200 dark:border-gray-700">
            <th class="px-5 py-3.5 text-left sm:px-6">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">
                Customer Name
              </p>
            </th>
            <th class="px-5 py-3.5 text-left sm:px-6">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">
                Vehicle
              </p>
            </th>
            <th class="px-5 py-3.5 text-left sm:px-6">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">
                Amount
              </p>
            </th>
            <th class="px-5 py-3.5 text-left sm:px-6">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">
                Email
              </p>
            </th>
            <th class="px-5 py-3.5 text-left sm:px-6">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">
                Type
              </p>
            </th>
            <th class="px-5 py-3.5 text-left sm:px-6">
              <p class="font-semibold text-gray-600 text-theme-xs uppercase tracking-wider dark:text-gray-300">
                Date/Time Received
              </p>
            </th>
          </tr>
        </thead>
        <!-- table header end -->

        <!-- table body start -->
        <tbody class="divide-y divide-gray-200 dark:divide-gray-700 bg-white dark:bg-white/[0.03]">
          <template x-if="loading">
            <tr>
              <td colspan="6" class="px-5 py-8 text-center">
                <p class="text-gray-500 dark:text-gray-400">Loading recent items...</p>
              </td>
            </tr>
          </template>

          <template x-if="!loading && items.length === 0">
            <tr>
              <td colspan="6" class="px-5 py-8 text-center">
                <p class="text-gray-500 dark:text-gray-400">No recent items found</p>
              </td>
            </tr>
          </template>

          <template x-for="(item, index) in items" :key="index">
            <tr class="hover:bg-gray-50 dark:hover:bg-gray-800/30 transition-colors">
              <td class="px-5 py-4 sm:px-6">
                <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90" x-text="item.customer">
                </p>
              </td>
              <td class="px-5 py-3 sm:px-6">
                <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="item.vehicle || 'N/A'">
                </p>
              </td>
              <td class="px-5 py-3 sm:px-6">
                <p class="font-medium text-gray-800 text-theme-sm dark:text-white/90" x-text="item.amount || '-'">
                </p>
              </td>
              <td class="px-5 py-3 sm:px-6">
                <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="item.email">
                </p>
              </td>
              <td class="px-5 py-3 sm:px-6">
                <template x-if="getTypeBadge(item.type)">
                  <span class="inline-flex rounded-full px-3 py-1 text-theme-xs font-medium" :class="getTypeBadge(item.type).color">
                    <span x-text="getTypeBadge(item.type).label"></span>
                  </span>
                </template>
              </td>
              <td class="px-5 py-3 sm:px-6">
                <p class="text-gray-500 text-theme-sm dark:text-gray-400" x-text="formatDateTime(item.date, item.time)">
                </p>
              </td>
            </tr>
          </template>
        </tbody>
        <!-- table body end -->
      </table>
    </div>
  </div>
</div>
