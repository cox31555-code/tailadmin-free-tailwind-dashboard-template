<div class="col-span-12">
  <div class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-white to-gray-50 shadow-lg dark:from-gray-900 dark:to-gray-800" x-data="recentItems()" x-init="init()">
    <!-- Decorative Elements -->
    <div class="absolute top-0 right-0 w-40 h-40 bg-gradient-to-br from-gray-400/5 to-transparent rounded-full -mr-20 -mt-20"></div>
    
    <div class="relative">
      <!-- Header -->
      <div class="flex items-center justify-between p-6 md:px-8 md:py-6">
        <div class="flex items-center gap-4">
          <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-gray-600 to-gray-700 shadow-lg shadow-gray-600/25">
            <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <div>
            <h3 class="text-xl font-bold text-gray-900 dark:text-white">
              Recent Activity
            </h3>
            <p class="text-sm text-gray-500 dark:text-gray-400">Latest quotes and orders</p>
          </div>
        </div>
        <button class="inline-flex items-center gap-2 px-4 py-2 text-sm font-semibold text-brand-600 transition-all rounded-lg hover:bg-brand-50 dark:text-brand-400 dark:hover:bg-brand-900/20">
          View All
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
          </svg>
        </button>
      </div>

      <!-- Table -->
      <div class="overflow-x-auto">
        <table class="min-w-full">
          <!-- Table Header -->
          <thead class="bg-gray-100/80 dark:bg-gray-800/80 backdrop-blur-sm">
            <tr class="border-t border-b border-gray-200 dark:border-gray-700">
              <th class="px-6 py-4 text-left md:px-8">
                <p class="text-xs font-bold text-gray-700 uppercase tracking-wide dark:text-gray-300">
                  Customer Name
                </p>
              </th>
              <th class="px-6 py-4 text-left md:px-8">
                <p class="text-xs font-bold text-gray-700 uppercase tracking-wide dark:text-gray-300">
                  Vehicle
                </p>
              </th>
              <th class="px-6 py-4 text-left md:px-8">
                <p class="text-xs font-bold text-gray-700 uppercase tracking-wide dark:text-gray-300">
                  Amount
                </p>
              </th>
              <th class="px-6 py-4 text-left md:px-8">
                <p class="text-xs font-bold text-gray-700 uppercase tracking-wide dark:text-gray-300">
                  Email
                </p>
              </th>
              <th class="px-6 py-4 text-left md:px-8">
                <p class="text-xs font-bold text-gray-700 uppercase tracking-wide dark:text-gray-300">
                  Type
                </p>
              </th>
              <th class="px-6 py-4 text-left md:px-8">
                <p class="text-xs font-bold text-gray-700 uppercase tracking-wide dark:text-gray-300">
                  Date/Time
                </p>
              </th>
            </tr>
          </thead>

          <!-- Table Body -->
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            <template x-if="loading">
              <tr>
                <td colspan="6" class="px-6 py-12 text-center md:px-8">
                  <div class="flex flex-col items-center justify-center">
                    <div class="w-12 h-12 mb-4 border-4 border-gray-200 rounded-full border-t-brand-500 animate-spin dark:border-gray-700"></div>
                    <p class="text-sm text-gray-500 dark:text-gray-400">Loading recent items...</p>
                  </div>
                </td>
              </tr>
            </template>

            <template x-if="!loading && items.length === 0">
              <tr>
                <td colspan="6" class="px-6 py-12 text-center md:px-8">
                  <div class="flex flex-col items-center justify-center">
                    <div class="flex items-center justify-center w-16 h-16 mb-4 rounded-full bg-gray-100 dark:bg-gray-800">
                      <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                      </svg>
                    </div>
                    <p class="font-medium text-gray-700 dark:text-gray-300">No recent items found</p>
                    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">New activity will appear here</p>
                  </div>
                </td>
              </tr>
            </template>

            <template x-for="(item, index) in items" :key="index">
              <tr class="transition-colors hover:bg-gray-50 dark:hover:bg-gray-800/50">
                <td class="px-6 py-4 md:px-8">
                  <p class="font-semibold text-gray-900 text-sm dark:text-white" x-text="item.customer"></p>
                </td>
                <td class="px-6 py-4 md:px-8">
                  <p class="text-sm text-gray-600 dark:text-gray-400" x-text="item.vehicle || 'N/A'"></p>
                </td>
                <td class="px-6 py-4 md:px-8">
                  <p class="text-sm font-semibold text-gray-900 dark:text-white" x-text="item.amount || '-'"></p>
                </td>
                <td class="px-6 py-4 md:px-8">
                  <p class="text-sm text-gray-600 dark:text-gray-400" x-text="item.email"></p>
                </td>
                <td class="px-6 py-4 md:px-8">
                  <template x-if="getTypeBadge(item.type)">
                    <span class="inline-flex items-center rounded-full px-3 py-1 text-xs font-semibold shadow-sm" :class="getTypeBadge(item.type).color">
                      <span x-text="getTypeBadge(item.type).label"></span>
                    </span>
                  </template>
                </td>
                <td class="px-6 py-4 md:px-8">
                  <p class="text-sm text-gray-600 dark:text-gray-400" x-text="formatDateTime(item.date, item.time)"></p>
                </td>
              </tr>
            </template>
          </tbody>
        </table>
      </div>
    </div>
  </div>
</div>
