<div class="rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]">
  <div class="px-5 py-4 sm:px-6 sm:py-5 border-b border-gray-200 dark:border-gray-800">
    <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
      Statistics
    </h3>
    <p class="text-sm text-gray-500 dark:text-gray-400 mt-1">
      Target you've set for each month
    </p>
  </div>

  <div class="p-5 sm:p-6">
    <div class="grid grid-cols-1 gap-4 sm:grid-cols-2 lg:grid-cols-4">
      <!-- Sales Card -->
      <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-white/[0.02] p-4 sm:p-5">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Sales</span>
            <h4 x-data="salesCounter()" x-init="init()" class="mt-2 text-2xl sm:text-3xl font-bold text-gray-800 dark:text-white">
              <span x-text="totalCount"></span>
            </h4>
          </div>
          <div class="rounded-lg bg-blue-100 dark:bg-blue-500/15 p-3">
            <svg class="w-6 h-6 text-blue-600 dark:text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
        </div>
        <p class="text-xs text-gray-500 dark:text-gray-500 mt-3">Annual, Temporary, Impound</p>
      </div>

      <!-- Quotes Card -->
      <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-white/[0.02] p-4 sm:p-5">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Quotes</span>
            <h4 x-data="quotesCounter()" x-init="init()" class="mt-2 text-2xl sm:text-3xl font-bold text-gray-800 dark:text-white">
              <span x-text="totalQuotes"></span>
            </h4>
          </div>
          <div class="rounded-lg bg-purple-100 dark:bg-purple-500/15 p-3">
            <svg class="w-6 h-6 text-purple-600 dark:text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
            </svg>
          </div>
        </div>
        <p class="text-xs text-gray-500 dark:text-gray-500 mt-3">Total Quotes</p>
      </div>

      <!-- Target Progress Card -->
      <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-white/[0.02] p-4 sm:p-5">
        <div class="flex items-center justify-between">
          <div class="flex-1">
            <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Target Progress</span>
            <h4 class="mt-2 text-2xl sm:text-3xl font-bold text-gray-800 dark:text-white">75%</h4>
          </div>
          <div class="rounded-lg bg-green-100 dark:bg-green-500/15 p-3">
            <svg class="w-6 h-6 text-green-600 dark:text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
            </svg>
          </div>
        </div>
        <div class="mt-3 w-full bg-gray-200 dark:bg-gray-700 rounded-full h-2">
          <div class="bg-green-600 dark:bg-green-500 h-2 rounded-full" style="width: 75%"></div>
        </div>
      </div>

      <!-- Monthly Average Card -->
      <div class="rounded-lg border border-gray-200 dark:border-gray-700 bg-gray-50 dark:bg-white/[0.02] p-4 sm:p-5">
        <div class="flex items-center justify-between">
          <div>
            <span class="text-sm font-medium text-gray-600 dark:text-gray-400">Monthly Avg</span>
            <h4 class="mt-2 text-2xl sm:text-3xl font-bold text-gray-800 dark:text-white">
              <span x-data="monthlyAvg()" x-text="avgValue"></span>
            </h4>
          </div>
          <div class="rounded-lg bg-orange-100 dark:bg-orange-500/15 p-3">
            <svg class="w-6 h-6 text-orange-600 dark:text-orange-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
            </svg>
          </div>
        </div>
        <p class="text-xs text-gray-500 dark:text-gray-500 mt-3">Per Month</p>
      </div>
    </div>
  </div>
</div>
