<div
  x-show="promoCodeEditModal"
  class="fixed inset-0 flex items-end sm:items-center justify-center sm:p-5 z-99999"
>
  <div
    class="modal-close-btn fixed inset-0 h-full w-full bg-black/50"
    @click="promoCodeEditModal = false"
  ></div>
  <div
    @click.outside="promoCodeEditModal = false"
    class="no-scrollbar relative w-full max-w-[700px] h-screen sm:h-auto sm:rounded-3xl rounded-t-3xl overflow-y-auto bg-white p-4 dark:bg-gray-900 sm:p-8 lg:p-11"
  >
    <!-- close btn -->
    <button
      @click="promoCodeEditModal = false"
      class="transition-color absolute right-4 top-4 sm:right-5 sm:top-5 z-999 flex h-10 sm:h-11 w-10 sm:w-11 items-center justify-center rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 dark:bg-gray-700 dark:bg-white/[0.05] dark:text-gray-400 dark:hover:bg-white/[0.07] dark:hover:text-gray-300"
    >
      <svg
        class="fill-current"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M6.04289 16.5418C5.65237 16.9323 5.65237 17.5655 6.04289 17.956C6.43342 18.3465 7.06658 18.3465 7.45711 17.956L11.9987 13.4144L16.5408 17.9565C16.9313 18.347 17.5645 18.347 17.955 17.9565C18.3455 17.566 18.3455 16.9328 17.955 16.5423L13.4129 12.0002L17.955 7.45808C18.3455 7.06756 18.3455 6.43439 17.955 6.04387C17.5645 5.65335 16.9313 5.65335 16.5408 6.04387L11.9987 10.586L7.45711 6.04439C7.06658 5.65386 6.43342 5.65386 6.04289 6.04439C5.65237 6.43491 5.65237 7.06808 6.04289 7.4586L10.5845 12.0002L6.04289 16.5418Z"
          fill=""
        />
      </svg>
    </button>

    <div class="pr-8 sm:pr-0">
      <h4 class="text-xl sm:text-2xl font-semibold text-gray-800 dark:text-white/90">
        Edit Promo Code
      </h4>
      <p class="mt-1 sm:mt-2 text-xs sm:text-sm text-gray-500 dark:text-gray-400">
        Update promo code details and settings.
      </p>
    </div>

    <form class="flex flex-col mt-5 sm:mt-6">
      <div class="custom-scrollbar space-y-5 sm:space-y-6">
        <div class="grid grid-cols-1 gap-4 sm:gap-x-6 sm:gap-y-5 lg:grid-cols-2">
          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Promo Code
            </label>
            <input
              type="text"
              x-model="selectedPromo?.code"
              placeholder="SAVE20"
              class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              % Saving
            </label>
            <div class="flex items-center">
              <input
                type="text"
                x-model="selectedPromo?.savings"
                placeholder="20"
                class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
              />
              <span class="ml-2 text-xs sm:text-sm text-gray-700 dark:text-gray-400">%</span>
            </div>
          </div>

          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Minimum Spend
            </label>
            <div class="flex items-center">
              <span class="text-xs sm:text-sm text-gray-700 dark:text-gray-400">£</span>
              <input
                type="text"
                x-model="selectedPromo?.minSpend"
                placeholder="50"
                class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800 ml-2"
              />
            </div>
          </div>

          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Expiry Date
            </label>
            <div x-data="{ dateValue: selectedPromo?.expiryDate }" x-init="flatpickr($refs.expireDateInput, { dateFormat: 'd/m/Y', minDate: 'today' })">
              <input
                x-ref="expireDateInput"
                type="text"
                x-model="selectedPromo.expiryDate"
                placeholder="Select a date"
                class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
              />
            </div>
          </div>

          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Status
            </label>
            <div
              x-data="{ isOptionSelected: false }"
              class="relative z-20 bg-transparent"
            >
              <select
                x-model="selectedPromo?.status"
                class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent bg-none px-3 sm:px-4 py-2 sm:py-2.5 pr-10 sm:pr-11 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
                :class="isOptionSelected && 'text-gray-800 dark:text-white/90'"
                @change="isOptionSelected = true"
              >
                <option value="Active" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
                  Active
                </option>
                <option value="Inactive" class="text-gray-700 dark:bg-gray-900 dark:text-gray-400">
                  Inactive
                </option>
              </select>
              <span
                class="pointer-events-none absolute top-1/2 right-3 sm:right-4 z-30 -translate-y-1/2 text-gray-500 dark:text-gray-400"
              >
                <svg
                  class="stroke-current w-4 h-4 sm:w-5 sm:h-5"
                  viewBox="0 0 20 20"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M4.79175 7.396L10.0001 12.6043L15.2084 7.396"
                    stroke=""
                    stroke-width="1.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                  />
                </svg>
              </span>
            </div>
          </div>

          <div class="col-span-1">
            <label
              class="mb-1.5 block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-400"
            >
              Number of Uses
            </label>
            <input
              type="number"
              x-model="selectedPromo?.uses"
              placeholder="0"
              class="dark:bg-dark-900 h-10 sm:h-11 w-full appearance-none rounded-lg border border-gray-300 bg-transparent px-3 sm:px-4 py-2 sm:py-2.5 text-xs sm:text-sm text-gray-800 shadow-theme-xs placeholder:text-gray-400 focus:border-brand-300 focus:outline-hidden focus:ring-3 focus:ring-brand-500/10 dark:border-gray-700 dark:bg-gray-900 dark:text-white/90 dark:placeholder:text-white/30 dark:focus:border-brand-800"
            />
          </div>

          <div class="col-span-1 lg:col-span-2 flex items-center justify-between rounded-lg border border-gray-200 bg-gray-50 p-3 sm:p-4 dark:border-gray-800 dark:bg-white/[0.03]">
            <div>
              <label
                class="block text-xs sm:text-sm font-medium text-gray-700 dark:text-gray-300"
              >
                Skip Payment
              </label>
              <p class="mt-0.5 text-xs text-gray-500 dark:text-gray-500">
                Allow this promo code to skip payment processing
              </p>
            </div>
            <button
              type="button"
              @click="selectedPromo.skipPayment = !selectedPromo.skipPayment"
              :class="selectedPromo?.skipPayment ? 'bg-brand-500' : 'bg-gray-300 dark:bg-gray-600'"
              class="relative inline-flex h-6 sm:h-7 w-11 sm:w-12 flex-shrink-0 rounded-full border border-transparent transition-colors duration-200 ease-in-out focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
            >
              <span
                :class="selectedPromo?.skipPayment ? 'translate-x-5 sm:translate-x-5' : 'translate-x-0.5'"
                class="inline-block h-5 sm:h-6 w-5 sm:w-6 transform rounded-full bg-white shadow-sm transition-transform duration-200 ease-in-out"
              ></span>
            </button>
          </div>
        </div>
      </div>

      <div class="flex flex-col-reverse sm:flex-row items-center gap-3 mt-6 sm:mt-8 lg:justify-end pb-4 sm:pb-0">
        <button
          @click="promoCodeEditModal = false"
          type="button"
          class="flex w-full sm:w-auto justify-center rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-xs sm:text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 dark:hover:bg-white/[0.03]"
        >
          Close
        </button>
        <button
          type="button"
          class="flex w-full sm:w-auto justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-xs sm:text-sm font-medium text-white hover:bg-brand-600"
        >
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
