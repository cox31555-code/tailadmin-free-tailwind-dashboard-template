<div
  x-data="chartFilters()"
  x-init="init()"
  class="relative overflow-hidden rounded-2xl bg-gradient-to-br from-white to-gray-50 shadow-lg dark:from-gray-900 dark:to-gray-800"
>
  <!-- Decorative Elements -->
  <div class="absolute top-0 right-0 w-64 h-64 bg-gradient-to-br from-brand-400/10 to-transparent rounded-full -mr-32 -mt-32 blur-2xl"></div>
  <div class="absolute bottom-0 left-0 w-64 h-64 bg-gradient-to-tr from-purple-400/5 to-transparent rounded-full -ml-32 -mb-32 blur-2xl"></div>
  
  <div class="relative p-6 md:p-8">
    <!-- Header -->
    <div class="flex flex-col gap-6 mb-8 lg:flex-row lg:items-start lg:justify-between">
      <div class="flex items-center gap-4">
        <div class="flex items-center justify-center w-12 h-12 rounded-xl bg-gradient-to-br from-purple-500 to-brand-500 shadow-lg shadow-purple-500/25">
          <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
          </svg>
        </div>
        <div>
          <h3 class="text-xl font-bold text-gray-900 dark:text-white">
            Performance Statistics
          </h3>
          <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
            Target you've set for each month
          </p>
        </div>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Filter Tabs -->
        <div class="inline-flex items-center gap-1 p-1 rounded-xl bg-white border border-gray-200 shadow-sm dark:bg-gray-800 dark:border-gray-700">
          <button
            @click="selected = 'overview'; updateChart()"
            :class="selected === 'overview' ? 'bg-gradient-to-r from-brand-500 to-blue-500 text-white shadow-md' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white'"
            class="px-4 py-2 text-sm font-semibold rounded-lg transition-all"
          >
            Overview
          </button>
          <button
            @click="selected = 'sales'; updateChart()"
            :class="selected === 'sales' ? 'bg-gradient-to-r from-brand-500 to-blue-500 text-white shadow-md' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white'"
            class="px-4 py-2 text-sm font-semibold rounded-lg transition-all"
          >
            Sales
          </button>
          <button
            @click="selected = 'quotes'; updateChart()"
            :class="selected === 'quotes' ? 'bg-gradient-to-r from-brand-500 to-blue-500 text-white shadow-md' : 'text-gray-600 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white'"
            class="px-4 py-2 text-sm font-semibold rounded-lg transition-all"
          >
            Quotes
          </button>
        </div>

        <!-- Date Picker -->
        <div class="relative">
          <input
            @change="updateChart()"
            x-ref="dateInput"
            class="chart-datepicker h-10 w-full max-w-11 rounded-xl border border-gray-200 bg-white pl-11 pr-4 py-2.5 text-sm font-medium text-gray-700 shadow-sm transition-all hover:border-brand-300 focus:border-brand-500 focus:outline-hidden focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-300 dark:hover:border-brand-600 xl:max-w-fit"
            placeholder="Select dates"
            data-class="flatpickr-right"
            readonly="readonly"
          />
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="w-5 h-5 text-gray-500 dark:text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>

    <!-- Current Selection Info -->
    <div class="flex items-center gap-2 mb-6 px-4 py-3 rounded-xl bg-gradient-to-r from-brand-50 to-blue-50 border border-brand-100 dark:from-brand-900/20 dark:to-blue-900/20 dark:border-brand-800/50">
      <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-white dark:bg-gray-800 shadow-sm">
        <svg class="w-4 h-4 text-brand-500" fill="currentColor" viewBox="0 0 20 20">
          <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7-4a1 1 0 11-2 0 1 1 0 012 0zM9 9a1 1 0 000 2v3a1 1 0 001 1h1a1 1 0 100-2v-3a1 1 0 00-1-1H9z" clip-rule="evenodd"></path>
        </svg>
      </div>
      <p class="text-sm font-medium text-gray-700 dark:text-gray-300">
        Currently viewing: <span class="font-bold text-brand-600 dark:text-brand-400" x-text="selected.charAt(0).toUpperCase() + selected.slice(1)"></span>
      </p>
    </div>

    <!-- Chart Container -->
    <div class="relative">
      <div class="max-w-full overflow-x-auto custom-scrollbar">
        <div class="min-w-[700px]">
          <div id="chartThree" class="h-[400px]"></div>
        </div>
      </div>
    </div>
  </div>
</div>
