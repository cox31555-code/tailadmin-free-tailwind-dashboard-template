<div
  x-data="chartFilters()"
  x-init="init()"
  class="rounded-xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-[#010a1b]"
>
  <div class="px-5 py-4 sm:px-6 sm:py-5">
    <!-- Header -->
    <div class="flex flex-col gap-4 lg:flex-row lg:items-start lg:justify-between">
      <div>
        <h3 class="text-lg font-semibold text-gray-800 dark:text-white">
          Performance Statistics
        </h3>
        <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">
          Target you've set for each month
        </p>
      </div>

      <!-- Controls -->
      <div class="flex flex-wrap items-center gap-3">
        <!-- Filter Tabs -->
        <div class="inline-flex items-center gap-0.5 rounded-lg bg-gray-100 p-0.5 dark:bg-gray-900">
          <button
            @click="selected = 'overview'; updateChart()"
            :class="selected === 'overview' ? 'shadow-sm text-gray-900 dark:text-white bg-white dark:bg-gray-800' : 'text-gray-500 dark:text-gray-400'"
            class="px-3 py-2 text-sm font-medium rounded-md hover:text-gray-900 dark:hover:text-white"
          >
            Overview
          </button>
          <button
            @click="selected = 'sales'; updateChart()"
            :class="selected === 'sales' ? 'shadow-sm text-gray-900 dark:text-white bg-white dark:bg-gray-800' : 'text-gray-500 dark:text-gray-400'"
            class="px-3 py-2 text-sm font-medium rounded-md hover:text-gray-900 dark:hover:text-white"
          >
            Sales
          </button>
          <button
            @click="selected = 'quotes'; updateChart()"
            :class="selected === 'quotes' ? 'shadow-sm text-gray-900 dark:text-white bg-white dark:bg-gray-800' : 'text-gray-500 dark:text-gray-400'"
            class="px-3 py-2 text-sm font-medium rounded-md hover:text-gray-900 dark:hover:text-white"
          >
            Quotes
          </button>
        </div>

        <!-- Date Picker -->
        <div class="relative">
          <input
            @change="updateChart()"
            x-ref="dateInput"
            class="chart-datepicker h-10 w-full max-w-11 rounded-lg border border-gray-200 bg-white py-2.5 pl-11 pr-4 text-sm font-medium text-gray-700 shadow-sm focus:border-brand-500 focus:outline-hidden focus:ring-2 focus:ring-brand-500/20 dark:border-gray-700 dark:bg-gray-800 dark:text-gray-400 xl:max-w-fit"
            placeholder="Select dates"
            data-class="flatpickr-right"
            readonly="readonly"
          />
          <div class="absolute inset-y-0 left-0 flex items-center pl-3 pointer-events-none">
            <svg class="w-5 h-5 text-gray-400 dark:text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Chart Container -->
  <div class="border-t border-gray-100 dark:border-gray-800">
    <div class="max-w-full overflow-x-auto custom-scrollbar px-5 pt-5 sm:px-6 sm:pt-6">
      <div class="min-w-[700px]">
        <div id="chartThree" class="h-[400px]"></div>
      </div>
    </div>
  </div>
</div>
