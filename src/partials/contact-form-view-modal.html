<div
  x-show="contactFormViewModal"
  class="fixed inset-0 flex items-center justify-center p-5 overflow-y-auto z-99999"
>
  <div
    class="modal-close-btn fixed inset-0 h-full w-full bg-gray-400/50 backdrop-blur-[32px]"
    @click="contactFormViewModal = false"
  ></div>
  <div
    @click.outside="contactFormViewModal = false"
    class="no-scrollbar relative w-full max-w-[700px] overflow-y-auto rounded-3xl bg-white p-4 dark:bg-gray-900 lg:p-11"
  >
    <!-- close btn -->
    <button
      @click="contactFormViewModal = false"
      class="transition-color absolute right-5 top-5 z-999 flex h-11 w-11 items-center justify-center rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 dark:bg-gray-700 dark:bg-white/[0.05] dark:text-gray-400 dark:hover:bg-white/[0.07] dark:hover:text-gray-300"
    >
      <svg
        class="fill-current"
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M6.04289 16.5418C5.65237 16.9323 5.65237 17.5655 6.04289 17.956C6.43342 18.3465 7.06658 18.3465 7.45711 17.956L11.9987 13.4144L16.5408 17.9565C16.9313 18.347 17.5645 18.347 17.955 17.9565C18.3455 17.566 18.3455 16.9328 17.955 16.5423L13.4129 12.0002L17.955 7.45808C18.3455 7.06756 18.3455 6.43439 17.955 6.04387C17.5645 5.65335 16.9313 5.65335 16.5408 6.04387L11.9987 10.586L7.45711 6.04439C7.06658 5.65386 6.43342 5.65386 6.04289 6.04439C5.65237 6.43491 5.65237 7.06808 6.04289 7.4586L10.5845 12.0002L6.04289 16.5418Z"
          fill=""
        />
      </svg>
    </button>

    <div class="px-2 pr-14">
      <div class="mb-4 flex items-center gap-3">
        <svg
          class="h-5 w-5 flex-shrink-0 text-gray-400 dark:text-gray-500"
          fill="currentColor"
          viewBox="0 0 20 20"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
          <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
        </svg>
        <h4 class="text-lg font-semibold text-gray-800 dark:text-white/90">
          Message from
        </h4>
      </div>
      <p class="mb-6 text-sm font-medium text-gray-600 dark:text-gray-400">
        • <span x-text="selectedMessage?.email"></span>
      </p>
    </div>

    <div class="px-2 pr-14">
      <p class="mb-3 text-sm font-medium text-gray-700 dark:text-gray-300">
        Message:
      </p>
      <div class="rounded-lg bg-gray-100 p-6 dark:bg-gray-950 min-h-[150px]">
        <p class="text-base leading-relaxed text-gray-800 dark:text-gray-200 whitespace-pre-wrap" x-text="selectedMessage?.message">
        </p>
      </div>
    </div>

    <div class="px-2 pr-14 mt-6 mb-6">
      <p class="text-sm text-gray-500 dark:text-gray-400" x-text="selectedMessage?.received">
      </p>
    </div>

    <div class="flex items-center px-2 gap-3 lg:justify-end">
      <button
        @click="contactFormViewModal = false"
        type="button"
        class="flex w-full justify-center rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white hover:bg-brand-600 lg:w-auto"
      >
        Close
      </button>
    </div>
  </div>
</div>
