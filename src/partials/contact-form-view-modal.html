<div
  x-show="contactFormViewModal"
  x-transition:enter="transition ease-out duration-200"
  x-transition:enter-start="opacity-0"
  x-transition:enter-end="opacity-100"
  x-transition:leave="transition ease-in duration-150"
  x-transition:leave-start="opacity-100"
  x-transition:leave-end="opacity-0"
  class="fixed inset-0 z-99999 flex items-center justify-center overflow-y-auto p-4"
  style="background-color: rgb(15 23 42 / 75%); backdrop-filter: blur(4px)"
>
  <div
    @click.outside="contactFormViewModal = false"
    x-transition:enter="transition ease-out duration-200"
    x-transition:enter-start="opacity-0 scale-95"
    x-transition:enter-end="opacity-100 scale-100"
    x-transition:leave="transition ease-in duration-150"
    x-transition:leave-start="opacity-100 scale-100"
    x-transition:leave-end="opacity-0 scale-95"
    class="relative w-full max-w-3xl overflow-hidden rounded-2xl border border-gray-200 bg-white shadow-2xl dark:border-gray-800 dark:bg-[#010a1b]"
  >
    <!-- Modal Header -->
    <div class="flex items-center justify-between border-b border-gray-200 bg-gray-50 px-6 py-4 dark:border-gray-800 dark:bg-[#0c192c]">
      <div class="flex items-center gap-3">
        <div class="flex h-10 w-10 items-center justify-center rounded-full bg-brand-500/10">
          <svg
            class="h-5 w-5 text-brand-600 dark:text-brand-400"
            fill="none"
            viewBox="0 0 24 24"
            stroke="currentColor"
            stroke-width="2"
          >
            <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
          </svg>
        </div>
        <div>
          <h3 class="text-lg font-semibold text-gray-800 dark:text-white/90">
            Contact Form Message
          </h3>
          <p class="text-xs text-gray-500 dark:text-gray-400">
            View and manage submission
          </p>
        </div>
      </div>
      <button
        @click="contactFormViewModal = false"
        class="flex h-9 w-9 items-center justify-center rounded-lg text-gray-400 transition-colors hover:bg-gray-200 hover:text-gray-600 dark:hover:bg-white/[0.07] dark:hover:text-gray-300"
      >
        <svg
          class="h-5 w-5"
          fill="none"
          viewBox="0 0 24 24"
          stroke="currentColor"
          stroke-width="2"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Modal Body -->
    <div class="overflow-y-auto max-h-[calc(100vh-250px)]">
      <div class="space-y-6 px-6 py-6">
        <!-- Sender Information Card -->
        <div class="rounded-xl border border-gray-200 bg-gray-50 p-5 dark:border-gray-800 dark:bg-[#0c192c]">
          <div class="flex items-start gap-4">
            <div class="flex h-12 w-12 flex-shrink-0 items-center justify-center rounded-full bg-brand-500 text-white">
              <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
              </svg>
            </div>
            <div class="flex-1 min-w-0 space-y-3">
              <div class="flex items-center gap-2">
                <p class="text-sm font-semibold text-gray-800 dark:text-white/90">
                  Contact Information
                </p>
                <span class="inline-flex items-center rounded-full bg-green-50 px-2 py-0.5 text-xs font-medium text-green-600 dark:bg-green-500/15 dark:text-green-400">
                  New
                </span>
              </div>
              
              <!-- Full Name -->
              <div>
                <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Full Name</p>
                <p class="text-base font-semibold text-gray-800 dark:text-white/90">
                  <span x-text="selectedMessage?.firstName"></span>
                  <span x-text="selectedMessage?.surname"></span>
                </p>
              </div>

              <!-- Email -->
              <div>
                <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Email Address</p>
                <p class="text-sm text-gray-600 dark:text-gray-400 break-all" x-text="selectedMessage?.email"></p>
              </div>

              <!-- Phone and Policy Reference -->
              <div class="grid grid-cols-2 gap-4">
                <div>
                  <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Phone Number</p>
                  <p class="text-sm text-gray-600 dark:text-gray-400" x-text="selectedMessage?.phone || 'Not provided'"></p>
                </div>
                <div>
                  <p class="text-xs font-medium text-gray-500 dark:text-gray-400 mb-1">Policy Reference</p>
                  <p class="text-sm font-mono text-gray-800 dark:text-white/90" x-text="selectedMessage?.policyRef || 'N/A'"></p>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Message Content Card -->
        <div class="space-y-3">
          <div class="flex items-center gap-2">
            <svg class="h-5 w-5 text-gray-400 dark:text-gray-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z" />
            </svg>
            <h4 class="text-sm font-semibold text-gray-700 dark:text-gray-300">
              Message Content
            </h4>
          </div>
          <div class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-[#030e21]">
            <p class="text-base leading-relaxed text-gray-800 dark:text-gray-200 whitespace-pre-wrap break-words" x-text="selectedMessage?.message"></p>
          </div>
        </div>

        <!-- Metadata Card -->
        <div class="flex items-center gap-4 rounded-xl border border-gray-200 bg-gray-50 px-4 py-3 dark:border-gray-800 dark:bg-[#0c192c]">
          <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span x-text="selectedMessage?.received"></span>
          </div>
          <div class="h-4 w-px bg-gray-300 dark:bg-gray-700"></div>
          <div class="flex items-center gap-2 text-xs text-gray-500 dark:text-gray-400">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z" />
            </svg>
            <span>Contact Form Submission</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Footer -->
    <div class="border-t border-gray-200 bg-gray-50 px-6 py-4 dark:border-gray-800 dark:bg-[#0c192c]">
      <div class="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <!-- Action Buttons Left -->
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-lg bg-brand-500 px-4 py-2.5 text-sm font-medium text-white transition-colors hover:bg-brand-600 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:ring-offset-2 dark:focus:ring-offset-gray-900"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6" />
            </svg>
            Reply
          </button>
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 dark:border-gray-700 dark:bg-[#010a1b] dark:text-gray-300 dark:hover:bg-white/[0.03] dark:focus:ring-offset-gray-900"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
            </svg>
            Mark as Read
          </button>
        </div>

        <!-- Action Buttons Right -->
        <div class="flex flex-wrap gap-2">
          <button
            type="button"
            class="inline-flex items-center gap-2 rounded-lg border border-red-300 bg-white px-4 py-2.5 text-sm font-medium text-red-600 transition-colors hover:bg-red-50 focus:outline-none focus:ring-2 focus:ring-red-500 focus:ring-offset-2 dark:border-red-500/20 dark:bg-[#010a1b] dark:text-red-400 dark:hover:bg-red-500/10 dark:focus:ring-offset-gray-900"
          >
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
            </svg>
            Delete
          </button>
          <button
            @click="contactFormViewModal = false"
            type="button"
            class="inline-flex items-center gap-2 rounded-lg border border-gray-300 bg-white px-4 py-2.5 text-sm font-medium text-gray-700 transition-colors hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-gray-500 focus:ring-offset-2 dark:border-gray-700 dark:bg-[#010a1b] dark:text-gray-300 dark:hover:bg-white/[0.03] dark:focus:ring-offset-gray-900"
          >
            Close
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
