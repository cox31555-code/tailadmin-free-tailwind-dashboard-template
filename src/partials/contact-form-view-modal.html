<div
  x-show="contactFormViewModal"
  class="fixed inset-0 z-99999 flex items-center justify-center overflow-y-auto p-4" style="background-color: rgba(20, 30, 50, 0.83); backdrop-filter: blur(2px)"
>
  <div
    @click.outside="contactFormViewModal = false"
    class="no-scrollbar relative w-full max-w-2xl overflow-hidden rounded-2xl bg-white dark:bg-gray-900 lg:max-w-4xl"
  >
    <!-- close btn -->
    <button
      @click="contactFormViewModal = false"
      class="transition-color absolute right-3 top-3 z-10 flex h-10 w-10 items-center justify-center rounded-full bg-gray-100 text-gray-400 hover:bg-gray-200 hover:text-gray-600 dark:bg-gray-700 dark:bg-white/[0.05] dark:text-gray-400 dark:hover:bg-white/[0.07] dark:hover:text-gray-300 sm:right-4 sm:top-4 sm:h-11 sm:w-11"
    >
      <svg
        class="fill-current"
        width="20"
        height="20"
        viewBox="0 0 24 24"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          fill-rule="evenodd"
          clip-rule="evenodd"
          d="M6.04289 16.5418C5.65237 16.9323 5.65237 17.5655 6.04289 17.956C6.43342 18.3465 7.06658 18.3465 7.45711 17.956L11.9987 13.4144L16.5408 17.9565C16.9313 18.347 17.5645 18.347 17.955 17.9565C18.3455 17.566 18.3455 16.9328 17.955 16.5423L13.4129 12.0002L17.955 7.45808C18.3455 7.06756 18.3455 6.43439 17.955 6.04387C17.5645 5.65335 16.9313 5.65335 16.5408 6.04387L11.9987 10.586L7.45711 6.04439C7.06658 5.65386 6.43342 5.65386 6.04289 6.04439C5.65237 6.43491 5.65237 7.06808 6.04289 7.4586L10.5845 12.0002L6.04289 16.5418Z"
          fill=""
        />
      </svg>
    </button>

    <!-- Modal content -->
    <div class="overflow-y-auto">
      <div class="space-y-4 p-4 sm:p-6">
        <!-- Header section -->
        <div class="pr-9 sm:pr-12">
          <div class="mb-3 flex items-center gap-2 sm:gap-3">
            <svg
              class="h-5 w-5 flex-shrink-0 text-gray-400 dark:text-gray-500"
              fill="currentColor"
              viewBox="0 0 20 20"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path d="M2.003 5.884L10 9.882l7.997-3.998A2 2 0 0016 4H4a2 2 0 00-1.997 1.884z"></path>
              <path d="M18 8.118l-8 4-8-4V14a2 2 0 002 2h12a2 2 0 002-2V8.118z"></path>
            </svg>
            <h4 class="text-base font-semibold text-gray-800 dark:text-white/90 sm:text-lg">
              Message from
            </h4>
          </div>
          <p class="text-xs font-medium text-gray-600 dark:text-gray-400 sm:text-sm">
            • <span class="break-all" x-text="selectedMessage?.email"></span>
          </p>
        </div>

        <!-- Message section -->
        <div class="space-y-2">
          <p class="text-xs font-medium text-gray-700 dark:text-gray-300 sm:text-sm">
            Message:
          </p>
          <div class="rounded-lg bg-gray-100 p-3 dark:bg-gray-950 sm:p-4">
            <p class="break-words text-sm leading-relaxed text-gray-800 dark:text-gray-200 sm:text-base whitespace-pre-wrap" x-text="selectedMessage?.message">
            </p>
          </div>
        </div>

        <!-- Date section -->
        <p class="text-xs text-gray-500 dark:text-gray-400 sm:text-sm" x-text="selectedMessage?.received">
        </p>
      </div>

      <!-- Action button -->
      <div class="border-t border-gray-100 bg-gray-50 p-3 dark:border-gray-800 dark:bg-white/[0.02] sm:p-4">
        <button
          @click="contactFormViewModal = false"
          type="button"
          class="w-full rounded-lg bg-brand-500 px-3 py-2.5 text-sm font-medium text-white hover:bg-brand-600 active:bg-brand-700 transition-colors sm:py-3"
        >
          Close
        </button>
      </div>
    </div>
  </div>
</div>
