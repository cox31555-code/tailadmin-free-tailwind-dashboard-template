<div x-data="ordersCounter()" x-init="init()">
  <div class="grid grid-cols-3 gap-3">
    <!-- Today -->
    <div class="rounded-lg border border-gray-200 bg-gray-50 p-3 dark:border-gray-800 dark:bg-gray-800/50">

        <span
          class="inline-flex items-center gap-1 rounded-full px-1.5 py-0.5 text-xs font-medium"
          :class="trendBadgeClasses(trendToday)"
        >
          <svg
            class="fill-current transition-transform"
            :class="trendIconClasses(trendToday)"
            width="10"
            height="10"
            viewBox="0 0 12 12"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >

          </svg>
          <span x-text="formatTrend(trendToday)">0%</span>
        </span>
      </div>
      <p class="text-xl font-bold text-gray-900 dark:text-white" x-text="formatNumber(todayCount)">0</p>
    </div>
    
    <!-- Last 7 Days -->
