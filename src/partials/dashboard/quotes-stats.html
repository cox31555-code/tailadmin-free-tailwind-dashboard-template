<div x-data="quotesCounter()" x-init="init()">
  <div class="grid grid-cols-3 gap-3">
    <!-- Today -->
    <div class="rounded-lg border border-gray-200 bg-gray-50 p-3 dark:border-gray-800 dark:bg-gray-800/50">
      <p class="mb-1 text-xs font-medium text-gray-500 dark:text-gray-400">Today</p>
      <p class="text-xl font-bold text-gray-900 dark:text-white" x-text="formatNumber(todayCount)">0</p>
    </div>
    
    <!-- Last 7 Days -->
    <div class="rounded-lg border border-gray-200 bg-gray-50 p-3 dark:border-gray-800 dark:bg-gray-800/50">
      <p class="mb-1 text-xs font-medium text-gray-500 dark:text-gray-400">7 Days</p>
      <p class="text-xl font-bold text-gray-900 dark:text-white" x-text="formatNumber(last7DaysCount)">0</p>
    </div>
    
    <!-- Past 30 Days -->
    <div class="rounded-lg border border-gray-200 bg-gray-50 p-3 dark:border-gray-800 dark:bg-gray-800/50">
      <p class="mb-1 text-xs font-medium text-gray-500 dark:text-gray-400">30 Days</p>
      <p class="text-xl font-bold text-brand-500 dark:text-brand-400" x-text="formatNumber(past30DaysCount)">0</p>
    </div>
  </div>
</div>
