<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Live Chat Admin | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
  </head>
  <body
    x-data="adminChatApp()"
    x-init="
      darkMode = JSON.parse(localStorage.getItem('darkMode'));
      $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)));
      initializeConversations();
      startRealTimePolling();
    "
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden">
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Live Chat Admin`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div class="grid grid-cols-1 gap-6 lg:grid-cols-4">
              <!-- Inbox List -->
              <div class="lg:col-span-1 rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] flex flex-col h-[600px]">
                <div class="border-b border-gray-200 px-5 py-4 dark:border-gray-800">
                  <h3 class="text-theme-sm font-semibold text-gray-800 dark:text-white/90">
                    Inbox
                  </h3>
                  <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">
                    <span x-text="conversations.length"></span> conversations
                  </p>
                </div>

                <!-- Conversations List -->
                <div class="flex-1 overflow-y-auto">
                  <template x-if="conversations.length === 0">
                    <div class="px-5 py-8 text-center">
                      <svg class="mx-auto h-12 w-12 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                      </svg>
                      <p class="mt-3 text-sm text-gray-500 dark:text-gray-400">No conversations yet</p>
                    </div>
                  </template>

                  <template x-for="conversation in conversations" :key="conversation.id">
                    <button
                      @click="selectConversation(conversation)"
                      :class="selectedConversation?.id === conversation.id ? 'bg-blue-50 dark:bg-blue-500/10 border-l-4 border-l-blue-500' : 'hover:bg-gray-50 dark:hover:bg-gray-800/30'"
                      class="w-full border-b border-gray-200 px-4 py-3 text-left dark:border-gray-800 transition-colors"
                    >
                      <p class="font-medium text-gray-800 dark:text-gray-200 text-sm" x-text="conversation.visitor.name"></p>
                      <p class="text-xs text-gray-500 dark:text-gray-400 mt-1" x-text="conversation.visitor.email"></p>
                      <p class="text-xs text-gray-400 dark:text-gray-500 mt-1" x-text="conversation.state"></p>
                    </button>
                  </template>
                </div>

                <!-- Refresh Button -->
                <div class="border-t border-gray-200 p-3 dark:border-gray-800">
                  <button
                    @click="initializeConversations()"
                    class="w-full rounded-lg bg-gray-100 px-4 py-2 text-xs font-medium text-gray-700 hover:bg-gray-200 dark:bg-gray-800 dark:text-gray-300 dark:hover:bg-gray-700"
                  >
                    Refresh
                  </button>
                </div>
              </div>

              <!-- Chat Area -->
              <div class="lg:col-span-3 rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03] flex flex-col h-[600px]">
                <template x-if="!selectedConversation">
                  <div class="flex flex-1 items-center justify-center">
                    <div class="text-center">
                      <svg class="mx-auto h-16 w-16 text-gray-300 dark:text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z" />
                      </svg>
                      <p class="mt-4 text-gray-500 dark:text-gray-400">Select a conversation to start chatting</p>
                    </div>
                  </div>
                </template>

                <template x-if="selectedConversation">
                  <!-- Chat Header -->
                  <div class="border-b border-gray-200 px-6 py-4 dark:border-gray-800">
                    <div class="flex items-center justify-between">
                      <div>
                        <h3 class="font-semibold text-gray-800 dark:text-white/90" x-text="selectedConversation.visitor.name"></h3>
                        <p class="mt-1 text-xs text-gray-500 dark:text-gray-400" x-text="selectedConversation.visitor.email"></p>
                      </div>
                      <div class="flex gap-2">
                        <button
                          @click="createTicket()"
                          class="rounded-lg border border-amber-500 bg-amber-50 px-4 py-2 text-sm font-medium text-amber-600 hover:bg-amber-100 dark:border-amber-400 dark:bg-amber-500/10 dark:text-amber-400 dark:hover:bg-amber-500/20"
                        >
                          Create Ticket
                        </button>
                        <button
                          @click="selectedConversation = null"
                          class="rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm font-medium text-gray-700 hover:bg-gray-50 dark:border-gray-600 dark:bg-gray-700 dark:text-gray-300 dark:hover:bg-gray-600"
                        >
                          Close
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- Messages Area -->
                  <div class="flex-1 overflow-y-auto bg-gray-50 dark:bg-gray-800/30 p-6 space-y-4" id="messagesContainer">
                    <template x-for="message in selectedConversation.messages || []" :key="message.id">
                      <div :class="message.from === 'visitor' ? 'justify-start' : 'justify-end'" class="flex">
                        <div :class="message.from === 'visitor' ? 'bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200' : 'bg-blue-500 text-white'" class="max-w-xs rounded-lg px-4 py-2">
                          <p class="text-sm" x-text="message.content"></p>
                          <p :class="message.from === 'visitor' ? 'text-gray-600 dark:text-gray-400' : 'text-blue-100'" class="mt-1 text-xs">
                            <span x-text="new Date(message.timestamp).toLocaleTimeString()"></span>
                          </p>
                        </div>
                      </div>
                    </template>
                  </div>

                  <!-- Message Input -->
                  <div class="border-t border-gray-200 px-6 py-4 dark:border-gray-800">
                    <form @submit.prevent="sendMessage()" class="flex gap-3">
                      <input
                        x-model="replyMessage"
                        type="text"
                        placeholder="Type your reply..."
                        class="flex-1 rounded-lg border border-gray-300 bg-white px-4 py-2 text-sm text-gray-800 placeholder-gray-500 dark:border-gray-600 dark:bg-gray-800 dark:text-white dark:placeholder-gray-400"
                      />
                      <button
                        type="submit"
                        :disabled="!replyMessage.trim()"
                        class="rounded-lg bg-blue-500 px-6 py-2 text-sm font-medium text-white hover:bg-blue-600 dark:hover:bg-blue-600 disabled:bg-gray-400"
                      >
                        Send
                      </button>
                    </form>
                  </div>
                </template>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <script type="text/javascript">
      function adminChatApp() {
        return {
          page: 'liveChat',
          loaded: true,
          darkMode: false,
          stickyMenu: false,
          sidebarToggle: false,
          scrollTop: false,
          conversations: [],
          selectedConversation: null,
          replyMessage: '',
          pollInterval: null,

          async initializeConversations() {
            try {
              const response = await fetch('/api/crisp/conversations');
              const data = await response.json();
              if (data.success && data.conversations) {
                this.conversations = data.conversations.map(conv => ({
                  ...conv,
                  id: conv.id || conv.session_id
                }));
              }
            } catch (error) {
              console.error('Error fetching conversations:', error);
              // Fallback to empty state if API fails
              this.conversations = [];
            }
          },

          selectConversation(conversation) {
            this.selectedConversation = JSON.parse(JSON.stringify(conversation));
            this.replyMessage = '';
            this.$nextTick(() => {
              const container = document.getElementById('messagesContainer');
              if (container) container.scrollTop = container.scrollHeight;
            });
          },

          async sendMessage() {
            if (!this.replyMessage.trim() || !this.selectedConversation) return;

            const message = this.replyMessage;
            const sessionId = this.selectedConversation.session_id || this.selectedConversation.id;

            try {
              const response = await fetch('/api/crisp/send-message', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  session_id: sessionId,
                  content: message
                })
              });

              const data = await response.json();
              if (data.success) {
                this.replyMessage = '';
                await this.initializeConversations();
                const updated = this.conversations.find(c => (c.id || c.session_id) === (this.selectedConversation.session_id || this.selectedConversation.id));
                if (updated) this.selectedConversation = JSON.parse(JSON.stringify(updated));

                this.$nextTick(() => {
                  const container = document.getElementById('messagesContainer');
                  if (container) container.scrollTop = container.scrollHeight;
                });
              } else {
                alert('Failed to send message');
              }
            } catch (error) {
              console.error('Error sending message:', error);
              alert('Error sending message');
            }
          },

          createTicket() {
            if (!this.selectedConversation) return;
            
            this.selectedConversation.state = 'ticket_created';
            
            const conversationIndex = this.conversations.findIndex(c => c.id === this.selectedConversation.id);
            if (conversationIndex >= 0) {
              this.conversations[conversationIndex].state = 'ticket_created';
            }
            
            alert(`Ticket created for ${this.selectedConversation.visitor.name}`);
          },

          startRealTimePolling() {
            this.pollInterval = setInterval(() => {
              if (this.selectedConversation) {
                const updated = this.conversations.find(c => c.id === this.selectedConversation.id);
                if (updated) {
                  this.selectedConversation = JSON.parse(JSON.stringify(updated));
                  this.$nextTick(() => {
                    const container = document.getElementById('messagesContainer');
                    if (container) container.scrollTop = container.scrollHeight;
                  });
                }
              }
            }, 3000);
          }
        };
      }
    </script>
  </body>
</html>
