<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Live Chat | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
  </head>
  <body
    x-data="{ page: 'liveChat', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)))"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Live Chat`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div
              class="overflow-hidden rounded-2xl border border-gray-200 bg-white dark:border-gray-800 dark:bg-white/[0.03]"
              style="height: calc(100vh - 240px)"
            >
              <iframe
                id="crisp-iframe"
                title="Crisp Live Chat Management"
                class="w-full h-full border-0"
                allow="clipboard-read; clipboard-write; microphone; camera"
              ></iframe>

              <script>
                (function() {
                  const crispUrl = 'https://app.crisp.chat/website/80335e6a-e33e-478a-8ce3-1b88c05b4ad4/inbox/';
                  const corsioProxy = 'https://cors.io/?url=';
                  const iframe = document.getElementById('crisp-iframe');

                  function loadContent(url) {
                    console.log('Loading Crisp content from:', url);
                    fetch(corsioProxy + encodeURIComponent(url))
                      .then(res => {
                        if (!res.ok) throw new Error('CORS.io returned status ' + res.status);
                        return res.text();
                      })
                      .then(html => {
                        var baseUrl = url;
                        var injectedHtml = html.replace(/<head([^>]*)>/i, function(match, attrs) {
                          return match + '\n  <base href="' + baseUrl + '">\n  <meta charset="UTF-8">';
                        });
                        iframe.srcdoc = injectedHtml;
                      })
                      .catch(err => {
                        console.error('Failed to load Crisp:', err);
                        iframe.srcdoc = '<html><body style="font-family:Arial;padding:20px"><h1>Error Loading Content</h1><p>' + err.message + '</p></body></html>';
                      });
                  }

                  // Initial load
                  loadContent(crispUrl);

                  // Expose load function on iframe for navigation
                  iframe.loadUrl = function(url) {
                    loadContent(url);
                  };
                })();
              </script>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->
  </body>
</html>
