<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>
      Live Chat | TailAdmin - Tailwind CSS Admin Dashboard Template
    </title>
  </head>
  <body
    x-data="{ page: 'liveChat', 'loaded': true, 'darkMode': false, 'stickyMenu': false, 'sidebarToggle': false, 'scrollTop': false }"
    x-init="
         darkMode = JSON.parse(localStorage.getItem('darkMode'));
         $watch('darkMode', value => localStorage.setItem('darkMode', JSON.stringify(value)));
         initializeCrispAndZapier();"
    :class="{'dark bg-gray-900': darkMode === true}"
  >
    <!-- ===== Preloader Start ===== -->
    <include src="./partials/preloader.html"></include>
    <!-- ===== Preloader End ===== -->

    <!-- ===== Page Wrapper Start ===== -->
    <div class="flex h-screen overflow-hidden">
      <!-- ===== Sidebar Start ===== -->
      <include src="./partials/sidebar.html"></include>
      <!-- ===== Sidebar End ===== -->

      <!-- ===== Content Area Start ===== -->
      <div
        class="relative flex flex-1 flex-col overflow-y-auto overflow-x-hidden"
      >
        <!-- Small Device Overlay Start -->
        <include src="./partials/overlay.html" />
        <!-- Small Device Overlay End -->

        <!-- ===== Header Start ===== -->
        <include src="./partials/header.html" />
        <!-- ===== Header End ===== -->

        <!-- ===== Main Content Start ===== -->
        <main>
          <div class="mx-auto max-w-(--breakpoint-2xl) p-4 md:p-6">
            <!-- Breadcrumb Start -->
            <div x-data="{ pageName: `Live Chat`}">
              <include src="./partials/breadcrumb.html" />
            </div>
            <!-- Breadcrumb End -->

            <div
              class="min-h-screen rounded-2xl border border-gray-200 bg-white px-5 py-7 dark:border-gray-800 dark:bg-white/[0.03] xl:px-10 xl:py-12"
            >
              <div class="mx-auto w-full max-w-[630px] text-center">
                <h3
                  class="mb-4 text-theme-xl font-semibold text-gray-800 dark:text-white/90 sm:text-2xl"
                >
                  Live Chat
                </h3>

                <p
                  class="text-sm text-gray-500 dark:text-gray-400 sm:text-base"
                >
                  Live chat content will be displayed here.
                </p>
              </div>
            </div>
          </div>
        </main>
        <!-- ===== Main Content End ===== -->
      </div>
      <!-- ===== Content Area End ===== -->
    </div>
    <!-- ===== Page Wrapper End ===== -->

    <!-- Crisp Chat Integration -->
    <script type="text/javascript">
      window.$crisp = [];
      window.CRISP_TOKEN_ID = "limitlesscover.co.uk";
      (function() {
        d = document;
        s = d.createElement("script");
        s.src = "https://client.crisp.chat/l.js";
        s.async = 1;
        d.getElementsByTagName("head")[0].appendChild(s);
      })();
    </script>

    <!-- Zapier Integration & Chat Event Listeners -->
    <script type="text/javascript">
      function initializeCrispAndZapier() {
        // Zapier webhook URLs (replace with your actual webhook URLs)
        const zapierWebhooks = {
          messageReceived: "https://hooks.zapier.com/hooks/catch/YOUR_WEBHOOK_ID/message-received/",
          userJoined: "https://hooks.zapier.com/hooks/catch/YOUR_WEBHOOK_ID/user-joined/",
          conversationStarted: "https://hooks.zapier.com/hooks/catch/YOUR_WEBHOOK_ID/conversation-started/",
          conversationEnded: "https://hooks.zapier.com/hooks/catch/YOUR_WEBHOOK_ID/conversation-ended/"
        };

        // Helper function to send data to Zapier
        function sendToZapier(webhookUrl, data) {
          if (!webhookUrl.includes("YOUR_WEBHOOK_ID")) {
            fetch(webhookUrl, {
              method: "POST",
              headers: {
                "Content-Type": "application/json"
              },
              body: JSON.stringify({
                ...data,
                timestamp: new Date().toISOString(),
                domain: "limitlesscover.co.uk",
                page: "live-chat"
              })
            }).catch(error => console.log("Zapier notification sent"));
          }
        }

        // Wait for Crisp to load
        if (typeof $crisp !== "undefined") {
          // Listen for incoming messages from visitors
          $crisp.push(["on", "message:received", function(message) {
            const messageData = {
              messageId: message?.id || "unknown",
              senderEmail: message?.from || "visitor",
              senderName: message?.author || "Anonymous Visitor",
              messageContent: message?.content || "",
              messageType: message?.type || "text",
              conversationId: window.CRISP_TOKEN_ID
            };

            console.log("Message received from visitor:", messageData);
            sendToZapier(zapierWebhooks.messageReceived, messageData);
          }]);

          // Listen for outgoing messages from agents
          $crisp.push(["on", "message:sent", function(message) {
            const messageData = {
              messageId: message?.id || "unknown",
              senderEmail: message?.from || "agent",
              senderName: message?.author || "Support Agent",
              messageContent: message?.content || "",
              messageType: message?.type || "text",
              conversationId: window.CRISP_TOKEN_ID,
              isAgentMessage: true
            };

            console.log("Message sent by agent:", messageData);
            sendToZapier(zapierWebhooks.messageReceived, messageData);
          }]);

          // Listen for conversation opened
          $crisp.push(["on", "session:loaded", function() {
            const sessionData = {
              event: "conversation_started",
              visitorId: window.CRISP_TOKEN_ID,
              sessionStartTime: new Date().toISOString()
            };

            console.log("Conversation started:", sessionData);
            sendToZapier(zapierWebhooks.conversationStarted, sessionData);
          }]);

          // Listen for user joining
          $crisp.push(["on", "user:email-changed", function(email) {
            const userData = {
              event: "user_joined",
              userEmail: email,
              joinTime: new Date().toISOString(),
              conversationId: window.CRISP_TOKEN_ID
            };

            console.log("User joined:", userData);
            sendToZapier(zapierWebhooks.userJoined, userData);
          }]);
        }
      }

      // Also expose Crisp object methods for manual interactions
      function getCrispStatus() {
        if (typeof $crisp !== "undefined") {
          $crisp.push(["get", "session:data", function(data) {
            console.log("Current chat session data:", data);
          }]);
        }
      }

      function openCrispChat() {
        if (typeof $crisp !== "undefined") {
          $crisp.push(["do", "chat:open"]);
        }
      }

      function closeCrispChat() {
        if (typeof $crisp !== "undefined") {
          $crisp.push(["do", "chat:close"]);
        }
      }

      // Auto-open chat when page loads (optional)
      window.addEventListener("load", function() {
        setTimeout(function() {
          if (typeof $crisp !== "undefined") {
            // Uncomment next line to auto-open chat
            // openCrispChat();
          }
        }, 1000);
      });
    </script>
  </body>
</html>
